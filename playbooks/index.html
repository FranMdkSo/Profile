const CHEAT={"en": ["Change moves at the speed of trust, one conversation at a time.", "Intent, message, relationship: listening connects them.", "SBI for feedback. Ask for feedforward.", "Coach with GROW. Ask twice, stop at two.", "Can't or won't? Diagnose before you react.", "Prepare, talk, follow up.", "Influence is give and take. Know the currencies.", "Map who matters and bring them along on purpose."], "es": ["El cambio avanza a la velocidad de la confianza, conversación a conversación.", "Intención, mensaje, relación: la escucha los conecta.", "SBI para el feedback. Pide feedforward.", "Haz coaching con GROW. Pregunta dos veces, para en dos.", "¿No puede o no quiere? Diagnostica antes de reaccionar.", "Prepara, habla, haz seguimiento.", "La influencia es dar y recibir. Conoce las monedas.", "Mapea quién importa y súmalo a propósito."], "ca": ["El canvi avança a la velocitat de la confiança, conversa a conversa.", "Intenció, missatge, relació: l'escolta els connecta.", "SBI per al feedback. Demana feedforward.", "Fes coaching amb GROW. Pregunta dues vegades, atura't a dos.", "No pot o no vol? Diagnostica abans de reaccionar.", "Prepara, parla, fes el seguiment.", "La influència és donar i rebre. Coneix les monedes.", "Mapeja qui importa i suma'l a propòsit."]};
const AIPF={"en": [{"id": "ch0", "h": "Why AI change is a people change", "hook": "The technology is the easy part. The people part is where value is won or lost.", "secs": [{"id": "ch0-why", "k": "Start here", "h": "The 70% that decides everything", "blocks": [["p", "AI tools arrive in weeks. Value takes much longer, and most of it depends on people. BCG's rule of thumb for AI transformation: about 10% of the effort goes into algorithms, 20% into technology and data, and 70% into people and processes."], ["cards", 3, [["Using is not transforming", "In McKinsey's 2026 State of AI survey, 80% said AI had improved individual productivity, but only 37% reported a positive impact on EBIT.", []], ["Pilots stall", "MIT's NANDA initiative (2025) found that only about 5% of gen AI pilots reached measurable impact on profit and loss.", []], ["The barriers are human", "In Prosci's research, 56% to 64% of reported AI implementation challenges were human factors, not technical ones.", []]]], ["callout", "Your role as a manager: turn individual experiments into better teamwork, while keeping people confident, skilled and safe.", true]]}, {"id": "ch0-map", "k": "Seven paradigms", "h": "What is different about AI change", "blocks": [["steps", [["It is a people change", "Most of the value comes from how people and processes change, not from the tool."], ["Using is not transforming", "Value comes from redesigning work, not from adding tools to the old job."], ["Your people may be ahead of you", "McKinsey (2025) found employees were about three times more likely to be using gen AI than their leaders expected. Much of that use is hidden."], ["Change never stops", "AI change is a stream of updates, not one go-live. Prosci's research points to people managers as the lever, and to middle managers as the group that resists most."], ["New teammates", "Teams now include AI agents. Microsoft's 2025 Work Trend Index expects everyone to manage agents."], ["The frontier is jagged", "AI is excellent at some tasks and wrong with confidence at others, and the line keeps moving."], ["New human risks", "Fear of becoming obsolete, low-quality AI work and the quiet loss of skills."]]], ["two", ["Classic change", "A project with a start, a go-live and an end. Train once, then adopt."], ["AI change", "A continuous flow of new capabilities. Learn by doing, together, every week."]]]}], "sum": [["70%", "Value comes from people and how work changes."], ["Transform", "Using AI is not the same as redesigning work."], ["Continuous", "AI change does not end; managers make it stick."]], "rem": "The tools are the easy part. Lead the people part."}, {"id": "ch1", "h": "Make sense of AI for your team", "hook": "People can cope with uncertainty. They struggle with silence.", "secs": [{"id": "ch1-frontier", "k": "Know the terrain", "h": "The jagged frontier", "blocks": [["p", "In a field experiment with 758 BCG consultants (Dell'Acqua, Mollick and colleagues, 2023), people using AI finished more tasks, faster and to a higher quality on work within AI's capabilities. On a task designed to sit outside them, the share of correct answers fell from 84% without AI to between 60% and 70% with it. The frontier is jagged and it moves: you only learn where it lies by using AI on real work."], ["cards", 2, [["Usually inside the frontier", "", ["Drafting, rewriting and summarising", "Structuring ideas and brainstorming", "Translating and adapting tone", "A first pass at analysis"]], ["Check with care", "", ["Facts, numbers, names and sources", "Anything new, unusual or high-stakes", "Judgements about people", "Anything that sounds very sure of itself"]]]], ["callout", "Two ways of working have been observed: some people split tasks between themselves and the AI, others weave the two together step by step. Both need someone who knows where the AI tends to fail."]]}, {"id": "ch1-story", "k": "Your narrative", "h": "Your team's AI story in four sentences", "blocks": [["steps", [["Why", "Why AI matters for our team and our customers now."], ["What changes", "Which parts of our work will change first."], ["What stays", "What stays human here: judgement, relationships, accountability."], ["How we'll learn", "How we will try, share and decide together, and what support you will get."]]], ["callout", "Say what you know, what you don't know yet and when you expect to know more. Honesty about uncertainty builds more trust than false certainty.", true]]}, {"id": "ch1-write", "k": "Tool", "h": "Write your story", "blocks": [["builder", "story", [["Why", "e.g. Our customers expect faster answers, and AI can take routine work off our plate."], ["What changes", "e.g. First drafts of reports and replies to standard questions."], ["What stays", "e.g. Advice to customers, decisions about people, anything we sign."], ["How we'll learn", "e.g. Two-week experiments, a weekly show-and-tell, training in March."]]]]}], "sum": [["Jagged", "AI is brilliant at some tasks and confidently wrong at others."], ["Story", "Why, what changes, what stays, how we'll learn."], ["Honesty", "Name what you don't know yet."]], "rem": "Fill the silence before rumours do."}, {"id": "ch2", "h": "The obsolescence conversation", "hook": "Fear rarely says its name. Ask, listen, then help people see a path.", "secs": [{"id": "ch2-fear", "k": "What is going on", "h": "The fear of becoming obsolete", "blocks": [["p", "Concern about losing one's job to AI is rising: in Mercer's 2026 global survey it reached 40% of employees, up from 28% in 2024. A newer, quieter fear sits next to it: not losing the job, but losing relevance. Gallup (2026) found that AI-related job anxiety goes with lower engagement and higher burnout, and that it is lower where people experience well-structured management."], ["cards", 3, [["Security", "Will I still have a job here?", []], ["Status", "Will my expertise still matter?", []], ["Identity", "Who am I at work if AI does what I'm good at?", []]]], ["callout", "Psychological safety matters more, not less. A 2026 study linked AI-related job insecurity to burnout, partly by eroding psychological safety, and found that confidence in using AI softens the effect."]]}, {"id": "ch2-talk", "k": "The conversation", "h": "Five steps", "blocks": [["steps", [["Open the door", "\"How are you feeling about AI and your role?\" Ask it in one-to-ones, not only in town halls."], ["Listen first", "Paraphrase, ask what else, and resist the urge to reassure too soon."], ["Be honest", "Share what you know and what you don't. Never promise what you can't keep."], ["Find the path", "Which parts of their work grow in value? Which skills would help? What could they try this month?"], ["Agree a next step", "One experiment, one skill, one date to talk again."]]], ["two", ["Avoid", "\"Don't worry, nothing will change.\""], ["Try", "\"Some of our work will change. Let's look at yours together and decide where you want to grow.\""]], ["link", "Prepare with Human First: Difficult conversations", "#human-first/ch5"]]}, {"id": "ch2-bank", "k": "Question bank", "h": "Questions that open the conversation", "blocks": [["bank", [["Feelings", "Name what is there.", ["What excites you about AI, and what worries you?", "What have you heard that concerns you?", "What would help you feel more confident?"], "Accept the answer. Don't argue with feelings."], ["Value", "Find what grows.", ["Which parts of your work matter most to customers or colleagues?", "Where does your judgement make the biggest difference?", "What do people come to you for?"], "Point to strengths that AI does not replace."], ["Growth", "Open a path.", ["Which tasks would you happily hand over to AI?", "What would you do with two extra hours a week?", "Which skill would make you more valuable a year from now?"], "Turn the answer into a small, dated experiment."]]]]}], "sum": [["Three fears", "Security, status and identity."], ["Listen first", "Open the door, listen, be honest."], ["A path", "End with one concrete next step."]], "rem": "Fear shrinks when people can see a path."}, {"id": "ch3", "h": "Make experimenting safe", "hook": "If people hide their AI use, you lose what they have learned.", "secs": [{"id": "ch3-hidden", "k": "The hidden crowd", "h": "Your team is probably already using AI", "blocks": [["p", "Ethan Mollick calls people who use AI quietly without telling anyone \"secret cyborgs\". They hide it because the rules are unclear, because they fear looking less capable, or because they worry the time saved will turn into more work or fewer jobs. Hidden use means hidden risks and lost learning."], ["cards", 3, [["Leadership", "Sets the direction, the permissions and the incentives.", []], ["Lab", "A few people who test, build and share what works.", []], ["Crowd", "Everyone using AI on real work, where most of the good ideas come from.", []]]], ["note", "Leadership, Lab and Crowd is Ethan Mollick's framework for AI in organisations (One Useful Thing, 2025). In a team, you are the leadership, a few volunteers form the lab and the whole team is the crowd."]]}, {"id": "ch3-rules", "k": "Tool", "h": "Set your team's experimentation rules", "blocks": [["cards", 3, [["Go ahead", "", ["Drafting, summarising and brainstorming with approved tools", "Internal, low-risk tasks you check yourself", "Learning and practice"]], ["Ask first", "", ["Anything a customer or regulator will see", "Anything involving decisions about people", "New tools or new data sources"]], ["Never", "", ["Confidential or personal data in unapproved tools", "Sending AI output you have not checked", "Hiding that AI did a significant part of the work"]]]], ["callout", "Adapt the lists to your organisation's AI policy. Clear rules increase safe use; vague rules push it underground."]]}, {"id": "ch3-share", "k": "Make learning visible", "h": "Turn private tricks into team knowledge", "blocks": [["steps", [["Show and tell", "Ten minutes in a team meeting: one use case, one prompt, one failure."], ["Recognise sharing", "Praise the person who shares, not only the one who saves time."], ["Protect the gain", "Agree how saved time will be used: better work, learning, fewer late evenings, not just more volume."], ["Keep a library", "One shared page with prompts, examples and lessons learned."]]]]}], "sum": [["Hidden use", "People hide AI when rules are vague or sharing feels risky."], ["Clear rules", "Go ahead, ask first, never."], ["Visible learning", "Show and tell, recognise sharing, protect the gain."]], "rem": "Make it safe to try and normal to share."}, {"id": "ch4", "h": "Redesign the work together", "hook": "Don't bolt AI onto the old job. Decide which work should change.", "secs": [{"id": "ch4-why", "k": "Beyond tools", "h": "From tasks to workflows", "blocks": [["p", "Deloitte's 2026 Global Human Capital Trends found that only 6% of leaders say they are making progress in designing how people and AI work together. McKinsey's research points the same way: value comes from rethinking work end to end, not from speeding up single tasks. Start where you can: your team's real work, task by task."], ["tiles", [["A", "Automate", "AI does it and a person checks a sample. Repetitive, rule-based work where errors are easy to catch."], ["+", "Augment", "AI drafts or analyses; a person decides and finishes. Most knowledge work."], ["H", "Keep human", "Relationships, empathy, accountability, ethics and new judgement. AI can help you prepare."], ["×", "Stop", "Work that no longer adds value. Ask why it is done at all."]]], ["callout", "Ethan Mollick suggests every team ask which useful work stops being valuable once AI can do it. Some tasks shouldn't be automated; they should be dropped.", true]]}, {"id": "ch4-sort", "k": "Tool", "h": "Sort your team's tasks", "blocks": [["sorter"]]}, {"id": "ch4-session", "k": "Run it with your team", "h": "A 60-minute redesign session", "blocks": [["steps", [["List", "Everyone lists their ten most time-consuming tasks."], ["Sort", "Use the sorter together, and disagree out loud."], ["Pick", "Choose two tasks to automate or augment this month."], ["Test", "Run the experiment for two weeks with a named owner."], ["Review", "Keep, adapt or drop it, and decide what to do with the time saved."]]]]}], "sum": [["Redesign", "Change the work, not just the tools."], ["Four options", "Automate, augment, keep human or stop."], ["Together", "Sort tasks with the people who do them."]], "rem": "Redesign with your team, not for them."}, {"id": "ch5", "h": "Leading people and agents", "hook": "You can delegate the task to AI. You can't delegate the accountability.", "secs": [{"id": "ch5-agent", "k": "A new role", "h": "Everyone becomes an agent manager", "blocks": [["p", "Microsoft's 2025 Work Trend Index describes teams of people and AI agents, and a new role for everyone: the \"agent boss\" who builds, delegates to and manages agents. It also raises a new question for leaders: what is the right balance of people and agents for each task? For you, this means leading people who, in turn, lead agents."], ["cards", 3, [["Delegate clearly", "Give the AI a goal, context, limits and an example of good, as you would a new colleague.", []], ["Supervise wisely", "The higher the risk, the closer the review. Spot-check even what usually works.", []], ["Own the result", "Whoever sends it owns it. \"The AI did it\" is never an answer.", []]]]]}, {"id": "ch5-rights", "k": "Decision rights", "h": "Who does what: people and AI", "blocks": [["table", ["Decision", "AI may…", "A person…"], [["High risk or hard to reverse", "Give input only", "Recommends, decides and is accountable"], ["Medium risk or partly reversible", "Give input and recommend", "Decides and is accountable"], ["Low risk, reversible and frequent", "Decide within agreed limits", "Monitors, samples and owns the rules"]]], ["note", "Simplified from the decision-rights logic in Co-Intelligence AI Decision Making, which extends Bain's RAPID model to AI."], ["link", "Map your team's decisions: Co-Intelligence AI Decision Making", "../maturity/?lang={lang}#hx"]]}, {"id": "ch5-coach", "k": "Coaching in the AI era", "h": "Coach the way people work with AI", "blocks": [["cards", 2, [["Ask about the process", "\"How did you use AI here? What did you check? What did you change?\"", []], ["Watch for skill drift", "Make sure people still practise the core skills of their role, not just the prompting.", []]]], ["link", "Refresh your coaching: Human First, Coaching conversations", "#human-first/ch3"]]}], "sum": [["Agent manager", "Everyone delegates to and supervises AI."], ["Risk sets the role", "The higher the risk, the less AI autonomy."], ["Accountability", "The person who sends it owns it."]], "rem": "Delegate the task, never the accountability."}, {"id": "ch6", "h": "Protect quality and judgement", "hook": "Polished is not the same as good.", "secs": [{"id": "ch6-slop", "k": "A new problem", "h": "Workslop", "blocks": [["p", "Researchers from Stanford's Social Media Lab and BetterUp Labs (Harvard Business Review, 2025) coined \"workslop\": AI-generated work that looks polished but lacks substance, and shifts the effort onto whoever receives it. In their survey of 1,150 US workers, about 40% had received some in the previous month; each case took almost two hours to sort out, and many saw the sender as less capable and less trustworthy. Deloitte (2026) found that around 80% of leaders worry people use AI to look more productive than they are."], ["two", ["Workslop", "A long, confident summary that answers a question nobody asked and takes an hour to fix."], ["Good AI-assisted work", "A short draft with a clear point, checked facts and a note on what AI did."]]]}, {"id": "ch6-skill", "k": "Keep thinking", "h": "Don't let skills fade", "blocks": [["p", "In a 2025 study by Microsoft Research and Carnegie Mellon University with 319 knowledge workers, more confidence in AI went with less critical thinking, while more confidence in one's own skills went with more. The risk is quiet deskilling: people check outputs but stop practising the thinking behind them."], ["cards", 3, [["Think first", "Write your own view or outline before asking the AI.", []], ["Ask for the reasoning", "Ask the AI to show its steps and sources, then challenge them.", []], ["Practise without it", "Do key tasks unaided from time to time, especially when you are new to the role.", []]]]]}, {"id": "ch6-check", "k": "Tool", "h": "Before you send it: the quality check", "blocks": [["checklist", [["Substance", "Does it move the task forward?", [["It answers the actual question or need.", false], ["I could explain and defend every point in it.", false]]], ["Accuracy", "Have you checked it?", [["I have checked facts, numbers, names and sources.", false], ["It contains no confidential or personal data that shouldn't be there.", false]]], ["Respect for the reader", "Is it worth their time?", [["It is as short as it can be.", false], ["I'm happy to own it, and I've said where AI did significant work.", false]]]]]]}], "sum": [["Workslop", "Polished but empty work shifts effort onto others."], ["Think first", "Keep practising the skills behind the output."], ["Check", "Substance, accuracy and respect for the reader."]], "rem": "Use AI to raise the bar, not to lower the effort."}, {"id": "ch7", "h": "Make it stick", "hook": "Measure value, not logins. Build habits, not launches.", "secs": [{"id": "ch7-measure", "k": "What to measure", "h": "Value, not usage", "blocks": [["table", ["Instead of…", "Measure…"], [["Licences and logins", "Time freed, and how it was reused"], ["Prompts written", "Quality: errors, rework, customer feedback"], ["Pilots launched", "Work redesigned and still in place after three months"], ["Training hours", "Confidence and skill: can people do it, and judge it?"]]], ["callout", "Pilots alone don't create value. Scale what works, stop what doesn't and say why."]]}, {"id": "ch7-rhythm", "k": "Team habits", "h": "Rhythms that keep change going", "blocks": [["steps", [["Weekly", "Five minutes in the team meeting: one AI win, one failure, one question."], ["Monthly", "Review the experiments: keep, adapt or stop. Update the task map."], ["Quarterly", "Revisit the charter, the skills plan and how saved time is being used."], ["Always", "In one-to-ones, ask: how is AI changing your work, and how do you feel about it?"]]]]}, {"id": "ch7-charter", "k": "Tool", "h": "Your team AI charter", "blocks": [["builder", "charter", [["Our purpose with AI", "e.g. More time for customers and for work that needs our judgement."], ["What stays human", "e.g. Advice to customers, decisions about people, anything we sign."], ["Our rules", "Go ahead / ask first / never."], ["How we share", "e.g. Show-and-tell every Monday and a shared prompt library."], ["How we check quality", "e.g. The quality check before anything leaves the team."], ["How we grow", "e.g. One new AI skill per quarter; we pair up to learn."]]]]}], "sum": [["Value", "Measure time reused, quality and work redesigned."], ["Rhythm", "Weekly, monthly and quarterly habits."], ["Charter", "Write down how your team works with AI."]], "rem": "Small habits every week beat big launches."}], "es": [{"id": "ch0", "h": "Por qué el cambio con IA es un cambio de personas", "hook": "La tecnología es la parte fácil. El valor se gana o se pierde en la parte humana.", "secs": [{"id": "ch0-why", "k": "Empieza aquí", "h": "El 70% que lo decide todo", "blocks": [["p", "Las herramientas de IA llegan en semanas. El valor tarda mucho más y depende sobre todo de las personas. La regla práctica de BCG para la transformación con IA: alrededor del 10% del esfuerzo va a los algoritmos, el 20% a la tecnología y los datos, y el 70% a las personas y los procesos."], ["cards", 3, [["Usar no es transformar", "En la encuesta State of AI 2026 de McKinsey, el 80% dijo que la IA había mejorado su productividad individual, pero solo el 37% veía un impacto positivo en el EBIT.", []], ["Los pilotos se estancan", "La iniciativa NANDA del MIT (2025) encontró que solo alrededor del 5% de los pilotos de IA generativa llegaba a un impacto medible en la cuenta de resultados.", []], ["Las barreras son humanas", "En la investigación de Prosci, entre el 56% y el 64% de los obstáculos de implantación de la IA eran factores humanos, no técnicos.", []]]], ["callout", "Tu papel como manager: convertir experimentos individuales en un mejor trabajo de equipo, manteniendo a las personas seguras, capaces y con confianza.", true]]}, {"id": "ch0-map", "k": "Siete paradigmas", "h": "Qué tiene de distinto el cambio con IA", "blocks": [["steps", [["Es un cambio de personas", "La mayor parte del valor viene de cómo cambian las personas y los procesos, no de la herramienta."], ["Usar no es transformar", "El valor llega al rediseñar el trabajo, no al añadir herramientas al puesto de siempre."], ["Tu equipo puede ir por delante", "McKinsey (2025) encontró que los empleados tenían unas tres veces más probabilidades de usar IA generativa de lo que esperaban sus líderes. Gran parte de ese uso está oculto."], ["El cambio no se detiene", "El cambio con IA es un flujo de novedades, no una puesta en marcha. La investigación de Prosci señala a los managers como la palanca, y a los mandos intermedios como el grupo que más se resiste."], ["Nuevos compañeros", "Los equipos ya incluyen agentes de IA. El Work Trend Index 2025 de Microsoft prevé que todos gestionemos agentes."], ["La frontera es irregular", "La IA es excelente en unas tareas y se equivoca con seguridad en otras, y la línea se mueve."], ["Nuevos riesgos humanos", "El miedo a quedarse obsoleto, el trabajo de IA de baja calidad y la pérdida silenciosa de habilidades."]]], ["two", ["Cambio clásico", "Un proyecto con inicio, puesta en marcha y final. Se forma una vez y se adopta."], ["Cambio con IA", "Un flujo continuo de nuevas capacidades. Se aprende haciendo, en equipo, cada semana."]]]}], "sum": [["70%", "El valor viene de las personas y de cómo cambia el trabajo."], ["Transformar", "Usar IA no es lo mismo que rediseñar el trabajo."], ["Continuo", "El cambio con IA no termina; los managers hacen que perdure."]], "rem": "Las herramientas son la parte fácil. Lidera la parte humana."}, {"id": "ch1", "h": "Dar sentido a la IA en tu equipo", "hook": "Las personas soportan la incertidumbre. Lo que les cuesta es el silencio.", "secs": [{"id": "ch1-frontier", "k": "Conoce el terreno", "h": "La frontera irregular", "blocks": [["p", "En un experimento de campo con 758 consultores de BCG (Dell'Acqua, Mollick y otros, 2023), quienes usaban IA terminaron más tareas, más rápido y con más calidad en trabajos dentro de las capacidades de la IA. En una tarea diseñada para quedar fuera de ellas, el porcentaje de respuestas correctas cayó del 84% sin IA a entre el 60% y el 70% con ella. La frontera es irregular y se mueve: solo se descubre dónde está usando la IA en trabajo real."], ["cards", 2, [["Suele estar dentro de la frontera", "", ["Redactar, reescribir y resumir", "Estructurar ideas y hacer lluvia de ideas", "Traducir y adaptar el tono", "Una primera pasada de análisis"]], ["Revisa con cuidado", "", ["Datos, cifras, nombres y fuentes", "Todo lo nuevo, inusual o de alto impacto", "Juicios sobre personas", "Todo lo que suena demasiado seguro"]]]], ["callout", "Se han observado dos formas de trabajar: unas personas reparten las tareas entre ellas y la IA; otras entrelazan ambas paso a paso. Las dos necesitan a alguien que sepa dónde suele fallar la IA."]]}, {"id": "ch1-story", "k": "Tu relato", "h": "La historia de la IA de tu equipo en cuatro frases", "blocks": [["steps", [["Por qué", "Por qué la IA importa ahora para nuestro equipo y nuestros clientes."], ["Qué cambia", "Qué partes de nuestro trabajo cambiarán primero."], ["Qué se queda", "Qué sigue siendo humano aquí: el juicio, las relaciones, la responsabilidad."], ["Cómo aprenderemos", "Cómo vamos a probar, compartir y decidir juntos, y qué apoyo tendréis."]]], ["callout", "Di lo que sabes, lo que aún no sabes y cuándo esperas saber más. La honestidad sobre la incertidumbre genera más confianza que una falsa seguridad.", true]]}, {"id": "ch1-write", "k": "Herramienta", "h": "Escribe tu historia", "blocks": [["builder", "story", [["Por qué", "p. ej. Nuestros clientes esperan respuestas más rápidas y la IA puede quitarnos trabajo rutinario."], ["Qué cambia", "p. ej. Los primeros borradores de informes y las respuestas a preguntas habituales."], ["Qué se queda", "p. ej. El asesoramiento a clientes, las decisiones sobre personas, todo lo que firmamos."], ["Cómo aprenderemos", "p. ej. Experimentos de dos semanas, una demo semanal y formación en marzo."]]]]}], "sum": [["Irregular", "La IA es brillante en unas tareas y se equivoca con seguridad en otras."], ["Relato", "Por qué, qué cambia, qué se queda, cómo aprenderemos."], ["Honestidad", "Nombra lo que aún no sabes."]], "rem": "Llena el silencio antes de que lo hagan los rumores."}, {"id": "ch2", "h": "La conversación sobre quedarse obsoleto", "hook": "El miedo rara vez dice su nombre. Pregunta, escucha y ayuda a ver un camino.", "secs": [{"id": "ch2-fear", "k": "Qué está pasando", "h": "El miedo a quedarse obsoleto", "blocks": [["p", "La preocupación por perder el empleo por la IA crece: en la encuesta global de Mercer de 2026 alcanzó al 40% de los empleados, frente al 28% de 2024. Junto a ella aparece un miedo más silencioso: no perder el puesto, sino perder relevancia. Gallup (2026) encontró que la ansiedad laboral ligada a la IA va de la mano de menos compromiso y más desgaste, y que es menor donde las personas viven una gestión bien estructurada."], ["cards", 3, [["Seguridad", "¿Seguiré teniendo trabajo aquí?", []], ["Estatus", "¿Seguirá importando lo que sé?", []], ["Identidad", "¿Quién soy en el trabajo si la IA hace lo que yo hago bien?", []]]], ["callout", "La seguridad psicológica importa más, no menos. Un estudio de 2026 vinculó la inseguridad laboral por la IA con el desgaste, en parte porque erosiona la seguridad psicológica, y encontró que la confianza en el uso de la IA suaviza ese efecto."]]}, {"id": "ch2-talk", "k": "La conversación", "h": "Cinco pasos", "blocks": [["steps", [["Abre la puerta", "«¿Cómo te sientes con la IA y con tu rol?» Pregúntalo en las reuniones uno a uno, no solo en las reuniones generales."], ["Escucha primero", "Parafrasea, pregunta qué más y resiste las ganas de tranquilizar demasiado pronto."], ["Sé honesto", "Comparte lo que sabes y lo que no. No prometas nunca lo que no puedes cumplir."], ["Encuentra el camino", "¿Qué partes de su trabajo ganan valor? ¿Qué habilidades le ayudarían? ¿Qué podría probar este mes?"], ["Acordad un siguiente paso", "Un experimento, una habilidad y una fecha para volver a hablar."]]], ["two", ["Evita", "«Tranquilo, no va a cambiar nada.»"], ["Prueba", "«Parte de nuestro trabajo va a cambiar. Miremos el tuyo juntos y decidamos dónde quieres crecer.»"]], ["link", "Prepárate con Human First: Conversaciones difíciles", "#human-first/ch5"]]}, {"id": "ch2-bank", "k": "Banco de preguntas", "h": "Preguntas que abren la conversación", "blocks": [["bank", [["Emociones", "Nombrar lo que hay.", ["¿Qué te ilusiona de la IA y qué te preocupa?", "¿Qué has oído que te inquieta?", "¿Qué te ayudaría a sentirte con más confianza?"], "Acepta la respuesta. No discutas con las emociones."], ["Valor", "Encontrar lo que crece.", ["¿Qué partes de tu trabajo importan más a clientes o compañeros?", "¿Dónde marca más diferencia tu criterio?", "¿Para qué te busca la gente?"], "Señala fortalezas que la IA no sustituye."], ["Crecimiento", "Abrir un camino.", ["¿Qué tareas le pasarías encantado a la IA?", "¿Qué harías con dos horas más a la semana?", "¿Qué habilidad te haría más valioso dentro de un año?"], "Convierte la respuesta en un experimento pequeño y con fecha."]]]]}], "sum": [["Tres miedos", "Seguridad, estatus e identidad."], ["Primero escuchar", "Abre la puerta, escucha, sé honesto."], ["Un camino", "Termina con un siguiente paso concreto."]], "rem": "El miedo se encoge cuando se ve un camino."}, {"id": "ch3", "h": "Hacer seguro experimentar", "hook": "Si la gente esconde su uso de la IA, pierdes lo que ha aprendido.", "secs": [{"id": "ch3-hidden", "k": "La multitud oculta", "h": "Probablemente tu equipo ya usa IA", "blocks": [["p", "Ethan Mollick llama «secret cyborgs» a quienes usan la IA en silencio sin contárselo a nadie. Lo esconden porque las reglas no están claras, porque temen parecer menos capaces o porque les preocupa que el tiempo ahorrado se convierta en más trabajo o en menos puestos. Un uso oculto significa riesgos ocultos y aprendizaje perdido."], ["cards", 3, [["Liderazgo", "Marca la dirección, los permisos y los incentivos.", []], ["Laboratorio", "Unas pocas personas que prueban, construyen y comparten lo que funciona.", []], ["Multitud", "Todo el equipo usando IA en trabajo real, de donde salen la mayoría de las buenas ideas.", []]]], ["note", "Leadership, Lab and Crowd es el marco de Ethan Mollick para la IA en las organizaciones (One Useful Thing, 2025). En un equipo, tú eres el liderazgo, unos pocos voluntarios forman el laboratorio y todo el equipo es la multitud."]]}, {"id": "ch3-rules", "k": "Herramienta", "h": "Define las reglas de experimentación del equipo", "blocks": [["cards", 3, [["Adelante", "", ["Redactar, resumir y generar ideas con herramientas aprobadas", "Tareas internas de bajo riesgo que revisas tú", "Aprender y practicar"]], ["Pregunta antes", "", ["Todo lo que verá un cliente o un regulador", "Todo lo que implique decisiones sobre personas", "Herramientas o fuentes de datos nuevas"]], ["Nunca", "", ["Datos confidenciales o personales en herramientas no aprobadas", "Enviar resultados de IA sin revisarlos", "Ocultar que la IA hizo una parte importante del trabajo"]]]], ["callout", "Adapta las listas a la política de IA de tu organización. Las reglas claras aumentan el uso seguro; las reglas vagas lo esconden."]]}, {"id": "ch3-share", "k": "Hacer visible el aprendizaje", "h": "Convierte los trucos privados en conocimiento del equipo", "blocks": [["steps", [["Demo rápida", "Diez minutos en la reunión de equipo: un caso de uso, un prompt, un fallo."], ["Reconoce a quien comparte", "Valora a quien comparte, no solo a quien ahorra tiempo."], ["Protege la ganancia", "Acordad cómo se usará el tiempo ahorrado: mejor trabajo, aprendizaje, menos horas extra, no solo más volumen."], ["Ten una biblioteca", "Una página compartida con prompts, ejemplos y lecciones aprendidas."]]]]}], "sum": [["Uso oculto", "Se esconde la IA cuando las reglas son vagas o compartir parece arriesgado."], ["Reglas claras", "Adelante, pregunta antes, nunca."], ["Aprendizaje visible", "Demos, reconocer a quien comparte, proteger la ganancia."]], "rem": "Que probar sea seguro y compartir sea normal."}, {"id": "ch4", "h": "Rediseñar el trabajo juntos", "hook": "No pegues la IA al puesto de siempre. Decide qué trabajo debe cambiar.", "secs": [{"id": "ch4-why", "k": "Más allá de las herramientas", "h": "De tareas a flujos de trabajo", "blocks": [["p", "El informe Global Human Capital Trends 2026 de Deloitte encontró que solo el 6% de los líderes dice avanzar en el diseño de cómo trabajan juntas las personas y la IA. La investigación de McKinsey apunta en la misma dirección: el valor viene de repensar el trabajo de principio a fin, no de acelerar tareas sueltas. Empieza donde puedes: el trabajo real de tu equipo, tarea por tarea."], ["tiles", [["A", "Automatizar", "La IA lo hace y una persona revisa una muestra. Trabajo repetitivo, con reglas, donde los errores se detectan fácilmente."], ["+", "Aumentar", "La IA prepara o analiza; una persona decide y termina. La mayor parte del trabajo del conocimiento."], ["H", "Mantener humano", "Relaciones, empatía, responsabilidad, ética y criterio nuevo. La IA puede ayudarte a prepararlo."], ["×", "Dejar de hacer", "Trabajo que ya no aporta valor. Pregúntate por qué se hace."]]], ["callout", "Ethan Mollick propone que cada equipo se pregunte qué trabajo útil deja de tener valor cuando la IA puede hacerlo. Algunas tareas no hay que automatizarlas: hay que dejarlas.", true]]}, {"id": "ch4-sort", "k": "Herramienta", "h": "Clasifica las tareas de tu equipo", "blocks": [["sorter"]]}, {"id": "ch4-session", "k": "Hazlo con tu equipo", "h": "Una sesión de rediseño de 60 minutos", "blocks": [["steps", [["Listar", "Cada persona apunta sus diez tareas que más tiempo le llevan."], ["Clasificar", "Usad el clasificador juntos y discrepad en voz alta."], ["Elegir", "Escoged dos tareas para automatizar o aumentar este mes."], ["Probar", "Haced el experimento durante dos semanas, con una persona responsable."], ["Revisar", "Mantenedlo, adaptadlo o descartadlo, y decidid qué hacer con el tiempo ahorrado."]]]]}], "sum": [["Rediseñar", "Cambia el trabajo, no solo las herramientas."], ["Cuatro opciones", "Automatizar, aumentar, mantener humano o dejar de hacer."], ["Juntos", "Clasifica las tareas con quienes las hacen."]], "rem": "Rediseña con tu equipo, no para tu equipo."}, {"id": "ch5", "h": "Liderar personas y agentes", "hook": "Puedes delegar la tarea en la IA. No puedes delegar la responsabilidad.", "secs": [{"id": "ch5-agent", "k": "Un nuevo rol", "h": "Todos pasamos a gestionar agentes", "blocks": [["p", "El Work Trend Index 2025 de Microsoft describe equipos de personas y agentes de IA, y un nuevo rol para todos: el «agent boss», que crea agentes, les delega trabajo y los gestiona. También plantea una nueva pregunta para los líderes: ¿cuál es el equilibrio adecuado entre personas y agentes para cada tarea? Para ti, significa liderar a personas que, a su vez, lideran agentes."], ["cards", 3, [["Delega con claridad", "Dale a la IA un objetivo, contexto, límites y un ejemplo de lo que está bien, como harías con alguien nuevo.", []], ["Supervisa con criterio", "Cuanto mayor el riesgo, más cercana la revisión. Comprueba al azar incluso lo que suele funcionar.", []], ["Responde del resultado", "Quien lo envía es responsable. «Lo hizo la IA» nunca es una respuesta.", []]]]]}, {"id": "ch5-rights", "k": "Derechos de decisión", "h": "Quién hace qué: personas e IA", "blocks": [["table", ["Decisión", "La IA puede…", "Una persona…"], [["Alto riesgo o difícil de revertir", "Solo aportar información", "Recomienda, decide y responde"], ["Riesgo medio o parcialmente reversible", "Aportar información y recomendar", "Decide y responde"], ["Bajo riesgo, reversible y frecuente", "Decidir dentro de límites acordados", "Supervisa, revisa muestras y responde de las reglas"]]], ["note", "Simplificado de la lógica de derechos de decisión de Co-Intelligence AI Decision Making, que amplía el modelo RAPID de Bain a la IA."], ["link", "Mapea las decisiones de tu equipo: Co-Intelligence AI Decision Making", "../maturity/?lang={lang}#hx"]]}, {"id": "ch5-coach", "k": "Coaching en la era de la IA", "h": "Haz coaching sobre cómo se trabaja con la IA", "blocks": [["cards", 2, [["Pregunta por el proceso", "«¿Cómo usaste la IA aquí? ¿Qué revisaste? ¿Qué cambiaste?»", []], ["Vigila la pérdida de habilidades", "Asegúrate de que las personas siguen practicando las habilidades clave de su rol, no solo los prompts.", []]]], ["link", "Repasa tu coaching: Human First, Conversaciones de coaching", "#human-first/ch3"]]}], "sum": [["Gestionar agentes", "Todos delegamos en la IA y la supervisamos."], ["El riesgo marca el rol", "Cuanto más riesgo, menos autonomía para la IA."], ["Responsabilidad", "Quien lo envía responde de ello."]], "rem": "Delega la tarea, nunca la responsabilidad."}, {"id": "ch6", "h": "Proteger la calidad y el criterio", "hook": "Pulido no es lo mismo que bueno.", "secs": [{"id": "ch6-slop", "k": "Un problema nuevo", "h": "El «workslop»", "blocks": [["p", "Investigadores del Social Media Lab de Stanford y de BetterUp Labs (Harvard Business Review, 2025) acuñaron «workslop»: trabajo generado con IA que parece pulido pero carece de sustancia y traslada el esfuerzo a quien lo recibe. En su encuesta a 1.150 trabajadores de EE. UU., alrededor del 40% lo había recibido el mes anterior; cada caso costaba casi dos horas resolverlo, y muchos veían a quien lo enviaba como menos capaz y menos fiable. Deloitte (2026) encontró que cerca del 80% de los líderes teme que se use la IA para parecer más productivo de lo que se es."], ["two", ["Workslop", "Un resumen largo y seguro que responde a una pregunta que nadie hizo y cuesta una hora arreglar."], ["Buen trabajo con IA", "Un borrador breve, con una idea clara, datos comprobados y una nota de qué hizo la IA."]]]}, {"id": "ch6-skill", "k": "Seguir pensando", "h": "Que no se pierdan las habilidades", "blocks": [["p", "En un estudio de 2025 de Microsoft Research y la Universidad Carnegie Mellon con 319 trabajadores del conocimiento, más confianza en la IA iba con menos pensamiento crítico, mientras que más confianza en las propias habilidades iba con más. El riesgo es una pérdida silenciosa de habilidades: se revisan los resultados pero se deja de practicar el razonamiento que hay detrás."], ["cards", 3, [["Piensa primero", "Escribe tu propia visión o esquema antes de preguntar a la IA.", []], ["Pide el razonamiento", "Pide a la IA que muestre sus pasos y fuentes, y cuestiónalos.", []], ["Practica sin ella", "Haz tareas clave sin ayuda de vez en cuando, sobre todo si eres nuevo en el puesto.", []]]]]}, {"id": "ch6-check", "k": "Herramienta", "h": "Antes de enviarlo: la revisión de calidad", "blocks": [["checklist", [["Sustancia", "¿Hace avanzar la tarea?", [["Responde a la pregunta o necesidad real.", false], ["Podría explicar y defender cada punto.", false]]], ["Exactitud", "¿Lo has comprobado?", [["He comprobado datos, cifras, nombres y fuentes.", false], ["No contiene datos confidenciales o personales que no deban estar.", false]]], ["Respeto por quien lo lee", "¿Vale su tiempo?", [["Es todo lo breve que puede ser.", false], ["Lo asumo como mío y he indicado dónde la IA hizo una parte importante.", false]]]]]]}], "sum": [["Workslop", "El trabajo pulido pero vacío traslada el esfuerzo a otros."], ["Piensa primero", "Sigue practicando las habilidades que hay detrás."], ["Revisa", "Sustancia, exactitud y respeto por quien lo lee."]], "rem": "Usa la IA para subir el listón, no para bajar el esfuerzo."}, {"id": "ch7", "h": "Que perdure", "hook": "Mide valor, no accesos. Crea hábitos, no lanzamientos.", "secs": [{"id": "ch7-measure", "k": "Qué medir", "h": "Valor, no uso", "blocks": [["table", ["En lugar de…", "Mide…"], [["Licencias y accesos", "Tiempo liberado y cómo se ha reinvertido"], ["Prompts escritos", "Calidad: errores, retrabajo, opinión de clientes"], ["Pilotos lanzados", "Trabajo rediseñado que sigue en marcha a los tres meses"], ["Horas de formación", "Confianza y habilidad: ¿saben hacerlo y juzgarlo?"]]], ["callout", "Los pilotos por sí solos no crean valor. Escala lo que funciona, para lo que no y explica por qué."]]}, {"id": "ch7-rhythm", "k": "Hábitos de equipo", "h": "Ritmos que mantienen vivo el cambio", "blocks": [["steps", [["Cada semana", "Cinco minutos en la reunión de equipo: un acierto con IA, un fallo, una pregunta."], ["Cada mes", "Revisad los experimentos: mantener, adaptar o parar. Actualizad el mapa de tareas."], ["Cada trimestre", "Revisad la carta, el plan de habilidades y el uso del tiempo ahorrado."], ["Siempre", "En las reuniones uno a uno, pregunta: ¿cómo está cambiando la IA tu trabajo y cómo te sientes?"]]]]}, {"id": "ch7-charter", "k": "Herramienta", "h": "La carta de IA de tu equipo", "blocks": [["builder", "charter", [["Nuestro propósito con la IA", "p. ej. Más tiempo para clientes y para el trabajo que necesita nuestro criterio."], ["Lo que sigue siendo humano", "p. ej. El asesoramiento a clientes, las decisiones sobre personas, todo lo que firmamos."], ["Nuestras reglas", "Adelante / pregunta antes / nunca."], ["Cómo compartimos", "p. ej. Demo cada lunes y una biblioteca compartida de prompts."], ["Cómo revisamos la calidad", "p. ej. La revisión de calidad antes de que algo salga del equipo."], ["Cómo crecemos", "p. ej. Una habilidad nueva de IA por trimestre; aprendemos por parejas."]]]]}], "sum": [["Valor", "Mide tiempo reinvertido, calidad y trabajo rediseñado."], ["Ritmo", "Hábitos semanales, mensuales y trimestrales."], ["Carta", "Escribe cómo trabaja tu equipo con la IA."]], "rem": "Los pequeños hábitos semanales ganan a los grandes lanzamientos."}], "ca": [{"id": "ch0", "h": "Per què el canvi amb IA és un canvi de persones", "hook": "La tecnologia és la part fàcil. El valor es guanya o es perd en la part humana.", "secs": [{"id": "ch0-why", "k": "Comença aquí", "h": "El 70% que ho decideix tot", "blocks": [["p", "Les eines d'IA arriben en setmanes. El valor triga molt més i depèn sobretot de les persones. La regla pràctica de BCG per a la transformació amb IA: al voltant del 10% de l'esforç va als algoritmes, el 20% a la tecnologia i les dades, i el 70% a les persones i els processos."], ["cards", 3, [["Fer servir no és transformar", "A l'enquesta State of AI 2026 de McKinsey, el 80% va dir que la IA havia millorat la seva productivitat individual, però només el 37% veia un impacte positiu en l'EBIT.", []], ["Els pilots s'encallen", "La iniciativa NANDA del MIT (2025) va trobar que només al voltant del 5% dels pilots d'IA generativa arribava a un impacte mesurable en el compte de resultats.", []], ["Les barreres són humanes", "A la recerca de Prosci, entre el 56% i el 64% dels obstacles d'implantació de la IA eren factors humans, no tècnics.", []]]], ["callout", "El teu paper com a manager: convertir experiments individuals en una millor feina d'equip, mantenint les persones segures, capaces i amb confiança.", true]]}, {"id": "ch0-map", "k": "Set paradigmes", "h": "Què té de diferent el canvi amb IA", "blocks": [["steps", [["És un canvi de persones", "La major part del valor ve de com canvien les persones i els processos, no de l'eina."], ["Fer servir no és transformar", "El valor arriba en redissenyar la feina, no en afegir eines al lloc de sempre."], ["El teu equip pot anar per davant", "McKinsey (2025) va trobar que els empleats tenien unes tres vegades més probabilitats de fer servir IA generativa del que esperaven els seus líders. Gran part d'aquest ús està amagat."], ["El canvi no s'atura", "El canvi amb IA és un flux de novetats, no una posada en marxa. La recerca de Prosci assenyala els managers com la palanca, i els comandaments intermedis com el grup que més s'hi resisteix."], ["Nous companys", "Els equips ja inclouen agents d'IA. El Work Trend Index 2025 de Microsoft preveu que tothom gestionarà agents."], ["La frontera és irregular", "La IA és excel·lent en unes tasques i s'equivoca amb seguretat en altres, i la línia es mou."], ["Nous riscos humans", "La por de quedar-se obsolet, la feina d'IA de baixa qualitat i la pèrdua silenciosa d'habilitats."]]], ["two", ["Canvi clàssic", "Un projecte amb inici, posada en marxa i final. Es forma un cop i s'adopta."], ["Canvi amb IA", "Un flux continu de noves capacitats. S'aprèn fent, en equip, cada setmana."]]]}], "sum": [["70%", "El valor ve de les persones i de com canvia la feina."], ["Transformar", "Fer servir IA no és el mateix que redissenyar la feina."], ["Continu", "El canvi amb IA no s'acaba; els managers fan que perduri."]], "rem": "Les eines són la part fàcil. Lidera la part humana."}, {"id": "ch1", "h": "Donar sentit a la IA al teu equip", "hook": "Les persones suporten la incertesa. El que els costa és el silenci.", "secs": [{"id": "ch1-frontier", "k": "Coneix el terreny", "h": "La frontera irregular", "blocks": [["p", "En un experiment de camp amb 758 consultors de BCG (Dell'Acqua, Mollick i altres, 2023), qui feia servir IA va acabar més tasques, més ràpid i amb més qualitat en feines dins de les capacitats de la IA. En una tasca dissenyada per quedar-ne fora, el percentatge de respostes correctes va caure del 84% sense IA a entre el 60% i el 70% amb IA. La frontera és irregular i es mou: només es descobreix on és fent servir la IA en feina real."], ["cards", 2, [["Sol ser dins de la frontera", "", ["Redactar, reescriure i resumir", "Estructurar idees i fer pluja d'idees", "Traduir i adaptar el to", "Una primera passada d'anàlisi"]], ["Revisa-ho amb cura", "", ["Dades, xifres, noms i fonts", "Tot el que és nou, inusual o d'alt impacte", "Judicis sobre persones", "Tot el que sona massa segur"]]]], ["callout", "S'han observat dues maneres de treballar: unes persones reparteixen les tasques entre elles i la IA; altres les entrellacen pas a pas. Totes dues necessiten algú que sàpiga on sol fallar la IA."]]}, {"id": "ch1-story", "k": "El teu relat", "h": "La història de la IA del teu equip en quatre frases", "blocks": [["steps", [["Per què", "Per què la IA importa ara per al nostre equip i els nostres clients."], ["Què canvia", "Quines parts de la nostra feina canviaran primer."], ["Què es queda", "Què continua sent humà aquí: el criteri, les relacions, la responsabilitat."], ["Com aprendrem", "Com provarem, compartirem i decidirem junts, i quin suport tindreu."]]], ["callout", "Digues el que saps, el que encara no saps i quan esperes saber-ne més. L'honestedat sobre la incertesa genera més confiança que una falsa seguretat.", true]]}, {"id": "ch1-write", "k": "Eina", "h": "Escriu la teva història", "blocks": [["builder", "story", [["Per què", "p. ex. Els nostres clients esperen respostes més ràpides i la IA ens pot treure feina rutinària."], ["Què canvia", "p. ex. Els primers esborranys d'informes i les respostes a preguntes habituals."], ["Què es queda", "p. ex. L'assessorament als clients, les decisions sobre persones, tot el que signem."], ["Com aprendrem", "p. ex. Experiments de dues setmanes, una demo setmanal i formació al març."]]]]}], "sum": [["Irregular", "La IA és brillant en unes tasques i s'equivoca amb seguretat en altres."], ["Relat", "Per què, què canvia, què es queda, com aprendrem."], ["Honestedat", "Anomena el que encara no saps."]], "rem": "Omple el silenci abans que ho facin els rumors."}, {"id": "ch2", "h": "La conversa sobre quedar-se obsolet", "hook": "La por poques vegades diu el seu nom. Pregunta, escolta i ajuda a veure un camí.", "secs": [{"id": "ch2-fear", "k": "Què està passant", "h": "La por de quedar-se obsolet", "blocks": [["p", "La preocupació per perdre la feina per la IA creix: a l'enquesta global de Mercer de 2026 va arribar al 40% dels empleats, davant del 28% del 2024. Al seu costat apareix una por més silenciosa: no perdre el lloc, sinó perdre rellevància. Gallup (2026) va trobar que l'ansietat laboral lligada a la IA va de la mà de menys compromís i més desgast, i que és menor on les persones viuen una gestió ben estructurada."], ["cards", 3, [["Seguretat", "Continuaré tenint feina aquí?", []], ["Estatus", "Continuarà important el que sé?", []], ["Identitat", "Qui soc a la feina si la IA fa el que jo faig bé?", []]]], ["callout", "La seguretat psicològica importa més, no menys. Un estudi del 2026 va vincular la inseguretat laboral per la IA amb el desgast, en part perquè erosiona la seguretat psicològica, i va trobar que la confiança en l'ús de la IA suavitza aquest efecte."]]}, {"id": "ch2-talk", "k": "La conversa", "h": "Cinc passos", "blocks": [["steps", [["Obre la porta", "«Com et sents amb la IA i amb el teu rol?» Pregunta-ho a les reunions un a un, no només a les reunions generals."], ["Escolta primer", "Parafraseja, pregunta què més i resisteix les ganes de tranquil·litzar massa aviat."], ["Sigues honest", "Comparteix el que saps i el que no. No prometis mai el que no pots complir."], ["Troba el camí", "Quines parts de la seva feina guanyen valor? Quines habilitats l'ajudarien? Què podria provar aquest mes?"], ["Acordeu un pas següent", "Un experiment, una habilitat i una data per tornar-ne a parlar."]]], ["two", ["Evita", "«Tranquil, no canviarà res.»"], ["Prova", "«Part de la nostra feina canviarà. Mirem la teva junts i decidim on vols créixer.»"]], ["link", "Prepara't amb Human First: Converses difícils", "#human-first/ch5"]]}, {"id": "ch2-bank", "k": "Banc de preguntes", "h": "Preguntes que obren la conversa", "blocks": [["bank", [["Emocions", "Anomenar el que hi ha.", ["Què t'il·lusiona de la IA i què et preocupa?", "Què has sentit que t'inquieta?", "Què t'ajudaria a sentir-te amb més confiança?"], "Accepta la resposta. No discuteixis amb les emocions."], ["Valor", "Trobar el que creix.", ["Quines parts de la teva feina importen més a clients o companys?", "On marca més diferència el teu criteri?", "Per a què et busca la gent?"], "Assenyala fortaleses que la IA no substitueix."], ["Creixement", "Obrir un camí.", ["Quines tasques passaries de gust a la IA?", "Què faries amb dues hores més a la setmana?", "Quina habilitat et faria més valuós d'aquí a un any?"], "Converteix la resposta en un experiment petit i amb data."]]]]}], "sum": [["Tres pors", "Seguretat, estatus i identitat."], ["Primer escoltar", "Obre la porta, escolta, sigues honest."], ["Un camí", "Acaba amb un pas següent concret."]], "rem": "La por s'encongeix quan es veu un camí."}, {"id": "ch3", "h": "Fer segur experimentar", "hook": "Si la gent amaga el seu ús de la IA, perds el que ha après.", "secs": [{"id": "ch3-hidden", "k": "La multitud amagada", "h": "Probablement el teu equip ja fa servir IA", "blocks": [["p", "Ethan Mollick anomena «secret cyborgs» les persones que fan servir la IA en silenci sense dir-ho a ningú. Ho amaguen perquè les regles no són clares, perquè temen semblar menys capaces o perquè els preocupa que el temps estalviat es converteixi en més feina o en menys llocs. Un ús amagat vol dir riscos amagats i aprenentatge perdut."], ["cards", 3, [["Lideratge", "Marca la direcció, els permisos i els incentius.", []], ["Laboratori", "Unes poques persones que proven, construeixen i comparteixen el que funciona.", []], ["Multitud", "Tot l'equip fent servir IA en feina real, d'on surten la majoria de les bones idees.", []]]], ["note", "Leadership, Lab and Crowd és el marc d'Ethan Mollick per a la IA a les organitzacions (One Useful Thing, 2025). En un equip, tu ets el lideratge, uns quants voluntaris formen el laboratori i tot l'equip és la multitud."]]}, {"id": "ch3-rules", "k": "Eina", "h": "Defineix les regles d'experimentació de l'equip", "blocks": [["cards", 3, [["Endavant", "", ["Redactar, resumir i generar idees amb eines aprovades", "Tasques internes de baix risc que revises tu", "Aprendre i practicar"]], ["Pregunta abans", "", ["Tot el que veurà un client o un regulador", "Tot el que impliqui decisions sobre persones", "Eines o fonts de dades noves"]], ["Mai", "", ["Dades confidencials o personals en eines no aprovades", "Enviar resultats d'IA sense revisar-los", "Amagar que la IA va fer una part important de la feina"]]]], ["callout", "Adapta les llistes a la política d'IA de la teva organització. Les regles clares augmenten l'ús segur; les regles vagues l'amaguen."]]}, {"id": "ch3-share", "k": "Fer visible l'aprenentatge", "h": "Converteix els trucs privats en coneixement de l'equip", "blocks": [["steps", [["Demo ràpida", "Deu minuts a la reunió d'equip: un cas d'ús, un prompt, un error."], ["Reconeix qui comparteix", "Valora qui comparteix, no només qui estalvia temps."], ["Protegeix el guany", "Acordeu com es farà servir el temps estalviat: millor feina, aprenentatge, menys hores extres, no només més volum."], ["Tingues una biblioteca", "Una pàgina compartida amb prompts, exemples i lliçons apreses."]]]]}], "sum": [["Ús amagat", "S'amaga la IA quan les regles són vagues o compartir sembla arriscat."], ["Regles clares", "Endavant, pregunta abans, mai."], ["Aprenentatge visible", "Demos, reconèixer qui comparteix, protegir el guany."]], "rem": "Que provar sigui segur i compartir sigui normal."}, {"id": "ch4", "h": "Redissenyar la feina junts", "hook": "No enganxis la IA al lloc de sempre. Decideix quina feina ha de canviar.", "secs": [{"id": "ch4-why", "k": "Més enllà de les eines", "h": "De tasques a fluxos de treball", "blocks": [["p", "L'informe Global Human Capital Trends 2026 de Deloitte va trobar que només el 6% dels líders diu que avança en el disseny de com treballen juntes les persones i la IA. La recerca de McKinsey apunta en la mateixa direcció: el valor ve de repensar la feina de cap a cap, no d'accelerar tasques soltes. Comença on pots: la feina real del teu equip, tasca per tasca."], ["tiles", [["A", "Automatitzar", "La IA ho fa i una persona revisa una mostra. Feina repetitiva, amb regles, on els errors es detecten fàcilment."], ["+", "Augmentar", "La IA prepara o analitza; una persona decideix i acaba. La major part de la feina del coneixement."], ["H", "Mantenir humà", "Relacions, empatia, responsabilitat, ètica i criteri nou. La IA et pot ajudar a preparar-ho."], ["×", "Deixar de fer", "Feina que ja no aporta valor. Pregunta't per què es fa."]]], ["callout", "Ethan Mollick proposa que cada equip es pregunti quina feina útil deixa de tenir valor quan la IA la pot fer. Algunes tasques no s'han d'automatitzar: s'han de deixar.", true]]}, {"id": "ch4-sort", "k": "Eina", "h": "Classifica les tasques del teu equip", "blocks": [["sorter"]]}, {"id": "ch4-session", "k": "Fes-ho amb el teu equip", "h": "Una sessió de redisseny de 60 minuts", "blocks": [["steps", [["Llistar", "Cada persona apunta les deu tasques que més temps li porten."], ["Classificar", "Feu servir el classificador junts i discrepeu en veu alta."], ["Triar", "Trieu dues tasques per automatitzar o augmentar aquest mes."], ["Provar", "Feu l'experiment durant dues setmanes, amb una persona responsable."], ["Revisar", "Manteniu-lo, adapteu-lo o descarteu-lo, i decidiu què fer amb el temps estalviat."]]]]}], "sum": [["Redissenyar", "Canvia la feina, no només les eines."], ["Quatre opcions", "Automatitzar, augmentar, mantenir humà o deixar de fer."], ["Junts", "Classifica les tasques amb qui les fa."]], "rem": "Redissenya amb el teu equip, no per al teu equip."}, {"id": "ch5", "h": "Liderar persones i agents", "hook": "Pots delegar la tasca a la IA. No pots delegar la responsabilitat.", "secs": [{"id": "ch5-agent", "k": "Un nou rol", "h": "Tothom passa a gestionar agents", "blocks": [["p", "El Work Trend Index 2025 de Microsoft descriu equips de persones i agents d'IA, i un nou rol per a tothom: l'«agent boss», que crea agents, els delega feina i els gestiona. També planteja una nova pregunta per als líders: quin és l'equilibri adequat entre persones i agents per a cada tasca? Per a tu, vol dir liderar persones que, al seu torn, lideren agents."], ["cards", 3, [["Delega amb claredat", "Dona a la IA un objectiu, context, límits i un exemple del que està bé, com faries amb algú nou.", []], ["Supervisa amb criteri", "Com més risc, més propera la revisió. Comprova a l'atzar fins i tot el que sol funcionar.", []], ["Respon del resultat", "Qui ho envia n'és responsable. «Ho va fer la IA» no és mai una resposta.", []]]]]}, {"id": "ch5-rights", "k": "Drets de decisió", "h": "Qui fa què: persones i IA", "blocks": [["table", ["Decisió", "La IA pot…", "Una persona…"], [["Alt risc o difícil de revertir", "Només aportar informació", "Recomana, decideix i respon"], ["Risc mitjà o parcialment reversible", "Aportar informació i recomanar", "Decideix i respon"], ["Baix risc, reversible i freqüent", "Decidir dins de límits acordats", "Supervisa, revisa mostres i respon de les regles"]]], ["note", "Simplificat de la lògica de drets de decisió de Co-Intelligence AI Decision Making, que amplia el model RAPID de Bain a la IA."], ["link", "Mapeja les decisions del teu equip: Co-Intelligence AI Decision Making", "../maturity/?lang={lang}#hx"]]}, {"id": "ch5-coach", "k": "Coaching a l'era de la IA", "h": "Fes coaching sobre com es treballa amb la IA", "blocks": [["cards", 2, [["Pregunta pel procés", "«Com vas fer servir la IA aquí? Què vas revisar? Què vas canviar?»", []], ["Vigila la pèrdua d'habilitats", "Assegura't que les persones continuen practicant les habilitats clau del seu rol, no només els prompts.", []]]], ["link", "Repassa el teu coaching: Human First, Converses de coaching", "#human-first/ch3"]]}], "sum": [["Gestionar agents", "Tothom delega en la IA i la supervisa."], ["El risc marca el rol", "Com més risc, menys autonomia per a la IA."], ["Responsabilitat", "Qui ho envia en respon."]], "rem": "Delega la tasca, mai la responsabilitat."}, {"id": "ch6", "h": "Protegir la qualitat i el criteri", "hook": "Polit no és el mateix que bo.", "secs": [{"id": "ch6-slop", "k": "Un problema nou", "h": "El «workslop»", "blocks": [["p", "Investigadors del Social Media Lab de Stanford i de BetterUp Labs (Harvard Business Review, 2025) van encunyar «workslop»: feina generada amb IA que sembla polida però no té substància i trasllada l'esforç a qui la rep. A la seva enquesta a 1.150 treballadors dels EUA, al voltant del 40% n'havia rebut el mes anterior; cada cas costava gairebé dues hores resoldre'l, i molts veien qui l'enviava com a menys capaç i menys fiable. Deloitte (2026) va trobar que prop del 80% dels líders tem que es faci servir la IA per semblar més productiu del que s'és."], ["two", ["Workslop", "Un resum llarg i segur que respon a una pregunta que ningú no va fer i costa una hora arreglar."], ["Bona feina amb IA", "Un esborrany breu, amb una idea clara, dades comprovades i una nota del que va fer la IA."]]]}, {"id": "ch6-skill", "k": "Continuar pensant", "h": "Que no es perdin les habilitats", "blocks": [["p", "En un estudi del 2025 de Microsoft Research i la Universitat Carnegie Mellon amb 319 treballadors del coneixement, més confiança en la IA anava amb menys pensament crític, mentre que més confiança en les pròpies habilitats anava amb més. El risc és una pèrdua silenciosa d'habilitats: es revisen els resultats però es deixa de practicar el raonament que hi ha darrere."], ["cards", 3, [["Pensa primer", "Escriu la teva pròpia visió o esquema abans de preguntar a la IA.", []], ["Demana el raonament", "Demana a la IA que mostri els passos i les fonts, i qüestiona'ls.", []], ["Practica sense ella", "Fes tasques clau sense ajuda de tant en tant, sobretot si ets nou al lloc.", []]]]]}, {"id": "ch6-check", "k": "Eina", "h": "Abans d'enviar-ho: la revisió de qualitat", "blocks": [["checklist", [["Substància", "Fa avançar la tasca?", [["Respon a la pregunta o necessitat real.", false], ["Podria explicar i defensar cada punt.", false]]], ["Exactitud", "Ho has comprovat?", [["He comprovat dades, xifres, noms i fonts.", false], ["No conté dades confidencials o personals que no hi hagin de ser.", false]]], ["Respecte per qui ho llegeix", "Val el seu temps?", [["És tan breu com pot ser.", false], ["Ho assumeixo com a meu i he indicat on la IA va fer una part important.", false]]]]]]}], "sum": [["Workslop", "La feina polida però buida trasllada l'esforç als altres."], ["Pensa primer", "Continua practicant les habilitats que hi ha darrere."], ["Revisa", "Substància, exactitud i respecte per qui ho llegeix."]], "rem": "Fes servir la IA per apujar el llistó, no per abaixar l'esforç."}, {"id": "ch7", "h": "Que perduri", "hook": "Mesura valor, no accessos. Crea hàbits, no llançaments.", "secs": [{"id": "ch7-measure", "k": "Què mesurar", "h": "Valor, no ús", "blocks": [["table", ["En lloc de…", "Mesura…"], [["Llicències i accessos", "Temps alliberat i com s'ha reinvertit"], ["Prompts escrits", "Qualitat: errors, refeina, opinió dels clients"], ["Pilots llançats", "Feina redissenyada que continua en marxa als tres mesos"], ["Hores de formació", "Confiança i habilitat: en saben i ho saben jutjar?"]]], ["callout", "Els pilots per si sols no creen valor. Escala el que funciona, atura el que no i explica per què."]]}, {"id": "ch7-rhythm", "k": "Hàbits d'equip", "h": "Ritmes que mantenen viu el canvi", "blocks": [["steps", [["Cada setmana", "Cinc minuts a la reunió d'equip: un encert amb IA, un error, una pregunta."], ["Cada mes", "Reviseu els experiments: mantenir, adaptar o aturar. Actualitzeu el mapa de tasques."], ["Cada trimestre", "Reviseu la carta, el pla d'habilitats i l'ús del temps estalviat."], ["Sempre", "A les reunions un a un, pregunta: com està canviant la IA la teva feina i com et sents?"]]]]}, {"id": "ch7-charter", "k": "Eina", "h": "La carta d'IA del teu equip", "blocks": [["builder", "charter", [["El nostre propòsit amb la IA", "p. ex. Més temps per als clients i per a la feina que necessita el nostre criteri."], ["El que continua sent humà", "p. ex. L'assessorament als clients, les decisions sobre persones, tot el que signem."], ["Les nostres regles", "Endavant / pregunta abans / mai."], ["Com compartim", "p. ex. Demo cada dilluns i una biblioteca compartida de prompts."], ["Com revisem la qualitat", "p. ex. La revisió de qualitat abans que res surti de l'equip."], ["Com creixem", "p. ex. Una habilitat nova d'IA per trimestre; aprenem en parelles."]]]]}], "sum": [["Valor", "Mesura temps reinvertit, qualitat i feina redissenyada."], ["Ritme", "Hàbits setmanals, mensuals i trimestrals."], ["Carta", "Escriu com treballa el teu equip amb la IA."]], "rem": "Els petits hàbits setmanals guanyen els grans llançaments."}]};
const AIUI={"en": {"pfName": "Change in the AI era", "pfSub": "Human-led, AI-powered", "pfDesc": "For people managers: lead your team through AI change with honest conversations, safe experiments, redesigned work and habits that last.", "pfPills": ["8 chapters", "Task sorter and team charter", "10 min per chapter"], "roadLead": "Eight short chapters, from why AI change is a people change to the habits that make it stick.", "how": [["Ten minutes per chapter", "Each chapter ends with a summary, so you can skim first and go deeper later."], ["Use the tools with your team", "Sort tasks, write your AI story and draft your team charter together."], ["Pair it with Human First", "The conversations here build on listening, coaching and difficult conversations."]], "tryWeek": "Try it this week: ask each person in a one-to-one how they feel about AI and their role, then run a ten-minute show-and-tell in your team meeting.", "fig": ["People", "AI", "Work", "Judgement"], "credit": "Change in the AI era is Fran Mondaca's own synthesis of public, credited sources: BCG (10-20-70 rule; Dell'Acqua et al., 2023, the jagged frontier), McKinsey (State of AI 2026; Superagency in the Workplace, 2025), MIT NANDA (The GenAI Divide, 2025), Prosci (AI adoption research), Ethan Mollick (Leadership, Lab and Crowd), Microsoft Work Trend Index 2025, Deloitte Global Human Capital Trends 2026, Mercer (2026), Gallup (2026), Stanford Social Media Lab and BetterUp Labs (workslop, HBR 2025) and Microsoft Research with Carnegie Mellon University (2025). Figures are as reported by those sources.", "titleGuide": "Change in the AI era: human-led, AI-powered"}, "es": {"pfName": "Change in the AI era", "pfSub": "Human-led, AI-powered", "pfDesc": "Para managers de personas: lidera a tu equipo en el cambio con IA con conversaciones honestas, experimentos seguros, trabajo rediseñado y hábitos que perduran.", "pfPills": ["8 capítulos", "Clasificador de tareas y carta del equipo", "10 min por capítulo"], "roadLea function flat(x){return Array.isArray(x)?x.map(flat).join(" "):typeof x==="object"&&x?Object.values(x).map(flat).join(" "):typeof x==="string"?x:""}

/* landing network background: "second brain" graph (Obsidian-style) */
let netRun=()=>{};
(function(){
  const c=document.getElementById("net"); if(!c) return; const x=c.getContext("2d");
  let w,h,N=[],E=[],homes=[],on=false,raf=0,mx=-1e4,my=-1e4,hot=-1,glow=0,visible=false;
  const R=Math.random;
  function rgb(v){const s=getComputedStyle(document.documentElement).getPropertyValue(v).trim().replace("#","");return[0,2,4].map(i=>parseInt(s.substr(i,2),16)).join(",")}
  function link(i,j){if(i===j||N[i].nb.has(j))return; N[i].nb.add(j);N[j].nb.add(i);E.push([i,j])}
  function build(){
    N=[];E=[];homes=[];
    const n=Math.max(50,Math.min(150,Math.round(w*h/9500))), k0=Math.max(4,Math.min(9,Math.round(n/17)));
    const cols=Math.max(1,Math.round(Math.sqrt(k0*w/h))), rows=Math.max(1,Math.ceil(k0/cols)), k=cols*rows;
    for(let i=0;i<k;i++){const cx=(i%cols+.5)/cols, cy=(Math.floor(i/cols)+.5)/rows;
      homes.push({x:w*(.04+.92*cx)+(R()-.5)*w/cols*.5, y:h*(.1+.86*cy)+(R()-.5)*h/rows*.5, p:R()*6.28})}
    homes.forEach((hm,i)=>N.push({x:hm.x,y:hm.y,vx:0,vy:0,c:i,nb:new Set()}));
    const mem=homes.map((_,i)=>[i]);
    for(let i=k;i<n;i++){const cl=Math.floor(R()*k), hm=homes[cl];
      N.push({x:hm.x+(R()-.5)*80,y:hm.y+(R()-.5)*80,vx:0,vy:0,c:cl,nb:new Set()});
      const m=mem[cl]; link(i, R()<.45?cl:m[Math.floor(R()*m.length)]);
      if(R()<.22) link(i,m[Math.floor(R()*m.length)]);
      m.push(i)}
    for(let i=0;i<k;i++){const d=homes.map((o,j)=>[Math.hypot(o.x-homes[i].x,o.y-homes[i].y),j]).sort((a,b)=>a[0]-b[0]); if(d[1])link(i,d[1][1]); if(d[2]&&R()<.5)link(i,d[2][1])}
    for(let q=0;q<Math.round(k*1.6);q++){const a=k+Math.floor(R()*(n-k)),b=k+Math.floor(R()*(n-k)); if(N[a].c!==N[b].c) link(a,b)}
    N.forEach(o=>{o.d=o.nb.size; o.r=1.3+Math.sqrt(o.d)*1.15});
    for(let i=0;i<220;i++) step(0);
  }
  function step(t){
    const n=N.length;
    for(let i=0;i<n;i++){const A=N[i];
      for(let j=i+1;j<n;j++){const B=N[j]; let dx=A.x-B.x,dy=A.y-B.y,d2=dx*dx+dy*dy; if(d2>16000)continue; if(d2<1)d2=1;
        const f=Math.min(1.2,520/d2), d=Math.sqrt(d2); dx/=d;dy/=d; A.vx+=dx*f;A.vy+=dy*f;B.vx-=dx*f;B.vy-=dy*f}}
    for(const [i,j] of E){const A=N[i],B=N[j],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1, X=A.c!==B.c, L=X?d:26+5*Math.sqrt(Math.min(A.d,B.d)), f=X?0:(d-L)*.006;
      A.vx+=dx/d*f;A.vy+=dy/d*f;B.vx-=dx/d*f;B.vy-=dy/d*f}
    for(const o of N){const hm=homes[o.c], hx=hm.x+Math.sin(t*.00011+hm.p)*26, hy=hm.y+Math.cos(t*.00009+hm.p)*20;
      o.vx+=(hx-o.x)*.0022+(R()-.5)*.03; o.vy+=(hy-o.y)*.0022+(R()-.5)*.03;
      if(o.x<20)o.vx+=.05; if(o.x>w-20)o.vx-=.05; if(o.y<20)o.vy+=.05; if(o.y>h-20)o.vy-=.05;
      o.vx*=.86;o.vy*=.86;o.x+=o.vx;o.y+=o.vy}
  }
  function draw(){
    const S=rgb("--signal"),I=rgb("--ink"); x.clearRect(0,0,w,h);
    hot=-1; let best=1600; N.forEach((o,i)=>{const d=(o.x-mx)**2+(o.y-my)**2; if(d<best){best=d;hot=i}});
    glow+=((hot>=0?1:0)-glow)*.12; const H=hot>=0?N[hot]:null;
    x.lineWidth=1;
    for(const [i,j] of E){const A=N[i],B=N[j], lit=H&&(i===hot||j===hot);
      x.strokeStyle="rgba("+S+","+(lit?.75:(.24-.12*glow)).toFixed(3)+")"; x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke()}
    N.forEach((o,i)=>{const lit=H&&(i===hot||H.nb.has(i)), hub=o.d>=6;
      x.fillStyle=lit||hub?"rgba("+S+","+(lit?1:.9)+")":"rgba("+I+","+(.38-.18*glow).toFixed(3)+")";
      x.beginPath();x.arc(o.x,o.y,o.r+(i===hot?2:0),0,7);x.fill()});
  }
  function loop(t){step(t);draw(); if(on) raf=requestAnimationFrame(loop)}
  function size(){const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);build()}
  size();
  let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{size(); if(visible&&!on) draw()},150)});
  addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return; mx=e.clientX;my=e.clientY},{passive:true});
  document.addEventListener("pointerleave",()=>{mx=my=-1e4});
  netRun=run=>{visible=run; on=run&&!reduce.matches; cancelAnimationFrame(raf); if(run){ if(on) raf=requestAnimationFrame(loop); else draw() }};
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(visible&&!on) draw()});
  new MutationObserver(()=>{if(visible&&!on) draw()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
})();





/* ---------- routing ---------- */
function route(){
  if(/^#people-first/.test(location.hash)){history.replaceState(null,"",location.pathname+location.search+location.hash.replace("#people-first","#human-first"))}
  const h=decodeURIComponent((location.hash||"#home").slice(1)), parts=h.split("/");
  const guide=!!PB[parts[0]];
  PBK=guide?parts[0]:"human-first";
  $("#view-home").hidden=guide; $("#view-guide").hidden=!guide;
  document.body.classList.toggle("is-home",!guide);
  const nm=" · "+t("pfName")+" — Fran Mondaca";
  if(!guide){renderHome(); document.title=t("titleHome")+" — Fran Mondaca"; window.scrollTo(0,0)}
  else if(!parts[1]) {renderIntro(); document.title=t("titleGuide")+" — Fran Mondaca"}
  else if(parts[1]==="cheat") {renderCheat(); document.title=t("cheatBtn")+nm}
  else if(CH().some(c=>c.id===parts[1])) {renderChapter(parts[1],parts[2]); document.title=CH().find(c=>c.id===parts[1]).h+nm}
  else renderIntro();
  netRun(true);
}

  $("#to-profile").href="../?lang="+lang+"#profile"; $("#to-assess").href="../maturity/?lang="+lang;

}
