e sorter together, and disagree out loud."], ["Pick", "Choose two tasks to automate or augment this month."], ["Test", "Run the experiment for two weeks with a named owner."], ["Review", "Keep, adapt or drop it, and decide what to do with the time saved."]]]]}], "sum": [["Redesign", "Change the work, not just the tools."], ["Four options", "Automate, augment, keep human or stop."], ["Together", "Sort tasks with the people who do them."]], "rem": "Redesign with your team, not for them."}, {"id": "ch5", "h": "Leading people and agents", "hook": "You can delegate the task to AI. You can't delegate the accountability.", "secs": [{"id": "ch5-agent", "k": "A new role", "h": "Everyone becomes an agent manager", "blocks": [["p", "Microsoft's 2025 Work Trend Index describes teams of people and AI agents, and a new role for everyone: the \"agent boss\" who builds, delegates to and manages agents. It also raises a new question for leaders: what is the right balance of people and agents for each task? For you, this means leading people who, in turn, lead agents."], ["cards", 3, [["Delegate clearly", "Give the AI a goal, context, limits and an example of good, as you would a new colleague.", []], ["Supervise wisely", "The higher the risk, the closer the review. Spot-check even what usually works.", []], ["Own the result", "Whoever sends it owns it. \"The AI did it\" is never an answer.", []]]]]}, {"id": "ch5-rights", "k": "Decision rights", "h": "Who does what: people and AI", "blocks": [["table", ["Decision", "AI may…", "A person…"], [["High risk or hard to reverse", "Give input only", "Recommends, decides and is accountable"], ["Medium risk or partly reversible", "Give input and recommend", "Decides and is accountable"], ["Low risk, reversible and frequent", "Decide within agreed limits", "Monitors, samples and owns the rules"]]], ["note", "Simplified from the decision-rights logic in Co-Intelligence AI Decision Making, which extends Bain's RAPID model to AI."], ["link", "Map your team's decisions: Co-Intelligence AI Decision Making", "../maturity/?lang={lang}#hx"]]}, {"id": "ch5-coach", "k": "Coaching in the AI era", "h": "Coach the way people work with AI", "blocks": [["cards", 2, [["Ask about the process", "\"How did you use AI here? What did you check? What did you change?\"", []], ["Watch for skill drift", "Make sure people still practise the core skills of their role, not just the prompting.", []]]], ["link", "Refresh your coaching: Human First, Coaching conversations", "#human-first/ch3"]]}], "sum": [["Agent manager", "Everyone delegates to and supervises AI."], ["Risk sets the role", "The higher the risk, the less AI autonomy."], ["Accountability", "The person who sends it owns it."]], "rem": "Delegate the task, never the accountability."}, {"id": "ch6", "h": "Protect quality and judgement", "hook": "Polished is not the same as good.", "secs": [{"id": "ch6-slop", "k": "A new problem", "h": "Workslop", "blocks": [["p", "Researchers from Stanford's Social Media Lab and BetterUp Labs (Harvard Business Review, 2025) coined \"workslop\": AI-generated work that looks polished but lacks substance, and shifts the effort onto whoever receives it. In their survey of 1,150 US workers, about 40% had received some in the previous month; each case took almost two hours to sort out, and many saw the sender as less capable and less trustworthy. Deloitte (2026) found that around 80% of leaders worry people use AI to look more productive than they are."], ["two", ["Workslop", "A long, confident summary that answers a question nobody asked and takes an hour to fix."], ["Good AI-assisted work", "A short draft with a clear point, checked facts and a note on what AI did."]]]}, {"id": "ch6-skill", "k": "Keep thinking", "h": "Don't let skills fade", "blocks": [["p", "In a 2025 study by Microsoft Research and Carnegie Mellon University with 319 knowledge workers, more confidence in AI went with less critical thinking, while more confidence in one's own skills went with more. The risk is quiet deskilling: people check outputs but stop practising the thinking behind them."], ["cards", 3, [["Think first", "Write your own view or outline before asking the AI.", []], ["Ask for the reasoning", "Ask the AI to show its steps and sources, then challenge them.", []], ["Practise without it", "Do key tasks unaided from time to time, especially when you are new to the role.", []]]]]}, {"id": "ch6-check", "k": "Tool", "h": "Before you send it: the quality check", "blocks": [["checklist", [["Substance", "Does it move the task forward?", [["It answers the actual question or need.", false], ["I could explain and defend every point in it.", false]]], ["Accuracy", "Have you checked it?", [["I have checked facts, numbers, names and sources.", false], ["It contains no confidential or personal data that shouldn't be there.", false]]], ["Respect for the reader", "Is it worth their time?", [["It is as short as it can be.", false], ["I'm happy to own it, and I've said where AI did significant work.", false]]]]]]}], "sum": [["Workslop", "Polished but empty work shifts effort onto others."], ["Think first", "Keep practising the skills behind the output."], ["Check", "Substance, accuracy and respect for the reader."]], "rem": "Use AI to raise the bar, not to lower the effort."}, {"id": "ch7", "h": "Make it stick", "hook": "Measure value, not logins. Build habits, not launches.", "secs": [{"id": "ch7-measure", "k": "What to measure", "h": "Value, not usage", "blocks": [["table", ["Instead of…", "Measure…"], [["Licences and logins", "Time freed, and how it was reused"], ["Prompts written", "Quality: errors, rework, customer feedback"], ["Pilots launched", "Work redesigned and still in place after three months"], ["Training hours", "Confidence and skill: can people do it, and judge it?"]]], ["callout", "Pilots alone don't create value. Scale what works, stop what doesn't and say why."]]}, {"id": "ch7-rhythm", "k": "Team habits", "h": "Rhythms that keep change going", "blocks": [["steps", [["Weekly", "Five minutes in the team meeting: one AI win, one failure, one question."], ["Monthly", "Review the experiments: keep, adapt or stop. Update the task map."], ["Quarterly", "Revisit the charter, the skills plan and how saved time is being used."], ["Always", "In one-to-ones, ask: how is AI changing your work, and how do you feel about it?"]]]]}, {"id": "ch7-charter", "k": "Tool", "h": "Your team AI charter", "blocks": [["builder", "charter", [["Our purpose with AI", "e.g. More time for customers and for work that needs our judgement."], ["What stays human", "e.g. Advice to customers, decisions about people, anything we sign."], ["Our rules", "Go ahead / ask first / never."], ["How we share", "e.g. Show-and-tell every Monday and a shared prompt library."], ["How we check quality", "e.g. The quality check before anything leaves the team."], ["How we grow", "e.g. One new AI skill per quarter; we pair up to learn."]]]]}], "sum": [["Value", "Measure time reused, quality and work redesigned."], ["Rhythm", "Weekly, monthly and quarterly habits."], ["Charter", "Write down how your team works with AI."]], "rem": "Small habits every week beat big launches."}], "es": [{"id": "ch0", "h": "Por qué el cambio con IA es un cambio de personas", "hook": "La tecnología es la parte fácil. El valor se gana o se pierde en la parte humana.", "secs": [{"id": "ch0-why", "k": "Empieza aquí", "h": "El 70% que lo decide todo", "blocks": [["p", "Las herramientas de IA llegan en semanas. El valor tarda mucho más y depende sobre todo de las personas. La regla práctica de BCG para la transformación con IA: alrededor del 10% del esfuerzo va a los algoritmos, el 20% a la tecnología y los datos, y el 70% a las personas y los procesos."], ["cards", 3, [["Usar no es transformar", "En la encuesta State of AI 2026 de McKinsey, el 80% dijo que la IA había mejorado su productividad individual, pero solo el 37% veía un impacto positivo en el EBIT.", []], ["Los pilotos se estancan", "La iniciativa NANDA del MIT (2025) encontró que solo alrededor del 5% de los pilotos de IA generativa llegaba a un impacto medible en la cuenta de resultados.", []], ["Las barreras son humanas", "En la investigación de Prosci, entre el 56% y el 64% de los obstáculos de implantación de la IA eran factores humanos, no técnicos.", []]]], ["callout", "Tu papel como manager: convertir experimentos individuales en un mejor trabajo de equipo, manteniendo a las personas seguras, capaces y con confianza.", true]]}, {"id": "ch0-map", "k": "Siete paradigmas", "h": "Qué tiene de distinto el cambio con IA", "blocks": [["steps", [["Es un cambio de personas", "La mayor parte del valor viene de cómo cambian las personas y los procesos, no de la herramienta."], ["Usar no es transformar", "El valor llega al rediseñar el trabajo, no al añadir herramientas al puesto de siempre."], ["Tu equipo puede ir por delante", "McKinsey (2025) encontró que los empleados tenían unas tres veces más probabilidades de usar IA generativa de lo que esperaban sus líderes. Gran parte de ese uso está oculto."], ["El cambio no se detiene", "El cambio con IA es un flujo de novedades, no una puesta en marcha. La investigación de Prosci señala a los managers como la palanca, y a los mandos intermedios como el grupo que más se resiste."], ["Nuevos compañeros", "Los equipos ya incluyen agentes de IA. El Work Trend Index 2025 de Microsoft prevé que todos gestionemos agentes."], ["La frontera es irregular", "La IA es excelente en unas tareas y se equivoca con seguridad en otras, y la línea se mueve."], ["Nuevos riesgos humanos", "El miedo a quedarse obsoleto, el trabajo de IA de baja calidad y la pérdida silenciosa de habilidades."]]], ["two", ["Cambio clásico", "Un proyecto con inicio, puesta en marcha y final. Se forma una vez y se adopta."], ["Cambio con IA", "Un flujo continuo de nuevas capacidades. Se aprende haciendo, en equipo, cada semana."]]]}], "sum": [["70%", "El valor viene de las personas y de cómo cambia el trabajo."], ["Transformar", "Usar IA no es lo mismo que rediseñar el trabajo."], ["Continuo", "El cambio con IA no termina; los managers hacen que perdure."]], "rem": "Las herramientas son la parte fácil. Lidera la parte humana."}, {"id": "ch1", "h": "Dar sentido a la IA en tu equipo", "hook": "Las personas soportan la incertidumbre. Lo que les cuesta es el silencio.", "secs": [{"id": "ch1-frontier", "k": "Conoce el terreno", "h": "La frontera irregular", "blocks": [["p", "En un experimento de campo con 758 consultores de BCG (Dell'Acqua, Mollick y otros, 2023), quienes usaban IA terminaron más tareas, más rápido y con más calidad en trabajos dentro de las capacidades de la IA. En una tarea diseñada para quedar fuera de ellas, el porcentaje de respuestas correctas cayó del 84% sin IA a entre el 60% y el 70% con ella. La frontera es irregular y se mueve: solo se descubre dónde está usando la IA en trabajo real."], ["cards", 2, [["Suele estar dentro de la frontera", "", ["Redactar, reescribir y resumir", "Estructurar ideas y hacer lluvia de ideas", "Traducir y adaptar el tono", "Una primera pasada de análisis"]], ["Revisa con cuidado", "", ["Datos, cifras, nombres y fuentes", "Todo lo nuevo, inusual o de alto impacto", "Juicios sobre personas", "Todo lo que suena demasiado seguro"]]]], ["callout", "Se han observado dos formas de trabajar: unas personas reparten las tareas entre ellas y la IA; otras entrelazan ambas paso a paso. Las dos necesitan a alguien que sepa dónde suele fallar la IA."]]}, {"id": "ch1-story", "k": "Tu relato", "h": "La historia de la IA de tu equipo en cuatro frases", "blocks": [["steps", [["Por qué", "Por qué la IA importa ahora para nuestro equipo y nuestros clientes."], ["Qué cambia", "Qué partes de nuestro trabajo cambiarán primero."], ["Qué se queda", "Qué sigue siendo humano aquí: el juicio, las relaciones, la responsabilidad."], ["Cómo aprenderemos", "Cómo vamos a probar, compartir y decidir juntos, y qué apoyo tendréis."]]], ["callout", "Di lo que sabes, lo que aún no sabes y cuándo esperas saber más. La honestidad sobre la incertidumbre genera más confianza que una falsa seguridad.", true]]}, {"id": "ch1-write", "k": "Herramienta", "h": "Escribe tu historia", "blocks": [["builder", "story", [["Por qué", "p. ej. Nuestros clientes esperan respuestas más rápidas y la IA puede quitarnos trabajo rutinario."], ["Qué cambia", "p. ej. Los primeros borradores de informes y las respuestas a preguntas habituales."], ["Qué se queda", "p. ej. El asesoramiento a clientes, las decisiones sobre personas, todo lo que firmamos."], ["Cómo aprenderemos", "p. ej. Experimentos de dos semanas, una demo semanal y formación en marzo."]]]]}], "sum": [["Irregular", "La IA es brillante en unas tareas y se equivoca con seguridad en otras."], ["Relato", "Por qué, qué cambia, qué se queda, cómo aprenderemos."], ["Honestidad", "Nombra lo que aún no sabes."]], "rem": "Llena el silencio antes de que lo hagan los rumores."}, {"id": "ch2", "h": "La conversación sobre quedarse obsoleto", "hook": "El miedo rara vez dice su nombre. Pregunta, escucha y ayuda a ver un camino.", "secs": [{"id": "ch2-fear", "k": "Qué está pasando", "h": "El miedo a quedarse obsoleto", "blocks": [["p", "La preocupación por perder el empleo por la IA crece: en la encuesta global de Mercer de 2026 alcanzó al 40% de los empleados, frente al 28% de 2024. Junto a ella aparece un miedo más silencioso: no perder el puesto, sino perder relevancia. Gallup (2026) encontró que la ansiedad laboral ligada a la IA va de la mano de menos compromiso y más desgaste, y que es menor donde las personas viven una gestión bien estructurada."], ["cards", 3, [["Seguridad", "¿Seguiré teniendo trabajo aquí?", []], ["Estatus", "¿Seguirá importando lo que sé?", []], ["Identidad", "¿Quién soy en el trabajo si la IA hace lo que yo hago bien?", []]]], ["callout", "La seguridad psicológica importa más, no menos. Un estudio de 2026 vinculó la inseguridad laboral por la IA con el desgaste, en parte porque erosiona la seguridad psicológica, y encontró que la confianza en el uso de la IA suaviza ese efecto."]]}, {"id": "ch2-talk", "k": "La conversación", "h": "Cinco pasos", "blocks": [["steps", [["Abre la puerta", "«¿Cómo te sientes con la IA y con tu rol?» Pregúntalo en las reuniones uno a uno, no solo en las reuniones generales."], ["Escucha primero", "Parafrasea, pregunta qué más y resiste las ganas de tranquilizar demasiado pronto."], ["Sé honesto", "Comparte lo que sabes y lo que no. No prometas nunca lo que no puedes cumplir."], ["Encuentra el camino", "¿Qué partes de su trabajo ganan valor? ¿Qué habilidades le ayudarían? ¿Qué podría probar este mes?"], ["Acordad un siguiente paso", "Un experimento, una habilidad y una fecha para volver a hablar."]]], ["two", ["Evita", "«Tranquilo, no va a cambiar nada.»"], ["Prueba", "«Parte de nuestro trabajo va a cambiar. Miremos el tuyo juntos y decidamos dónde quieres crecer.»"]], ["link", "Prepárate con Human First: Conversaciones difíciles", "#human-first/ch5"]]}, {"id": "ch2-bank", "k": "Banco de preguntas", "h": "Preguntas que abren la conversación", "blocks": [["bank", [["Emociones", "Nombrar lo que hay.", ["¿Qué te ilusiona de la IA y qué te preocupa?", "¿Qué has oído que te inquieta?", "¿Qué te ayudaría a sentirte con más confianza?"], "Acepta la respuesta. No discutas con las emociones."], ["Valor", "Encontrar lo que crece.", ["¿Qué partes de tu trabajo importan más a clientes o compañeros?", "¿Dónde marca más diferencia tu criterio?", "¿Para qué te busca la gente?"], "Señala fortalezas que la IA no sustituye."], ["Crecimiento", "Abrir un camino.", ["¿Qué tareas le pasarías encantado a la IA?", "¿Qué harías con dos horas más a la semana?", "¿Qué habilidad te haría más valioso dentro de un año?"], "Convierte la respuesta en un experimento pequeño y con fecha."]]]]}], "sum": [["Tres miedos", "Seguridad, estatus e identidad."], ["Primero escuchar", "Abre la puerta, escucha, sé honesto."], ["Un camino", "Termina con un siguiente paso concreto."]], "rem": "El miedo se encoge cuando se ve un camino."}, {"id": "ch3", "h": "Hacer seguro experimentar", "hook": "Si la gente esconde su uso de la IA, pierdes lo que ha aprendido.", "secs": [{"id": "ch3-hidden", "k": "La multitud oculta", "h": "Probablemente tu equipo ya usa IA", "blocks": [["p", "Ethan Mollick llama «secret cyborgs» a quienes usan la IA en silencio sin contárselo a nadie. Lo esconden porque las reglas no están claras, porque temen parecer menos capaces o porque les preocupa que el tiempo ahorrado se convierta en más trabajo o en menos puestos. Un uso oculto significa riesgos ocultos y aprendizaje perdido."], ["cards", 3, [["Liderazgo", "Marca la dirección, los permisos y los incentivos.", []], ["Laboratorio", "Unas pocas personas que prueban, construyen y comparten lo que funciona.", []], ["Multitud", "Todo el equipo usando IA en trabajo real, de donde salen la mayoría de las buenas ideas.", []]]], ["note", "Leadership, Lab and Crowd es el marco de Ethan Mollick para la IA en las organizaciones (One Useful Thing, 2025). En un equipo, tú eres el liderazgo, unos pocos voluntarios forman el laboratorio y todo el equipo es la multitud."]]}, {"id": "ch3-rules", "k": "Herramienta", "h": "Define las reglas de experimentación del equipo", "blocks": [["cards", 3, [["Adelante", "", ["Redactar, resumir y generar ideas con herramientas aprobadas", "Tareas internas de bajo riesgo que revisas tú", "Aprender y practicar"]], ["Pregunta antes", "", ["Todo lo que verá un cliente o un regulador", "Todo lo que implique decisiones sobre personas", "Herramientas o fuentes de datos nuevas"]], ["Nunca", "", ["Datos confidenciales o personales en herramientas no aprobadas", "Enviar resultados de IA sin revisarlos", "Ocultar que la IA hizo una parte importante del trabajo"]]]], ["callout", "Adapta las listas a la política de IA de tu organización. Las reglas claras aumentan el uso seguro; las reglas vagas lo esconden."]]}, {"id": "ch3-share", "k": "Hacer visible el aprendizaje", "h": "Convierte los trucos privados en conocimiento del equipo", "blocks": [["steps", [["Demo rápida", "Diez minutos en la reunión de equipo: un caso de uso, un prompt, un fallo."], ["Reconoce a quien comparte", "Valora a quien comparte, no solo a quien ahorra tiempo."], ["Protege la ganancia", "Acordad cómo se usará el tiempo ahorrado: mejor trabajo, aprendizaje, menos horas extra, no solo más volumen."], ["Ten una biblioteca", "Una página compartida con prompts, ejemplos y lecciones aprendidas."]]]]}], "sum": [["Uso oculto", "Se esconde la IA cuando las reglas son vagas o compartir parece arriesgado."], ["Reglas claras", "Adelante, pregunta antes, nunca."], ["Aprendizaje visible", "Demos, reconocer a quien comparte, proteger la ganancia."]], "rem": "Que probar sea seguro y compartir sea normal."}, {"id": "ch4", "h": "Rediseñar el trabajo juntos", "hook": "No pegues la IA al puesto de siempre. Decide qué trabajo debe cambiar.", "secs": [{"id": "ch4-why", "k": "Más allá de las herramientas", "h": "De tareas a flujos de trabajo", "blocks": [["p", "El informe Global Human Capital Trends 2026 de Deloitte encontró que solo el 6% de los líderes dice avanzar en el diseño de cómo trabajan juntas las personas y la IA. La investigación de McKinsey apunta en la misma dirección: el valor viene de repensar el trabajo de principio a fin, no de acelerar tareas sueltas. Empieza donde puedes: el trabajo real de tu equipo, tarea por tarea."], ["tiles", [["A", "Automatizar", "La IA lo hace y una persona revisa una muestra. Trabajo repetitivo, con reglas, donde los errores se detectan fácilmente."], ["+", "Aumentar", "La IA prepara o analiza; una persona decide y termina. La mayor parte del trabajo del conocimiento."], ["H", "Mantener humano", "Relaciones, empatía, responsabilidad, ética y criterio nuevo. La IA puede ayudarte a prepararlo."], ["×", "Dejar de hacer", "Trabajo que ya no aporta valor. Pregúntate por qué se hace."]]], ["callout", "Ethan Mollick propone que cada equipo se pregunte qué trabajo útil deja de tener valor cuando la IA puede hacerlo. Algunas tareas no hay que automatizarlas: hay que dejarlas.", true]]}, {"id": "ch4-sort", "k": "Herramienta", "h": "Clasifica las tareas de tu equipo", "blocks": [["sorter"]]}, {"id": "ch4-session", "k": "Hazlo con tu equipo", "h": "Una sesión de rediseño de 60 minutos", "blocks": [["steps", [["Listar", "Cada persona apunta sus diez tareas que más tiempo le llevan."], ["Clasificar", "Usad el clasificador juntos y discrepad en voz alta."], ["Elegir", "Escoged dos tareas para automatizar o aumentar este mes."], ["Probar", "Haced el experimento durante dos semanas, con una persona responsable."], ["Revisar", "Mantenedlo, adaptadlo o descartadlo, y decidid qué hacer con el tiempo ahorrado."]]]]}], "sum": [["Rediseñar", "Cambia el trabajo, no solo las herramientas."], ["Cuatro opciones", "Automatizar, aumentar, mantener humano o dejar de hacer."], ["Juntos", "Clasifica las tareas con quienes las hacen."]], "rem": "Rediseña con tu equipo, no para tu equipo."}, {"id": "ch5", "h": "Liderar personas y agentes", "hook": "Puedes delegar la tarea en la IA. No puedes delegar la responsabilidad.", "secs": [{"id": "ch5-agent", "k": "Un nuevo rol", "h": "Todos pasamos a gestionar agentes", "blocks": [["p", "El Work Trend Index 2025 de Microsoft describe equipos de personas y agentes de IA, y un nuevo rol para todos: el «agent boss», que crea agentes, les delega trabajo y los gestiona. También plantea una nueva pregunta para los líderes: ¿cuál es el equilibrio adecuado entre personas y agentes para cada tarea? Para ti, significa liderar a personas que, a su vez, lideran agentes."], ["cards", 3, [["Delega con claridad", "Dale a la IA un objetivo, contexto, límites y un ejemplo de lo que está bien, como harías con alguien nuevo.", []], ["Supervisa con criterio", "Cuanto mayor el riesgo, más cercana la revisión. Comprueba al azar incluso lo que suele funcionar.", []], ["Responde del resultado", "Quien lo envía es responsable. «Lo hizo la IA» nunca es una respuesta.", []]]]]}, {"id": "ch5-rights", "k": "Derechos de decisión", "h": "Quién hace qué: personas e IA", "blocks": [["table", ["Decisión", "La IA puede…", "Una persona…"], [["Alto riesgo o difícil de revertir", "Solo aportar información", "Recomienda, decide y responde"], ["Riesgo medio o parcialmente reversible", "Aportar información y recomendar", "Decide y responde"], ["Bajo riesgo, reversible y frecuente", "Decidir dentro de límites acordados", "Supervisa, revisa muestras y responde de las reglas"]]], ["note", "Simplificado de la lógica de derechos de decisión de Co-Intelligence AI Decision Making, que amplía el modelo RAPID de Bain a la IA."], ["link", "Mapea las decisiones de tu equipo: Co-Intelligence AI Decision Making", "../maturity/?lang={lang}#hx"]]}, {"id": "ch5-coach", "k": "Coaching en la era de la IA", "h": "Haz coaching sobre cómo se trabaja con la IA", "blocks": [["cards", 2, [["Pregunta por el proceso", "«¿Cómo usaste la IA aquí? ¿Qué revisaste? ¿Qué cambiaste?»", []], ["Vigila la pérdida de habilidades", "Asegúrate de que las personas siguen practicando las habilidades clave de su rol, no solo los prompts.", []]]], ["link", "Repasa tu coaching: Human First, Conversaciones de coaching", "#human-first/ch3"]]}], "sum": [["Gestionar agentes", "Todos delegamos en la IA y la supervisamos."], ["El riesgo marca el rol", "Cuanto más riesgo, menos autonomía para la IA."], ["Responsabilidad", "Quien lo envía responde de ello."]], "rem": "Delega la tarea, nunca la responsabilidad."}, {"id": "ch6", "h": "Proteger la calidad y el criterio", "hook": "Pulido no es lo mismo que bueno.", "secs": [{"id": "ch6-slop", "k": "Un problema nuevo", "h": "El «workslop»", "blocks": [["p", "Investigadores del Social Media Lab de Stanford y de BetterUp Labs (Harvard Business Review, 2025) acuñaron «workslop»: trabajo generado con IA que parece pulido pero carece de sustancia y traslada el esfuerzo a quien lo recibe. En su encuesta a 1.150 trabajadores de EE. UU., alrededor del 40% lo había recibido el mes anterior; cada caso costaba casi dos horas resolverlo, y muchos veían a quien lo enviaba como menos capaz y menos fiable. Deloitte (2026) encontró que cerca del 80% de los líderes teme que se use la IA para parecer más productivo de lo que se es."], ["two", ["Workslop", "Un resumen largo y seguro que responde a una pregunta que nadie hizo y cuesta una hora arreglar."], ["Buen trabajo con IA", "Un borrador breve, con una idea clara, datos comprobados y una nota de qué hizo la IA."]]]}, {"id": "ch6-skill", "k": "Seguir pensando", "h": "Que no se pierdan las habilidades", "blocks": [["p", "En un estudio de 2025 de Microsoft Research y la Universidad Carnegie Mellon con 319 trabajadores del conocimiento, más confianza en la IA iba con menos pensamiento crítico, mientras que más confianza en las propias habilidades iba con más. El riesgo es una pérdida silenciosa de habilidades: se revisan los resultados pero se deja de practicar el razonamiento que hay detrás."], ["cards", 3, [["Piensa primero", "Escribe tu propia visión o esquema antes de preguntar a la IA.", []], ["Pide el razonamiento", "Pide a la IA que muestre sus pasos y fuentes, y cuestiónalos.", []], ["Practica sin ella", "Haz tareas clave sin ayuda de vez en cuando, sobre todo si eres nuevo en el puesto.", []]]]]}, {"id": "ch6-check", "k": "Herramienta", "h": "Antes de enviarlo: la revisión de calidad", "blocks": [["checklist", [["Sustancia", "¿Hace avanzar la tarea?", [["Responde a la pregunta o necesidad real.", false], ["Podría explicar y defender cada punto.", false]]], ["Exactitud", "¿Lo has comprobado?", [["He comprobado datos, cifras, nombres y fuentes.", false], ["No contiene datos confidenciales o personales que no deban estar.", false]]], ["Respeto por quien lo lee", "¿Vale su tiempo?", [["Es todo lo breve que puede ser.", false], ["Lo asumo como mío y he indicado dónde la IA hizo una parte importante.", false]]]]]]}], "sum": [["Workslop", "El trabajo pulido pero vacío traslada el esfuerzo a otros."], ["Piensa primero", "Sigue practicando las habilidades que hay detrás."], ["Revisa", "Sustancia, exactitud y respeto por quien lo lee."]], "rem": "Usa la IA para subir el listón, no para bajar el esfuerzo."}, {"id": "ch7", "h": "Que perdure", "hook": "Mide valor, no accesos. Crea hábitos, no lanzamientos.", "secs": [{"id": "ch7-measure", "k": "Qué medir", "h": "Valor, no uso", "blocks": [["table", ["En lugar de…", "Mide…"], [["Licencias y accesos", "Tiempo liberado y cómo se ha reinvertido"], ["Prompts escritos", "Calidad: errores, retrabajo, opinión de clientes"], ["Pilotos lanzados", "Trabajo rediseñado que sigue en marcha a los tres meses"], ["Horas de formación", "Confianza y habilidad: ¿saben hacerlo y juzgarlo?"]]], ["callout", "Los pilotos por sí solos no crean valor. Escala lo que funciona, para lo que no y explica por qué."]]}, {"id": "ch7-rhythm", "k": "Hábitos de equipo", "h": "Ritmos que mantienen vivo el cambio", "blocks": [["steps", [["Cada semana", "Cinco minutos en la reunión de equipo: un acierto con IA, un fallo, una pregunta."], ["Cada mes", "Revisad los experimentos: mantener, adaptar o parar. Actualizad el mapa de tareas."], ["Cada trimestre", "Revisad la carta, el plan de habilidades y el uso del tiempo ahorrado."], ["Siempre", "En las reuniones uno a uno, pregunta: ¿cómo está cambiando la IA tu trabajo y cómo te sientes?"]]]]}, {"id": "ch7-charter", "k": "Herramienta", "h": "La carta de IA de tu equipo", "blocks": [["builder", "charter", [["Nuestro propósito con la IA", "p. ej. Más tiempo para clientes y para el trabajo que necesita nuestro criterio."], ["Lo que sigue siendo humano", "p. ej. El asesoramiento a clientes, las decisiones sobre personas, todo lo que firmamos."], ["Nuestras reglas", "Adelante / pregunta antes / nunca."], ["Cómo compartimos", "p. ej. Demo cada lunes y una biblioteca compartida de prompts."], ["Cómo revisamos la calidad", "p. ej. La revisión de calidad antes de que algo salga del equipo."], ["Cómo crecemos", "p. ej. Una habilidad nueva de IA por trimestre; aprendemos por parejas."]]]]}], "sum": [["Valor", "Mide tiempo reinvertido, calidad y trabajo rediseñado."], ["Ritmo", "Hábitos semanales, mensuales y trimestrales."], ["Carta", "Escribe cómo trabaja tu equipo con la IA."]], "rem": "Los pequeños hábitos semanales ganan a los grandes lanzamientos."}], "ca": [{"id": "ch0", "h": "Per què el canvi amb IA és un canvi de persones", "hook": "La tecnologia és la part fàcil. El valor es guanya o es perd en la part humana.", "secs": [{"id": "ch0-why", "k": "Comença aquí", "h": "El 70% que ho decideix tot", "blocks": [["p", "Les eines d'IA arriben en setmanes. El valor triga molt més i depèn sobretot de les persones. La regla pràctica de BCG per a la transformació amb IA: al voltant del 10% de l'esforç va als algoritmes, el 20% a la tecnologia i les dades, i el 70% a les persones i els processos."], ["cards", 3, [["Fer servir no és transformar", "A l'enquesta State of AI 2026 de McKinsey, el 80% va dir que la IA havia millorat la seva productivitat individual, però només el 37% veia un impacte positiu en l'EBIT.", []], ["Els pilots s'encallen", "La iniciativa NANDA del MIT (2025) va trobar que només al voltant del 5% dels pilots d'IA generativa arribava a un impacte mesurable en el compte de resultats.", []], ["Les barreres són humanes", "A la recerca de Prosci, entre el 56% i el 64% dels obstacles d'implantació de la IA eren factors humans, no tècnics.", []]]], ["callout", "El teu paper com a manager: convertir experiments individuals en una millor feina d'equip, mantenint les persones segures, capaces i amb confiança.", true]]}, {"id": "ch0-map", "k": "Set paradigmes", "h": "Què té de diferent el canvi amb IA", "blocks": [["steps", [["És un canvi de persones", "La major part del valor ve de com canvien les persones i els processos, no de l'eina."], ["Fer servir no és transformar", "El valor arriba en redissenyar la feina, no en afegir eines al lloc de sempre."], ["El teu equip pot anar per davant", "McKinsey (2025) va trobar que els empleats tenien unes tres vegades més probabilitats de fer servir IA generativa del que esperaven els seus líders. Gran part d'aquest ús està amagat."], ["El canvi no s'atura", "El canvi amb IA és un flux de novetats, no una posada en marxa. La recerca de Prosci assenyala els managers com la palanca, i els comandaments intermedis com el grup que més s'hi resisteix."], ["Nous companys", "Els equips ja inclouen agents d'IA. El Work Trend Index 2025 de Microsoft preveu que tothom gestionarà agents."], ["La frontera és irregular", "La IA és excel·lent en unes tasques i s'equivoca amb seguretat en altres, i la línia es mou."], ["Nous riscos humans", "La por de quedar-se obsolet, la feina d'IA de baixa qualitat i la pèrdua silenciosa d'habilitats."]]], ["two", ["Canvi clàssic", "Un projecte amb inici, posada en marxa i final. Es forma un cop i s'adopta."], ["Canvi amb IA", "Un flux continu de noves capacitats. S'aprèn fent, en equip, cada setmana."]]]}], "sum": [["70%", "El valor ve de les persones i de com canvia la feina."], ["Transformar", "Fer servir IA no és el mateix que redissenyar la feina."], ["Continu", "El canvi amb IA no s'acaba; els managers fan que perduri."]], "rem": "Les eines són la part fàcil. Lidera la part humana."}, {"id": "ch1", "h": "Donar sentit a la IA al teu equip", "hook": "Les persones suporten la incertesa. El que els costa és el silenci.", "secs": [{"id": "ch1-frontier", "k": "Coneix el terreny", "h": "La frontera irregular", "blocks": [["p", "En un experiment de camp amb 758 consultors de BCG (Dell'Acqua, Mollick i altres, 2023), qui feia servir IA va acabar més tasques, més ràpid i amb més qualitat en feines dins de les capacitats de la IA. En una tasca dissenyada per quedar-ne fora, el percentatge de respostes correctes va caure del 84% sense IA a entre el 60% i el 70% amb IA. La frontera és irregular i es mou: només es descobreix on és fent servir la IA en feina real."], ["cards", 2, [["Sol ser dins de la frontera", "", ["Redactar, reescriure i resumir", "Estructurar idees i fer pluja d'idees", "Traduir i adaptar el to", "Una primera passada d'anàlisi"]], ["Revisa-ho amb cura", "", ["Dades, xifres, noms i fonts", "Tot el que és nou, inusual o d'alt impacte", "Judicis sobre persones", "Tot el que sona massa segur"]]]], ["callout", "S'han observat dues maneres de treballar: unes persones reparteixen les tasques entre elles i la IA; altres les entrellacen pas a pas. Totes dues necessiten algú que sàpiga on sol fallar la IA."]]}, {"id": "ch1-story", "k": "El teu relat", "h": "La història de la IA del teu equip en quatre frases", "blocks": [["steps", [["Per què", "Per què la IA importa ara per al nostre equip i els nostres clients."], ["Què canvia", "Quines parts de la nostra feina canviaran primer."], ["Què es queda", "Què continua sent humà aquí: el criteri, les relacions, la responsabilitat."], ["Com aprendrem", "Com provarem, compartirem i decidirem junts, i quin suport tindreu."]]], ["callout", "Digues el que saps, el que encara no saps i quan esperes saber-ne més. L'honestedat sobre la incertesa genera més confiança que una falsa seguretat.", true]]}, {"id": "ch1-write", "k": "Eina", "h": "Escriu la teva història", "blocks": [["builder", "story", [["Per què", "p. ex. Els nostres clients esperen respostes més ràpides i la IA ens pot treure feina rutinària."], ["Què canvia", "p. ex. Els primers esborranys d'informes i les respostes a preguntes habituals."], ["Què es queda", "p. ex. L'assessorament als clients, les decisions sobre persones, tot el que signem."], ["Com aprendrem", "p. ex. Experiments de dues setmanes, una demo setmanal i formació al març."]]]]}], "sum": [["Irregular", "La IA és brillant en unes tasques i s'equivoca amb seguretat en altres."], ["Relat", "Per què, què canvia, què es queda, com aprendrem."], ["Honestedat", "Anomena el que encara no saps."]], "rem": "Omple el silenci abans que ho facin els rumors."}, {"id": "ch2", "h": "La conversa sobre quedar-se obsolet", "hook": "La por poques vegades diu el seu nom. Pregunta, escolta i ajuda a veure un camí.", "secs": [{"id": "ch2-fear", "k": "Què està passant", "h": "La por de quedar-se obsolet", "blocks": [["p", "La preocupació per perdre la feina per la IA creix: a l'enquesta global de Mercer de 2026 va arribar al 40% dels empleats, davant del 28% del 2024. Al seu costat apareix una por més silenciosa: no perdre el lloc, sinó perdre rellevància. Gallup (2026) va trobar que l'ansietat laboral lligada a la IA va de la mà de menys compromís i més desgast, i que és menor on les persones viuen una gestió ben estructurada."], ["cards", 3, [["Seguretat", "Continuaré tenint feina aquí?", []], ["Estatus", "Continuarà important el que sé?", []], ["Identitat", "Qui soc a la feina si la IA fa el que jo faig bé?", []]]], ["callout", "La seguretat psicològica importa més, no menys. Un estudi del 2026 va vincular la inseguretat laboral per la IA amb el desgast, en part perquè erosiona la seguretat psicològica, i va trobar que la confiança en l'ús de la IA suavitza aquest efecte."]]}, {"id": "ch2-talk", "k": "La conversa", "h": "Cinc passos", "blocks": [["steps", [["Obre la porta", "«Com et sents amb la IA i amb el teu rol?» Pregunta-ho a les reunions un a un, no només a les reunions generals."], ["Escolta primer", "Parafraseja, pregunta què més i resisteix les ganes de tranquil·litzar massa aviat."], ["Sigues honest", "Comparteix el que saps i el que no. No prometis mai el que no pots complir."], ["Troba el camí", "Quines parts de la seva feina guanyen valor? Quines habilitats l'ajudarien? Què podria provar aquest mes?"], ["Acordeu un pas següent", "Un experiment, una habilitat i una data per tornar-ne a parlar."]]], ["two", ["Evita", "«Tranquil, no canviarà res.»"], ["Prova", "«Part de la nostra feina canviarà. Mirem la teva junts i decidim on vols créixer.»"]], ["link", "Prepara't amb Human First: Converses difícils", "#human-first/ch5"]]}, {"id": "ch2-bank", "k": "Banc de preguntes", "h": "Preguntes que obren la conversa", "blocks": [["bank", [["Emocions", "Anomenar el que hi ha.", ["Què t'il·lusiona de la IA i què et preocupa?", "Què has sentit que t'inquieta?", "Què t'ajudaria a sentir-te amb més confiança?"], "Accepta la resposta. No discuteixis amb les emocions."], ["Valor", "Trobar el que creix.", ["Quines parts de la teva feina importen més a clients o companys?", "On marca més diferència el teu criteri?", "Per a què et busca la gent?"], "Assenyala fortaleses que la IA no substitueix."], ["Creixement", "Obrir un camí.", ["Quines tasques passaries de gust a la IA?", "Què faries amb dues hores més a la setmana?", "Quina habilitat et faria més valuós d'aquí a un any?"], "Converteix la resposta en un experiment petit i amb data."]]]]}], "sum": [["Tres pors", "Seguretat, estatus i identitat."], ["Primer escoltar", "Obre la porta, escolta, sigues honest."], ["Un camí", "Acaba amb un pas següent concret."]], "rem": "La por s'encongeix quan es veu un camí."}, {"id": "ch3", "h": "Fer segur experimentar", "hook": "Si la gent amaga el seu ús de la IA, perds el que ha après.", "secs": [{"id": "ch3-hidden", "k": "La multitud amagada", "h": "Probablement el teu equip ja fa servir IA", "blocks": [["p", "Ethan Mollick anomena «secret cyborgs» les persones que fan servir la IA en silenci sense dir-ho a ningú. Ho amaguen perquè les regles no són clares, perquè temen semblar menys capaces o perquè els preocupa que el temps estalviat es converteixi en més feina o en menys llocs. Un ús amagat vol dir riscos amagats i aprenentatge perdut."], ["cards", 3, [["Lideratge", "Marca la direcció, els permisos i els incentius.", []], ["Laboratori", "Unes poques persones que proven, construeixen i comparteixen el que funciona.", []], ["Multitud", "Tot l'equip fent servir IA en feina real, d'on surten la majoria de les bones idees.", []]]], ["note", "Leadership, Lab and Crowd és el marc d'Ethan Mollick per a la IA a les organitzacions (One Useful Thing, 2025). En un equip, tu ets el lideratge, uns quants voluntaris formen el laboratori i tot l'equip és la multitud."]]}, {"id": "ch3-rules", "k": "Eina", "h": "Defineix les regles d'experimentació de l'equip", "blocks": [["cards", 3, [["Endavant", "", ["Redactar, resumir i generar idees amb eines aprovades", "Tasques internes de baix risc que revises tu", "Aprendre i practicar"]], ["Pregunta abans", "", ["Tot el que veurà un client o un regulador", "Tot el que impliqui decisions sobre persones", "Eines o fonts de dades noves"]], ["Mai", "", ["Dades confidencials o personals en eines no aprovades", "Enviar resultats d'IA sense revisar-los", "Amagar que la IA va fer una part important de la feina"]]]], ["callout", "Adapta les llistes a la política d'IA de la teva organització. Les regles clares augmenten l'ús segur; les regles vagues l'amaguen."]]}, {"id": "ch3-share", "k": "Fer visible l'aprenentatge", "h": "Converteix els trucs privats en coneixement de l'equip", "blocks": [["steps", [["Demo ràpida", "Deu minuts a la reunió d'equip: un cas d'ús, un prompt, un error."], ["Reconeix qui comparteix", "Valora qui comparteix, no només qui estalvia temps."], ["Protegeix el guany", "Acordeu com es farà servir el temps estalviat: millor feina, aprenentatge, menys hores extres, no només més volum."], ["Tingues una biblioteca", "Una pàgina compartida amb prompts, exemples i lliçons apreses."]]]]}], "sum": [["Ús amagat", "S'amaga la IA quan les regles són vagues o compartir sembla arriscat."], ["Regles clares", "Endavant, pregunta abans, mai."], ["Aprenentatge visible", "Demos, reconèixer qui comparteix, protegir el guany."]], "rem": "Que provar sigui segur i compartir sigui normal."}, {"id": "ch4", "h": "Redissenyar la feina junts", "hook": "No enganxis la IA al lloc de sempre. Decideix quina feina ha de canviar.", "secs": [{"id": "ch4-why", "k": "Més enllà de les eines", "h": "De tasques a fluxos de treball", "blocks": [["p", "L'informe Global Human Capital Trends 2026 de Deloitte va trobar que només el 6% dels líders diu que avança en el disseny de com treballen juntes les persones i la IA. La recerca de McKinsey apunta en la mateixa direcció: el valor ve de repensar la feina de cap a cap, no d'accelerar tasques soltes. Comença on pots: la feina real del teu equip, tasca per tasca."], ["tiles", [["A", "Automatitzar", "La IA ho fa i una persona revisa una mostra. Feina repetitiva, amb regles, on els errors es detecten fàcilment."], ["+", "Augmentar", "La IA prepara o analitza; una persona decideix i acaba. La major part de la feina del coneixement."], ["H", "Mantenir humà", "Relacions, empatia, responsabilitat, ètica i criteri nou. La IA et pot ajudar a preparar-ho."], ["×", "Deixar de fer", "Feina que ja no aporta valor. Pregunta't per què es fa."]]], ["callout", "Ethan Mollick proposa que cada equip es pregunti quina feina útil deixa de tenir valor quan la IA la pot fer. Algunes tasques no s'han d'automatitzar: s'han de deixar.", true]]}, {"id": "ch4-sort", "k": "Eina", "h": "Classifica les tasques del teu equip", "blocks": [["sorter"]]}, {"id": "ch4-session", "k": "Fes-ho amb el teu equip", "h": "Una sessió de redisseny de 60 minuts", "blocks": [["steps", [["Llistar", "Cada persona apunta les deu tasques que més temps li porten."], ["Classificar", "Feu servir el classificador junts i discrepeu en veu alta."], ["Triar", "Trieu dues tasques per automatitzar o augmentar aquest mes."], ["Provar", "Feu l'experiment durant dues setmanes, amb una persona responsable."], ["Revisar", "Manteniu-lo, adapteu-lo o descarteu-lo, i decidiu què fer amb el temps estalviat."]]]]}], "sum": [["Redissenyar", "Canvia la feina, no només les eines."], ["Quatre opcions", "Automatitzar, augmentar, mantenir humà o deixar de fer."], ["Junts", "Classifica les tasques amb qui les fa."]], "rem": "Redissenya amb el teu equip, no per al teu equip."}, {"id": "ch5", "h": "Liderar persones i agents", "hook": "Pots delegar la tasca a la IA. No pots delegar la responsabilitat.", "secs": [{"id": "ch5-agent", "k": "Un nou rol", "h": "Tothom passa a gestionar agents", "blocks": [["p", "El Work Trend Index 2025 de Microsoft descriu equips de persones i agents d'IA, i un nou rol per a tothom: l'«agent boss», que crea agents, els delega feina i els gestiona. També planteja una nova pregunta per als líders: quin és l'equilibri adequat entre persones i agents per a cada tasca? Per a tu, vol dir liderar persones que, al seu torn, lideren agents."], ["cards", 3, [["Delega amb claredat", "Dona a la IA un objectiu, context, límits i un exemple del que està bé, com faries amb algú nou.", []], ["Supervisa amb criteri", "Com més risc, més propera la revisió. Comprova a l'atzar fins i tot el que sol funcionar.", []], ["Respon del resultat", "Qui ho envia n'és responsable. «Ho va fer la IA» no és mai una resposta.", []]]]]}, {"id": "ch5-rights", "k": "Drets de decisió", "h": "Qui fa què: persones i IA", "blocks": [["table", ["Decisió", "La IA pot…", "Una persona…"], [["Alt risc o difícil de revertir", "Només aportar informació", "Recomana, decideix i respon"], ["Risc mitjà o parcialment reversible", "Aportar informació i recomanar", "Decideix i respon"], ["Baix risc, reversible i freqüent", "Decidir dins de límits acordats", "Supervisa, revisa mostres i respon de les regles"]]], ["note", "Simplificat de la lògica de drets de decisió de Co-Intelligence AI Decision Making, que amplia el model RAPID de Bain a la IA."], ["link", "Mapeja les decisions del teu equip: Co-Intelligence AI Decision Making", "../maturity/?lang={lang}#hx"]]}, {"id": "ch5-coach", "k": "Coaching a l'era de la IA", "h": "Fes coaching sobre com es treballa amb la IA", "blocks": [["cards", 2, [["Pregunta pel procés", "«Com vas fer servir la IA aquí? Què vas revisar? Què vas canviar?»", []], ["Vigila la pèrdua d'habilitats", "Assegura't que les persones continuen practicant les habilitats clau del seu rol, no només els prompts.", []]]], ["link", "Repassa el teu coaching: Human First, Converses de coaching", "#human-first/ch3"]]}], "sum": [["Gestionar agents", "Tothom delega en la IA i la supervisa."], ["El risc marca el rol", "Com més risc, menys autonomia per a la IA."], ["Responsabilitat", "Qui ho envia en respon."]], "rem": "Delega la tasca, mai la responsabilitat."}, {"id": "ch6", "h": "Protegir la qualitat i el criteri", "hook": "Polit no és el mateix que bo.", "secs": [{"id": "ch6-slop", "k": "Un problema nou", "h": "El «workslop»", "blocks": [["p", "Investigadors del Social Media Lab de Stanford i de BetterUp Labs (Harvard Business Review, 2025) van encunyar «workslop»: feina generada amb IA que sembla polida però no té substància i trasllada l'esforç a qui la rep. A la seva enquesta a 1.150 treballadors dels EUA, al voltant del 40% n'havia rebut el mes anterior; cada cas costava gairebé dues hores resoldre'l, i molts veien qui l'enviava com a menys capaç i menys fiable. Deloitte (2026) va trobar que prop del 80% dels líders tem que es faci servir la IA per semblar més productiu del que s'és."], ["two", ["Workslop", "Un resum llarg i segur que respon a una pregunta que ningú no va fer i costa una hora arreglar."], ["Bona feina amb IA", "Un esborrany breu, amb una idea clara, dades comprovades i una nota del que va fer la IA."]]]}, {"id": "ch6-skill", "k": "Continuar pensant", "h": "Que no es perdin les habilitats", "blocks": [["p", "En un estudi del 2025 de Microsoft Research i la Universitat Carnegie Mellon amb 319 treballadors del coneixement, més confiança en la IA anava amb menys pensament crític, mentre que més confiança en les pròpies habilitats anava amb més. El risc és una pèrdua silenciosa d'habilitats: es revisen els resultats però es deixa de practicar el raonament que hi ha darrere."], ["cards", 3, [["Pensa primer", "Escriu la teva pròpia visió o esquema abans de preguntar a la IA.", []], ["Demana el raonament", "Demana a la IA que mostri els passos i les fonts, i qüestiona'ls.", []], ["Practica sense ella", "Fes tasques clau sense ajuda de tant en tant, sobretot si ets nou al lloc.", []]]]]}, {"id": "ch6-check", "k": "Eina", "h": "Abans d'enviar-ho: la revisió de qualitat", "blocks": [["checklist", [["Substància", "Fa avançar la tasca?", [["Respon a la pregunta o necessitat real.", false], ["Podria explicar i defensar cada punt.", false]]], ["Exactitud", "Ho has comprovat?", [["He comprovat dades, xifres, noms i fonts.", false], ["No conté dades confidencials o personals que no hi hagin de ser.", false]]], ["Respecte per qui ho llegeix", "Val el seu temps?", [["És tan breu com pot ser.", false], ["Ho assumeixo com a meu i he indicat on la IA va fer una part important.", false]]]]]]}], "sum": [["Workslop", "La feina polida però buida trasllada l'esforç als altres."], ["Pensa primer", "Continua practicant les habilitats que hi ha darrere."], ["Revisa", "Substància, exactitud i respecte per qui ho llegeix."]], "rem": "Fes servir la IA per apujar el llistó, no per abaixar l'esforç."}, {"id": "ch7", "h": "Que perduri", "hook": "Mesura valor, no accessos. Crea hàbits, no llançaments.", "secs": [{"id": "ch7-measure", "k": "Què mesurar", "h": "Valor, no ús", "blocks": [["table", ["En lloc de…", "Mesura…"], [["Llicències i accessos", "Temps alliberat i com s'ha reinvertit"], ["Prompts escrits", "Qualitat: errors, refeina, opinió dels clients"], ["Pilots llançats", "Feina redissenyada que continua en marxa als tres mesos"], ["Hores de formació", "Confiança i habilitat: en saben i ho saben jutjar?"]]], ["callout", "Els pilots per si sols no creen valor. Escala el que funciona, atura el que no i explica per què."]]}, {"id": "ch7-rhythm", "k": "Hàbits d'equip", "h": "Ritmes que mantenen viu el canvi", "blocks": [["steps", [["Cada setmana", "Cinc minuts a la reunió d'equip: un encert amb IA, un error, una pregunta."], ["Cada mes", "Reviseu els experiments: mantenir, adaptar o aturar. Actualitzeu el mapa de tasques."], ["Cada trimestre", "Reviseu la carta, el pla d'habilitats i l'ús del temps estalviat."], ["Sempre", "A les reunions un a un, pregunta: com està canviant la IA la teva feina i com et sents?"]]]]}, {"id": "ch7-charter", "k": "Eina", "h": "La carta d'IA del teu equip", "blocks": [["builder", "charter", [["El nostre propòsit amb la IA", "p. ex. Més temps per als clients i per a la feina que necessita el nostre criteri."], ["El que continua sent humà", "p. ex. L'assessorament als clients, les decisions sobre persones, tot el que signem."], ["Les nostres regles", "Endavant / pregunta abans / mai."], ["Com compartim", "p. ex. Demo cada dilluns i una biblioteca compartida de prompts."], ["Com revisem la qualitat", "p. ex. La revisió de qualitat abans que res surti de l'equip."], ["Com creixem", "p. ex. Una habilitat nova d'IA per trimestre; aprenem en parelles."]]]]}], "sum": [["Valor", "Mesura temps reinvertit, qualitat i feina redissenyada."], ["Ritme", "Hàbits setmanals, mensuals i trimestrals."], ["Carta", "Escriu com treballa el teu equip amb la IA."]], "rem": "Els petits hàbits setmanals guanyen els grans llançaments."}]};
const AIUI={"en": {"pfName": "Change in the AI era", "pfSub": "Human-led, AI-powered", "pfDesc": "For people managers: lead your team through AI change with honest conversations, safe experiments, redesigned work and habits that last.", "pfPills": ["8 chapters", "Task sorter and team charter", "10 min per chapter"], "roadLead": "Eight short chapters, from why AI change is a people change to the habits that make it stick.", "how": [["Ten minutes per chapter", "Each chapter ends with a summary, so you can skim first and go deeper later."], ["Use the tools with your team", "Sort tasks, write your AI story and draft your team charter together."], ["Pair it with Human First", "The conversations here build on listening, coaching and difficult conversations."]], "tryWeek": "Try it this week: ask each person in a one-to-one how they feel about AI and their role, then run a ten-minute show-and-tell in your team meeting.", "fig": ["People", "AI", "Work", "Judgement"], "credit": "Change in the AI era is Fran Mondaca's own synthesis of public, credited sources: BCG (10-20-70 rule; Dell'Acqua et al., 2023, the jagged frontier), McKinsey (State of AI 2026; Superagency in the Workplace, 2025), MIT NANDA (The GenAI Divide, 2025), Prosci (AI adoption research), Ethan Mollick (Leadership, Lab and Crowd), Microsoft Work Trend Index 2025, Deloitte Global Human Capital Trends 2026, Mercer (2026), Gallup (2026), Stanford Social Media Lab and BetterUp Labs (workslop, HBR 2025) and Microsoft Research with Carnegie Mellon University (2025). Figures are as reported by those sources.", "titleGuide": "Change in the AI era: human-led, AI-powered"}, "es": {"pfName": "Change in the AI era", "pfSub": "Human-led, AI-powered", "pfDesc": "Para managers de personas: lidera a tu equipo en el cambio con IA con conversaciones honestas, experimentos seguros, trabajo rediseñado y hábitos que perduran.", "pfPills": ["8 capítulos", "Clasificador de tareas y carta del equipo", "10 min por capítulo"], "roadLead": "Ocho capítulos breves, desde por qué el cambio con IA es un cambio de personas hasta los hábitos que lo hacen perdurar.", "how": [["Diez minutos por capítulo", "Cada capítulo termina con un resumen: puedes hojearlo primero y profundizar después."], ["Usa las herramientas con tu equipo", "Clasificad tareas, escribid vuestra historia de la IA y redactad juntos la carta del equipo."], ["Combínalo con Human First", "Las conversaciones de aquí se apoyan en la escucha, el coaching y las conversaciones difíciles."]], "tryWeek": "Pruébalo esta semana: pregunta a cada persona, en una reunión uno a uno, cómo se siente con la IA y con su rol, y haz una demo de diez minutos en la reunión de equipo.", "fig": ["Personas", "IA", "Trabajo", "Criterio"], "credit": "Change in the AI era es una síntesis propia de Fran Mondaca a partir de fuentes públicas y citadas: BCG (regla 10-20-70; Dell'Acqua et al., 2023, la frontera irregular), McKinsey (State of AI 2026; Superagency in the Workplace, 2025), MIT NANDA (The GenAI Divide, 2025), Prosci (investigación sobre adopción de IA), Ethan Mollick (Leadership, Lab and Crowd), Microsoft Work Trend Index 2025, Deloitte Global Human Capital Trends 2026, Mercer (2026), Gallup (2026), Stanford Social Media Lab y BetterUp Labs (workslop, HBR 2025) y Microsoft Research con la Universidad Carnegie Mellon (2025). Las cifras son las publicadas por esas fuentes.", "titleGuide": "Change in the AI era: human-led, AI-powered"}, "ca": {"pfName": "Change in the AI era", "pfSub": "Human-led, AI-powered", "pfDesc": "Per a managers de persones: lidera el teu equip en el canvi amb IA amb converses honestes, experiments segurs, feina redissenyada i hàbits que perduren.", "pfPills": ["8 capítols", "Classificador de tasques i carta de l'equip", "10 min per capítol"], "roadLead": "Vuit capítols breus, des de per què el canvi amb IA és un canvi de persones fins als hàbits que el fan perdurar.", "how": [["Deu minuts per capítol", "Cada capítol acaba amb un resum: el pots fullejar primer i aprofundir després."], ["Fes servir les eines amb el teu equip", "Classifiqueu tasques, escriviu la vostra història de la IA i redacteu junts la carta de l'equip."], ["Combina'l amb Human First", "Les converses d'aquí es recolzen en l'escolta, el coaching i les converses difícils."]], "tryWeek": "Prova-ho aquesta setmana: pregunta a cada persona, en una reunió un a un, com se sent amb la IA i amb el seu rol, i fes una demo de deu minuts a la reunió d'equip.", "fig": ["Persones", "IA", "Feina", "Criteri"], "credit": "Change in the AI era és una síntesi pròpia de Fran Mondaca a partir de fonts públiques i citades: BCG (regla 10-20-70; Dell'Acqua et al., 2023, la frontera irregular), McKinsey (State of AI 2026; Superagency in the Workplace, 2025), MIT NANDA (The GenAI Divide, 2025), Prosci (recerca sobre adopció d'IA), Ethan Mollick (Leadership, Lab and Crowd), Microsoft Work Trend Index 2025, Deloitte Global Human Capital Trends 2026, Mercer (2026), Gallup (2026), Stanford Social Media Lab i BetterUp Labs (workslop, HBR 2025) i Microsoft Research amb la Universitat Carnegie Mellon (2025). Les xifres són les publicades per aquestes fonts.", "titleGuide": "Change in the AI era: human-led, AI-powered"}};
const AICHEAT={"en": ["AI change is 70% people: lead the people part.", "Know the jagged frontier, and tell your team's AI story.", "Ask how people feel; help them see a path.", "Clear rules, visible learning: make it safe to try.", "Automate, augment, keep human or stop.", "Delegate the task, never the accountability.", "Polished is not good: check substance and keep thinking.", "Measure value, keep weekly rhythms, write a charter."], "es": ["El cambio con IA es 70% personas: lidera la parte humana.", "Conoce la frontera irregular y cuenta la historia de la IA de tu equipo.", "Pregunta cómo se sienten; ayúdales a ver un camino.", "Reglas claras, aprendizaje visible: que probar sea seguro.", "Automatizar, aumentar, mantener humano o dejar de hacer.", "Delega la tarea, nunca la responsabilidad.", "Pulido no es bueno: revisa la sustancia y sigue pensando.", "Mide valor, mantén ritmos semanales, escribe una carta."], "ca": ["El canvi amb IA és 70% persones: lidera la part humana.", "Coneix la frontera irregular i explica la història de la IA del teu equip.", "Pregunta com se senten; ajuda'ls a veure un camí.", "Regles clares, aprenentatge visible: que provar sigui segur.", "Automatitzar, augmentar, mantenir humà o deixar de fer.", "Delega la tasca, mai la responsabilitat.", "Polit no és bo: revisa la substància i continua pensant.", "Mesura valor, mantén ritmes setmanals, escriu una carta."]};
const SCPF={"en": [{"id": "ch0", "h": "Purpose and principles", "hook": "Capabilities turn strategy into action.", "secs": [{"id": "ch0-why", "k": "Start here", "h": "Every people investment, traced to a business result", "blocks": [["p", "A capability plan is a plan for change with measurable impact, not a list of courses. This playbook follows an enterprise Learning Plan model (about 70%), adds tools from my Capabilities Building Toolkit created at Mölnlycke (about 20%), and includes a few proposals of my own (about 10%). Each chapter says where its content comes from."], ["callout", "Every investment in people should be traceable to a business result.", true]]}, {"id": "ch0-principles", "k": "Six principles", "h": "What holds the plan together", "blocks": [["steps", [["The business owns the why", "The Business Lead defines the problem, the Capability Building Lead designs the how, and the HRBP connects it to the people strategy."], ["Federated, not central", "Corporate L&D sets standards, taxonomy and platforms. Functions own their plans. Regions and markets activate and localise."], ["One skills language", "A standard taxonomy, not customised by function or market."], ["Reuse and curate before you create", "Retire content that isn't used."], ["Measure change, not completion", "Adoption, behaviour and business impact."], ["Focus", "Each function concentrates on the 2–3 capabilities that create the greatest competitive edge, instead of spreading effort thinly."]]], ["note", "Source: enterprise Learning Plan model, with the rationale from the Mölnlycke toolkit."]]}], "sum": [["Purpose", "A plan for change with measurable impact."], ["Ownership", "The business owns the why; L&D designs the how."], ["Focus", "Two or three capabilities that create the greatest edge."]], "rem": "Measure change, not completion."}, {"id": "ch1", "h": "The cycle and who does what", "hook": "The signed plan is the hinge between strategy and delivery.", "secs": [{"id": "ch1-cycle", "k": "The cycle at a glance", "h": "Five phases, every year", "blocks": [["steps", [["Contract", "The business and the Capability Building Lead agree the problem and the roles."], ["Discover", "The Capability Building Lead and experts define segments and skills."], ["Analyse and agree", "The business signs the plan and the budget."], ["Implement", "Partners, regions and markets deliver, reusing first."], ["Review and renew", "Mid-year and annual reviews decide what to keep or close."]]], ["callout", "Each function runs this cycle every year, and each review feeds the next year's Learning Plan."], ["note", "Source: enterprise Learning Plan model."]]}, {"id": "ch1-roles", "k": "Roles", "h": "Who does what", "blocks": [["table", ["Role or forum", "Accountability", "Key decisions and outputs", "RACI"], [["Corporate L&D", "Direction, policy, standards, skills taxonomy, enterprise platforms, supplier strategy, quality and impact", "Guardrails, frameworks, dashboards, enterprise contracts", "A"], ["Learning council (one representative per function)", "Aligns functional capability strategies and prevents reinvention across functions, regions and markets", "Common priorities, reuse, scaling, resolving overlaps", "C"], ["Capability Building Lead (per function)", "Owns the function's Learning Plan", "Segments, skills, portfolio, build or buy proposals, sign-off with the business and HR", "R/A"], ["Business Lead", "Sponsors the capability need of the area", "Business problem, priority, investment, impact review", "C/A"], ["HRBP", "Connects the plan to the people and workforce strategy", "Workforce implications, validation", "C"], ["Shared services", "Scalable operations and data", "Publishing, assignments, channels, analytics, translations", "R"], ["Regions and markets", "Activation and localisation", "Adoption, legal and language adaptation, local communities", "R"]]], ["callout", "In short: the Business Lead sets the why, the Capability Building Lead designs the how, and Corporate L&D keeps the whole system consistent.", true]]}], "sum": [["Five phases", "Contract, discover, agree, implement, review."], ["The hinge", "The signed plan links strategy to delivery."], ["Clear roles", "Why, how and consistency each have an owner."]], "rem": "No signature, no plan."}, {"id": "ch2", "h": "Phase 1: Contract", "hook": "What business problem are we solving, who decides, and how will we work together?", "secs": [{"id": "ch2-what", "k": "The phase", "h": "Agree the problem and the roles", "blocks": [["cards", 2, [["Who", "The Capability Building Lead and the Business Lead, with the HRBP where useful.", []], ["Output", "An agreed purpose, roles and expectations, and a calendar for the cycle.", []]]], ["note", "Source: enterprise Learning Plan model, with the session flow from the Mölnlycke toolkit."]]}, {"id": "ch2-run", "k": "How to run it", "h": "Running it with a leadership team", "blocks": [["steps", [["Kick-off (1 hour)", "Build a common language and strategic alignment."], ["Individual reflection (1–2 weeks, optional)", "Each leader thinks through the strategy, the value chain and the capabilities."], ["Calibration (2 hours)", "Compare views, agree priorities and confirm roles and calendar."]]], ["callout", "Start with the business problem, not with the learning solution."]]}], "sum": [["Problem first", "Agree the business problem before any solution."], ["Roles", "Business Lead, Capability Building Lead and HRBP."], ["Rhythm", "Kick-off, reflection, calibration."]], "rem": "Contract the why before designing the how."}, {"id": "ch3", "h": "Phase 2: Discover", "hook": "Which jobs to be done, segments, skills and mindsets does the strategy require?", "secs": [{"id": "ch3-what", "k": "The phase", "h": "From strategy to segments and skills", "blocks": [["cards", 3, [["Who", "The Capability Building Lead, subject-matter experts and People Analytics.", []], ["Inputs", "Strategic workforce planning, organisation and job data, and the standard skills taxonomy.", []], ["Output", "The target segments, the capability gaps and the current proficiency.", []]]], ["note", "Source: enterprise Learning Plan model, with the ABC model and glossary from the Mölnlycke toolkit."]]}, {"id": "ch3-abc", "k": "The ABC model", "h": "From strategy to capabilities", "blocks": [["tiles", [["A", "Functional strategy", "What is our role in delivering the company strategy, and which outcomes must we enable in the next 2–3 years?"], ["B", "Value chain", "Which core activities deliver the most value, and what would be at risk without us?"], ["C", "Capabilities", "Which capabilities drive the strategy, which are strong today, and which need strengthening?"], ["→", "Then", "Turn the answers into segments, gaps and proficiency targets."]]]]}, {"id": "ch3-terms", "k": "A shared vocabulary", "h": "Speak one language", "blocks": [["table", ["Term", "Meaning", "Best used for"], [["Capability", "A strategic combination of skills, knowledge, behaviours and processes that delivers a business outcome", "Strategy and planning"], ["Skill", "A granular ability that can be learned and demonstrated, and transfers across roles", "Learning and development"], ["Knowledge", "Understanding of a subject, process or technology", "Learning and development"], ["Drivers and traits", "Motivators and natural characteristics", "Recruitment and self-awareness"], ["Proficiency", "The level of mastery in applying a skill, from novice to expert", "Assessment and pathways"]]]]}], "sum": [["Inputs", "Workforce plans, job data and one taxonomy."], ["ABC", "Strategy, value chain, capabilities."], ["Language", "Capability, skill, knowledge, traits, proficiency."]], "rem": "Start from the strategy, not from the catalogue."}, {"id": "ch4", "h": "Phase 3: Analyse and agree", "hook": "What do we simplify, prioritise and fund?", "secs": [{"id": "ch4-what", "k": "The phase", "h": "The hinge of the whole cycle", "blocks": [["cards", 2, [["Who", "The Capability Building Lead proposes; the Business Lead and HRBP validate the priority, the need and the investment.", []], ["Output", "A list of segments, skills, solutions and budget, and a signed Learning Plan.", []]]], ["callout", "This sign-off is the hinge of the whole cycle: from here, the plan has an owner, a budget and an expected result.", true], ["note", "Source: enterprise Learning Plan model, with the prioritisation template from the Mölnlycke toolkit."]]}, {"id": "ch4-q", "k": "Choose well", "h": "Questions that sharpen the choice", "blocks": [["bank", [["Prioritise", "Aim for three or four capabilities.", ["Which capabilities set us apart from competitors?", "Where are the biggest gaps, and where do we rely on a few experts?", "If we could build only one capability this year, which would have the greatest impact?", "Where is it most cost-efficient to build, buy or borrow?"], "Rate criticality from 1 (low) to 5 (high), and readiness as green, amber or red."]]]]}, {"id": "ch4-plan", "k": "Template", "h": "The signed plan on one page", "blocks": [["table", ["Strategic goal", "Capability", "Outcome and KPI", "Criticality", "Readiness", "Skilling actions", "Audience", "Owner and date"], [["Operational excellence", "Project management", "Projects on time and on budget. KPI: % on time, % within budget", "4", "Amber", "Advanced project management training, internal mentoring for project leads", "Project managers, team leads", "Leadership team member, Q4"]]], ["builder", "plan", [["Strategic goal", "e.g. Operational excellence"], ["Capability", "e.g. Project management"], ["Outcome and KPI", "e.g. Projects on time and on budget; % on time"], ["Criticality (1–5)", "e.g. 4"], ["Readiness (green, amber, red)", "e.g. Amber"], ["Skilling actions", "e.g. Training plus internal mentoring"], ["Audience", "e.g. Project managers and team leads"], ["Owner and date", "e.g. Leadership team member, Q4"]]]]}], "sum": [["Sign-off", "The plan gets an owner, a budget and a result."], ["Three or four", "Prioritise the capabilities that matter most."], ["One page", "Goal, capability, KPI, readiness, actions, owner."]], "rem": "The signature turns a wish list into a plan."}, {"id": "ch5", "h": "Phase 4: Implement", "hook": "What do we reuse, curate, buy, build and deploy?", "secs": [{"id": "ch5-what", "k": "The phase", "h": "Deliver, reusing first", "blocks": [["cards", 2, [["Who", "Suppliers and subject-matter experts design; shared services publish and integrate; regions and markets activate.", []], ["A brief before design", "Every new solution starts from a short brief agreed with the business.", []]]], ["steps", [["Reuse", "Internal content first."], ["Curate", "From enterprise libraries."], ["Buy", "From specialist suppliers."], ["Build", "Only as a last resort."]]], ["note", "Source: enterprise Learning Plan model, with the 70/20/10 initiative design from the Mölnlycke toolkit."]]}, {"id": "ch5-design", "k": "From capability to initiative", "h": "Turning a capability into a learning initiative", "blocks": [["steps", [["Start with the KPI", "One result that must improve."], ["Choose one capability", "The one that drives it, with its 3–5 core skills mapped."], ["Set the measures", "For 30, 60 and 90 days."], ["Design a 70/20/10 pathway", "In the flow of work: 70% real tasks and stretch assignments, 20% coaching and peer practice, 10% targeted resources."]]], ["callout", "The 70/20/10 model comes from research by Lombardo and Eichinger at the Center for Creative Leadership. Use it as a design guide, not a formula."]]}], "sum": [["Order of choice", "Reuse, curate, buy, build."], ["Brief first", "Agree a short brief with the business."], ["70/20/10", "Most learning happens in the flow of work."]], "rem": "Build only when nothing else will do."}, {"id": "ch6", "h": "Phase 5: Review and renew", "hook": "What usage, impact and insights justify continuing, changing or closing each initiative?", "secs": [{"id": "ch6-what", "k": "The phase", "h": "Keep, change or close", "blocks": [["cards", 2, [["Rhythm", "A mid-year review and an annual review with the Business Lead, which feed next year's plan.", []], ["Output", "Decisions for the next cycle, including retiring duplicated or unused content.", []]]], ["note", "Source: enterprise Learning Plan model, with the four-level impact framework from the Mölnlycke toolkit."]]}, {"id": "ch6-levels", "k": "Measuring impact", "h": "Four levels of evidence", "blocks": [["table", ["Level", "Question", "How to measure"], [["1. Reaction", "Did it feel relevant and practical?", "A 2-minute survey, plus \"One thing I'll apply right away\""], ["2. Learning", "Can they explain or demonstrate the skill?", "Pre- and post-self-ratings or a quiz"], ["3. Behaviour", "What new behaviours are visible on the job?", "Manager or peer check-ins at 30 and 60 days, plus workflow data"], ["4. Results", "How has the capability moved the KPI?", "Baseline compared with post-programme data"]]], ["callout", "Use Level 4 only when behaviour clearly drives a business result, the cost of not changing is significant, and the leadership team commits to acting on the data.", true], ["note", "The four levels follow Donald Kirkpatrick's training evaluation model."]]}, {"id": "ch6-gate", "k": "Tool", "h": "Is this the right learning initiative?", "blocks": [["p", "Use this gate before any new request enters the plan. A request that fails a gate goes back to the business, not into the catalogue."], ["gate", [["Must a business KPI improve?", "Not a learning initiative."], ["Does one capability drive it?", "Capability or process issue? Check before you design."], ["Do 3–5 skills enable it?", "Clarify the skills first."], ["Are 30/60/90-day measures set?", "Set the baseline and measures first."]], "Design a 70/20/10 pathway. Measure Levels 1–3; add Level 4 only when leaders commit to act on the data."], ["note", "Source: Mölnlycke toolkit."]]}], "sum": [["Rhythm", "Mid-year and annual reviews feed the next plan."], ["Evidence", "Reaction, learning, behaviour, results."], ["Gate", "Only a KPI-led, skill-mapped, measured need becomes an initiative."]], "rem": "Retire what isn't used. Fund what moves the KPI."}, {"id": "ch7", "h": "What I would add", "hook": "Make the investment behind each plan governed, visible and measurable.", "secs": [{"id": "ch7-add", "k": "My proposals", "h": "Five additions", "blocks": [["p", "The model is strong on strategy and ownership. These additions make the investment behind each plan governed, visible and measurable."], ["steps", [["A partnership and spend layer", "Link every skilling action that uses a supplier to a partner tier (strategic, preferred or tactical), with a performance scorecard for strategic partners. Spend then becomes visible per capability, not just per supplier."], ["An operational forum under the council", "A regular working group of functions, shared services and Corporate L&D to settle ownership, metadata, content lifecycle and scaling, so council decisions turn into practice."], ["AI-assisted triage", "A gatekeeper agent applies the decision gate and the plan's criteria to new requests. Simple ones move fast; only strategic ones reach the council."], ["One line of sight", "A single dashboard that reads capability, then KPI, then spend, then impact, so every Business Lead can see the return on their plan."], ["Make it visible", "Publish each function's capability model in one central hub, open to all employees, to support internal mobility."]]], ["note", "Source: my proposals."]]}, {"id": "ch7-next", "k": "Go further", "h": "Check where you stand", "blocks": [["link", "Assess your LearnOps and governance maturity", "../maturity/?lang={lang}#learnops"], ["link", "Map your learning partners: Learning Partnership Landscape", "../maturity/partners/?lang={lang}"]]}], "sum": [["Spend", "Link supplier spend to capabilities and partner tiers."], ["Govern", "An operational forum and AI-assisted triage."], ["Visibility", "One line of sight and an open capability hub."]], "rem": "From capability to KPI to spend to impact: one line of sight."}], "es": [{"id": "ch0", "h": "Propósito y principios", "hook": "Las capacidades convierten la estrategia en acción.", "secs": [{"id": "ch0-why", "k": "Empieza aquí", "h": "Cada inversión en personas, trazable hasta un resultado de negocio", "blocks": [["p", "Un plan de capacidades es un plan de cambio con impacto medible, no una lista de cursos. Este playbook sigue un modelo empresarial de Learning Plan (alrededor del 70%), añade herramientas de mi Capabilities Building Toolkit creado en Mölnlycke (alrededor del 20%) e incluye algunas propuestas propias (alrededor del 10%). Cada capítulo indica de dónde viene su contenido."], ["callout", "Cada inversión en personas debería poder trazarse hasta un resultado de negocio.", true]]}, {"id": "ch0-principles", "k": "Seis principios", "h": "Lo que sostiene el plan", "blocks": [["steps", [["El negocio es dueño del porqué", "El Business Lead define el problema, el Capability Building Lead diseña el cómo y el HRBP lo conecta con la estrategia de personas."], ["Federado, no central", "L&D corporativo fija estándares, taxonomía y plataformas. Las funciones son dueñas de sus planes. Regiones y mercados activan y localizan."], ["Un solo lenguaje de habilidades", "Una taxonomía estándar, no personalizada por función ni por mercado."], ["Reutiliza y cura antes de crear", "Retira el contenido que no se usa."], ["Mide el cambio, no la finalización", "Adopción, comportamiento e impacto en el negocio."], ["Foco", "Cada función se concentra en las 2–3 capacidades que crean la mayor ventaja competitiva, en lugar de repartir el esfuerzo."]]], ["note", "Fuente: modelo empresarial de Learning Plan, con la lógica del toolkit de Mölnlycke."]]}], "sum": [["Propósito", "Un plan de cambio con impacto medible."], ["Propiedad", "El negocio es dueño del porqué; L&D diseña el cómo."], ["Foco", "Dos o tres capacidades que crean la mayor ventaja."]], "rem": "Mide el cambio, no la finalización."}, {"id": "ch1", "h": "El ciclo y quién hace qué", "hook": "El plan firmado es la bisagra entre la estrategia y la ejecución.", "secs": [{"id": "ch1-cycle", "k": "El ciclo de un vistazo", "h": "Cinco fases, cada año", "blocks": [["steps", [["Contratar", "El negocio y el Capability Building Lead acuerdan el problema y los roles."], ["Descubrir", "El Capability Building Lead y los expertos definen segmentos y habilidades."], ["Analizar y acordar", "El negocio firma el plan y el presupuesto."], ["Implementar", "Partners, regiones y mercados ejecutan, reutilizando primero."], ["Revisar y renovar", "Las revisiones semestral y anual deciden qué mantener o cerrar."]]], ["callout", "Cada función recorre este ciclo cada año, y cada revisión alimenta el Learning Plan del año siguiente."], ["note", "Fuente: modelo empresarial de Learning Plan."]]}, {"id": "ch1-roles", "k": "Roles", "h": "Quién hace qué", "blocks": [["table", ["Rol o foro", "Responsabilidad", "Decisiones y entregables clave", "RACI"], [["L&D corporativo", "Dirección, política, estándares, taxonomía de habilidades, plataformas corporativas, estrategia de proveedores, calidad e impacto", "Marcos de referencia, guías, cuadros de mando, contratos corporativos", "A"], ["Consejo de aprendizaje (un representante por función)", "Alinea las estrategias de capacidades de las funciones y evita reinventar entre funciones, regiones y mercados", "Prioridades comunes, reutilización, escalado, resolución de solapamientos", "C"], ["Capability Building Lead (por función)", "Es dueño del Learning Plan de la función", "Segmentos, habilidades, portafolio, propuestas de construir o comprar, aprobación con negocio y RR. HH.", "R/A"], ["Business Lead", "Patrocina la necesidad de capacidades del área", "Problema de negocio, prioridad, inversión, revisión del impacto", "C/A"], ["HRBP", "Conecta el plan con la estrategia de personas y de plantilla", "Implicaciones para la plantilla, validación", "C"], ["Servicios compartidos", "Operaciones escalables y datos", "Publicación, asignaciones, canales, analítica, traducciones", "R"], ["Regiones y mercados", "Activación y localización", "Adopción, adaptación legal y lingüística, comunidades locales", "R"]]], ["callout", "En resumen: el Business Lead fija el porqué, el Capability Building Lead diseña el cómo y L&D corporativo mantiene la coherencia de todo el sistema.", true]]}], "sum": [["Cinco fases", "Contratar, descubrir, acordar, implementar, revisar."], ["La bisagra", "El plan firmado une estrategia y ejecución."], ["Roles claros", "El porqué, el cómo y la coherencia tienen dueño."]], "rem": "Sin firma, no hay plan."}, {"id": "ch2", "h": "Fase 1: Contratar", "hook": "¿Qué problema de negocio resolvemos, quién decide y cómo trabajaremos juntos?", "secs": [{"id": "ch2-what", "k": "La fase", "h": "Acordar el problema y los roles", "blocks": [["cards", 2, [["Quién", "El Capability Building Lead y el Business Lead, con el HRBP cuando aporte.", []], ["Resultado", "Un propósito, roles y expectativas acordados, y un calendario para el ciclo.", []]]], ["note", "Fuente: modelo empresarial de Learning Plan, con el flujo de sesiones del toolkit de Mölnlycke."]]}, {"id": "ch2-run", "k": "Cómo hacerlo", "h": "Con un equipo de dirección", "blocks": [["steps", [["Arranque (1 hora)", "Construir un lenguaje común y alineamiento estratégico."], ["Reflexión individual (1–2 semanas, opcional)", "Cada líder piensa en la estrategia, la cadena de valor y las capacidades."], ["Calibración (2 horas)", "Comparar visiones, acordar prioridades y confirmar roles y calendario."]]], ["callout", "Empieza por el problema de negocio, no por la solución de aprendizaje."]]}], "sum": [["Primero el problema", "Acuerda el problema de negocio antes de cualquier solución."], ["Roles", "Business Lead, Capability Building Lead y HRBP."], ["Ritmo", "Arranque, reflexión, calibración."]], "rem": "Contrata el porqué antes de diseñar el cómo."}, {"id": "ch3", "h": "Fase 2: Descubrir", "hook": "¿Qué trabajos, segmentos, habilidades y mentalidades requiere la estrategia?", "secs": [{"id": "ch3-what", "k": "La fase", "h": "De la estrategia a segmentos y habilidades", "blocks": [["cards", 3, [["Quién", "El Capability Building Lead, expertos en la materia y People Analytics.", []], ["Entradas", "La planificación estratégica de plantilla, los datos de organización y puestos, y la taxonomía estándar de habilidades.", []], ["Resultado", "Los segmentos objetivo, las brechas de capacidades y el dominio actual.", []]]], ["note", "Fuente: modelo empresarial de Learning Plan, con el modelo ABC y el glosario del toolkit de Mölnlycke."]]}, {"id": "ch3-abc", "k": "El modelo ABC", "h": "De la estrategia a las capacidades", "blocks": [["tiles", [["A", "Estrategia funcional", "¿Cuál es nuestro papel en la estrategia de la compañía y qué resultados debemos hacer posibles en los próximos 2–3 años?"], ["B", "Cadena de valor", "¿Qué actividades clave aportan más valor y qué estaría en riesgo sin nosotros?"], ["C", "Capacidades", "¿Qué capacidades impulsan la estrategia, cuáles son fuertes hoy y cuáles hay que reforzar?"], ["→", "Después", "Convierte las respuestas en segmentos, brechas y niveles de dominio objetivo."]]]]}, {"id": "ch3-terms", "k": "Un vocabulario común", "h": "Habla un solo idioma", "blocks": [["table", ["Término", "Significado", "Mejor uso"], [["Capacidad", "Una combinación estratégica de habilidades, conocimientos, comportamientos y procesos que produce un resultado de negocio", "Estrategia y planificación"], ["Habilidad", "Una aptitud concreta que se puede aprender y demostrar, y que se transfiere entre roles", "Aprendizaje y desarrollo"], ["Conocimiento", "Comprensión de una materia, un proceso o una tecnología", "Aprendizaje y desarrollo"], ["Motivadores y rasgos", "Motivaciones y características naturales", "Selección y autoconocimiento"], ["Dominio", "El nivel de maestría al aplicar una habilidad, de principiante a experto", "Evaluación e itin
