erarios"]]]]}], "sum": [["Entradas", "Planes de plantilla, datos de puestos y una taxonomía."], ["ABC", "Estrategia, cadena de valor, capacidades."], ["Lenguaje", "Capacidad, habilidad, conocimiento, rasgos, dominio."]], "rem": "Parte de la estrategia, no del catálogo."}, {"id": "ch4", "h": "Fase 3: Analizar y acordar", "hook": "¿Qué simplificamos, priorizamos y financiamos?", "secs": [{"id": "ch4-what", "k": "La fase", "h": "La bisagra de todo el ciclo", "blocks": [["cards", 2, [["Quién", "El Capability Building Lead propone; el Business Lead y el HRBP validan la prioridad, la necesidad y la inversión.", []], ["Resultado", "Una lista de segmentos, habilidades, soluciones y presupuesto, y un Learning Plan firmado.", []]]], ["callout", "Esta firma es la bisagra de todo el ciclo: a partir de aquí, el plan tiene dueño, presupuesto y un resultado esperado.", true], ["note", "Fuente: modelo empresarial de Learning Plan, con la plantilla de priorización del toolkit de Mölnlycke."]]}, {"id": "ch4-q", "k": "Elegir bien", "h": "Preguntas que afinan la elección", "blocks": [["bank", [["Priorizar", "Apunta a tres o cuatro capacidades.", ["¿Qué capacidades nos diferencian de la competencia?", "¿Dónde están las mayores brechas y dónde dependemos de unos pocos expertos?", "Si solo pudiéramos construir una capacidad este año, ¿cuál tendría más impacto?", "¿Dónde es más eficiente construir, comprar o tomar prestado?"], "Puntúa la criticidad de 1 (baja) a 5 (alta) y la preparación en verde, ámbar o rojo."]]]]}, {"id": "ch4-plan", "k": "Plantilla", "h": "El plan firmado en una página", "blocks": [["table", ["Objetivo estratégico", "Capacidad", "Resultado y KPI", "Criticidad", "Preparación", "Acciones de capacitación", "Audiencia", "Responsable y fecha"], [["Excelencia operativa", "Gestión de proyectos", "Proyectos a tiempo y dentro de presupuesto. KPI: % a tiempo, % dentro de presupuesto", "4", "Ámbar", "Formación avanzada en gestión de proyectos, mentoring interno para jefes de proyecto", "Jefes de proyecto, responsables de equipo", "Miembro del comité de dirección, T4"]]], ["builder", "plan", [["Objetivo estratégico", "p. ej. Excelencia operativa"], ["Capacidad", "p. ej. Gestión de proyectos"], ["Resultado y KPI", "p. ej. Proyectos a tiempo y en presupuesto; % a tiempo"], ["Criticidad (1–5)", "p. ej. 4"], ["Preparación (verde, ámbar, rojo)", "p. ej. Ámbar"], ["Acciones de capacitación", "p. ej. Formación y mentoring interno"], ["Audiencia", "p. ej. Jefes de proyecto y responsables de equipo"], ["Responsable y fecha", "p. ej. Miembro del comité de dirección, T4"]]]]}], "sum": [["Firma", "El plan obtiene dueño, presupuesto y resultado."], ["Tres o cuatro", "Prioriza las capacidades que más importan."], ["Una página", "Objetivo, capacidad, KPI, preparación, acciones, responsable."]], "rem": "La firma convierte una lista de deseos en un plan."}, {"id": "ch5", "h": "Fase 4: Implementar", "hook": "¿Qué reutilizamos, curamos, compramos, construimos y desplegamos?", "secs": [{"id": "ch5-what", "k": "La fase", "h": "Ejecutar, reutilizando primero", "blocks": [["cards", 2, [["Quién", "Proveedores y expertos diseñan; los servicios compartidos publican e integran; regiones y mercados activan.", []], ["Un brief antes de diseñar", "Toda solución nueva parte de un brief breve acordado con el negocio.", []]]], ["steps", [["Reutilizar", "Primero el contenido interno."], ["Curar", "De las bibliotecas corporativas."], ["Comprar", "A proveedores especializados."], ["Construir", "Solo como último recurso."]]], ["note", "Fuente: modelo empresarial de Learning Plan, con el diseño de iniciativas 70/20/10 del toolkit de Mölnlycke."]]}, {"id": "ch5-design", "k": "De la capacidad a la iniciativa", "h": "Convertir una capacidad en una iniciativa de aprendizaje", "blocks": [["steps", [["Empieza por el KPI", "Un resultado que debe mejorar."], ["Elige una capacidad", "La que lo impulsa, con sus 3–5 habilidades clave mapeadas."], ["Fija las medidas", "A 30, 60 y 90 días."], ["Diseña un itinerario 70/20/10", "En el flujo de trabajo: 70% tareas reales y retos, 20% coaching y práctica entre pares, 10% recursos específicos."]]], ["callout", "El modelo 70/20/10 procede de la investigación de Lombardo y Eichinger en el Center for Creative Leadership. Úsalo como guía de diseño, no como fórmula."]]}], "sum": [["Orden de elección", "Reutilizar, curar, comprar, construir."], ["Primero el brief", "Acuerda un brief breve con el negocio."], ["70/20/10", "La mayor parte del aprendizaje ocurre en el trabajo."]], "rem": "Construye solo cuando nada más sirva."}, {"id": "ch6", "h": "Fase 5: Revisar y renovar", "hook": "¿Qué uso, impacto y aprendizajes justifican continuar, cambiar o cerrar cada iniciativa?", "secs": [{"id": "ch6-what", "k": "La fase", "h": "Mantener, cambiar o cerrar", "blocks": [["cards", 2, [["Ritmo", "Una revisión semestral y otra anual con el Business Lead, que alimentan el plan del año siguiente.", []], ["Resultado", "Decisiones para el siguiente ciclo, incluida la retirada de contenido duplicado o sin uso.", []]]], ["note", "Fuente: modelo empresarial de Learning Plan, con el marco de impacto en cuatro niveles del toolkit de Mölnlycke."]]}, {"id": "ch6-levels", "k": "Medir el impacto", "h": "Cuatro niveles de evidencia", "blocks": [["table", ["Nivel", "Pregunta", "Cómo medirlo"], [["1. Reacción", "¿Les pareció relevante y práctico?", "Una encuesta de 2 minutos, más «Una cosa que aplicaré enseguida»"], ["2. Aprendizaje", "¿Saben explicar o demostrar la habilidad?", "Autoevaluación antes y después, o un cuestionario"], ["3. Comportamiento", "¿Qué comportamientos nuevos se ven en el trabajo?", "Seguimiento del manager o de pares a los 30 y 60 días, más datos del flujo de trabajo"], ["4. Resultados", "¿Cómo ha movido la capacidad el KPI?", "Línea de base comparada con los datos posteriores al programa"]]], ["callout", "Usa el nivel 4 solo cuando el comportamiento impulse claramente un resultado de negocio, el coste de no cambiar sea significativo y el equipo de dirección se comprometa a actuar con los datos.", true], ["note", "Los cuatro niveles siguen el modelo de evaluación de la formación de Donald Kirkpatrick."]]}, {"id": "ch6-gate", "k": "Herramienta", "h": "¿Es esta la iniciativa de aprendizaje adecuada?", "blocks": [["p", "Usa este filtro antes de que cualquier petición nueva entre en el plan. Una petición que no pasa un filtro vuelve al negocio, no al catálogo."], ["gate", [["¿Debe mejorar un KPI de negocio?", "No es una iniciativa de aprendizaje."], ["¿Lo impulsa una capacidad concreta?", "¿Problema de capacidad o de proceso? Compruébalo antes de diseñar."], ["¿Lo hacen posible 3–5 habilidades?", "Aclara primero las habilidades."], ["¿Están fijadas las medidas a 30/60/90 días?", "Fija primero la línea de base y las medidas."]], "Diseña un itinerario 70/20/10. Mide los niveles 1–3; añade el nivel 4 solo cuando la dirección se comprometa a actuar con los datos."], ["note", "Fuente: toolkit de Mölnlycke."]]}], "sum": [["Ritmo", "Las revisiones semestral y anual alimentan el siguiente plan."], ["Evidencia", "Reacción, aprendizaje, comportamiento, resultados."], ["Filtro", "Solo una necesidad ligada a un KPI, con habilidades y medidas, se convierte en iniciativa."]], "rem": "Retira lo que no se usa. Financia lo que mueve el KPI."}, {"id": "ch7", "h": "Lo que yo añadiría", "hook": "Que la inversión detrás de cada plan esté gobernada, sea visible y se pueda medir.", "secs": [{"id": "ch7-add", "k": "Mis propuestas", "h": "Cinco añadidos", "blocks": [["p", "El modelo es sólido en estrategia y propiedad. Estos añadidos hacen que la inversión detrás de cada plan esté gobernada, sea visible y se pueda medir."], ["steps", [["Una capa de partners y gasto", "Vincular cada acción de capacitación con proveedor a un nivel de partner (estratégico, preferente o táctico), con un cuadro de rendimiento para los estratégicos. Así el gasto se ve por capacidad, no solo por proveedor."], ["Un foro operativo bajo el consejo", "Un grupo de trabajo regular de funciones, servicios compartidos y L&D corporativo para resolver propiedad, metadatos, ciclo de vida del contenido y escalado, de modo que las decisiones del consejo se lleven a la práctica."], ["Triaje asistido por IA", "Un agente filtro aplica el árbol de decisión y los criterios del plan a las peticiones nuevas. Las sencillas avanzan rápido; solo las estratégicas llegan al consejo."], ["Una única línea de visión", "Un solo cuadro de mando que lee capacidad, luego KPI, luego gasto y luego impacto, para que cada Business Lead vea el retorno de su plan."], ["Hacerlo visible", "Publicar el modelo de capacidades de cada función en un espacio central, abierto a toda la plantilla, para apoyar la movilidad interna."]]], ["note", "Fuente: mis propuestas."]]}, {"id": "ch7-next", "k": "Ir más allá", "h": "Comprueba dónde estás", "blocks": [["link", "Evalúa tu madurez en LearnOps y gobierno", "../maturity/?lang={lang}#learnops"], ["link", "Mapea tus partners de aprendizaje: Learning Partnership Landscape", "../maturity/partners/?lang={lang}"]]}], "sum": [["Gasto", "Vincula el gasto en proveedores a capacidades y niveles de partner."], ["Gobierno", "Un foro operativo y un triaje asistido por IA."], ["Visibilidad", "Una línea de visión y un espacio de capacidades abierto."]], "rem": "De la capacidad al KPI, al gasto y al impacto: una sola línea de visión."}], "ca": [{"id": "ch0", "h": "Propòsit i principis", "hook": "Les capacitats converteixen l'estratègia en acció.", "secs": [{"id": "ch0-why", "k": "Comença aquí", "h": "Cada inversió en persones, traçable fins a un resultat de negoci", "blocks": [["p", "Un pla de capacitats és un pla de canvi amb impacte mesurable, no una llista de cursos. Aquest playbook segueix un model empresarial de Learning Plan (al voltant del 70%), hi afegeix eines del meu Capabilities Building Toolkit creat a Mölnlycke (al voltant del 20%) i inclou algunes propostes pròpies (al voltant del 10%). Cada capítol indica d'on ve el seu contingut."], ["callout", "Cada inversió en persones s'hauria de poder traçar fins a un resultat de negoci.", true]]}, {"id": "ch0-principles", "k": "Sis principis", "h": "El que sosté el pla", "blocks": [["steps", [["El negoci és amo del perquè", "El Business Lead defineix el problema, el Capability Building Lead dissenya el com i l'HRBP ho connecta amb l'estratègia de persones."], ["Federat, no central", "L&D corporatiu fixa estàndards, taxonomia i plataformes. Les funcions són amos dels seus plans. Regions i mercats activen i localitzen."], ["Un sol llenguatge d'habilitats", "Una taxonomia estàndard, no personalitzada per funció ni per mercat."], ["Reutilitza i cura abans de crear", "Retira el contingut que no es fa servir."], ["Mesura el canvi, no la finalització", "Adopció, comportament i impacte en el negoci."], ["Focus", "Cada funció es concentra en les 2–3 capacitats que creen més avantatge competitiu, en lloc de repartir l'esforç."]]], ["note", "Font: model empresarial de Learning Plan, amb la lògica del toolkit de Mölnlycke."]]}], "sum": [["Propòsit", "Un pla de canvi amb impacte mesurable."], ["Propietat", "El negoci és amo del perquè; L&D dissenya el com."], ["Focus", "Dues o tres capacitats que creen més avantatge."]], "rem": "Mesura el canvi, no la finalització."}, {"id": "ch1", "h": "El cicle i qui fa què", "hook": "El pla signat és la frontissa entre l'estratègia i l'execució.", "secs": [{"id": "ch1-cycle", "k": "El cicle d'un cop d'ull", "h": "Cinc fases, cada any", "blocks": [["steps", [["Contractar", "El negoci i el Capability Building Lead acorden el problema i els rols."], ["Descobrir", "El Capability Building Lead i els experts defineixen segments i habilitats."], ["Analitzar i acordar", "El negoci signa el pla i el pressupost."], ["Implementar", "Partners, regions i mercats executen, reutilitzant primer."], ["Revisar i renovar", "Les revisions semestral i anual decideixen què mantenir o tancar."]]], ["callout", "Cada  "Font: model empresarial de Learning Plan, amb la plantilla de priorització del toolkit de Mölnlycke."]]}, {"id": "ch4-q", "k": "Triar bé", "h": "Preguntes que afinen l'elecció", "blocks": [["bank", [["Prioritzar", "Apunta a tres o quatre capacitats.", ["Quines capacitats ens diferencien de la competència?", "On són les bretxes més grans i on depenem d'uns pocs experts?", "Si només poguéssim construir una capacitat aquest any, quina tindria més impacte?", "On és més eficient construir, comprar o manllevar?"], "Puntua la criticitat de 1 (baixa) a 5 (alta) i la preparació en verd, ambre o vermell."]]]]}, {"id": "ch4-plan", "k": "Plantilla", "h": "El pla signat en una pàgina", "blocks": [["table", ["Objectiu estratègic", "Capacitat", "Resultat i KPI", "Criticitat", "Preparació", "Accions de capacitació", "Audiència", "Responsable i data"], [["Excel·lència operativa", "Gestió de projectes", "Projectes a temps i dins del pressupost. KPI: % a temps, % dins del pressupost", "4", "Ambre", "Formació avançada en gestió de projectes, mentoring intern per a caps de projecte", "Caps de projecte, responsables d'equip", "Membre del comitè de direcció, T4"]]], ["builder", "plan", [["Objectiu estratègic", "p. ex. Excel·lència operativa"], ["Capacitat", "p. ex. Gestió de projectes"], ["Resultat i KPI", "p. ex. Projectes a temps i en pressupost; % a temps"], ["Criticitat (1–5)", "p. ex. 4"], ["Preparació (verd, ambre, vermell)", "p. ex. Ambre"], ["Accions de capacitació", "p. ex. Formació i mentoring intern"], ["Audiència", "p. ex. Caps de projecte i responsables d'equip"], ["Responsable i data", "p. ex. Membre del comitè de direcció, T4"]]]]}], "sum": [["Signatura", "El pla obté amo, pressupost i resultat."], ["Tres o quatre", "Prioritza les capacitats que més importen."], ["Una pàgina", "Objectiu, capacitat, KPI, preparació, accions, responsable."]], "rem": "La signatura converteix una llista de desitjos en un pla."}, {"id": "ch5", "h": "Fase 4: Implementar", "hook": "Què reutilitzem, curem, comprem, construïm i despleguem?", "secs": [{"id": "ch5-what", "k": "La fase", "h": "Executar, reutilitzant primer", "blocks": [["cards", 2, [["Qui", "Proveïdors i experts dissenyen; els serveis compartits publiquen i integren; regions i mercats activen.", []], ["Un brief abans de dissenyar", "Tota solució nova parteix d'un brief breu acordat amb el negoci.", []]]], ["steps", [["Reutilitzar", "Primer el contingut intern."], ["Curar", "De les biblioteques corporatives."], ["Comprar", "A proveïdors especialitzats."], ["Construir", "Només com a últim recurs."]]], ["note", "Font: model empresarial de Learning Plan, amb el disseny d'iniciatives 70/20/10 del toolkit de Mölnlycke."]]}, {"id": "ch5-design", "k": "De la capacitat a la iniciativa", "h": "Convertir una capacitat en una iniciativa d'aprenentatge", "blocks": [["steps", [["Comença pel KPI", "Un resultat que ha de millorar."], ["Tria una capacitat", "La que l'impulsa, amb les seves 3–5 habilitats clau mapejades."], ["Fixa les mesures", "A 30, 60 i 90 dies."], ["Dissenya un itinerari 70/20/10", "En el flux de treball: 70% tasques reals i reptes, 20% coaching i pràctica entre iguals, 10% recursos específics."]]], ["callout", "El model 70/20/10 prové de la recerca de Lombardo i Eichinger al Center for Creative Leadership. Fes-lo servir com a guia de disseny, no com a fórmula."]]}], "sum": [["Ordre d'elecció", "Reutilitzar, curar, comprar, construir."], ["Primer el brief", "Acorda un brief breu amb el negoci."], ["70/20/10", "La major part de l'aprenentatge passa a la feina."]], "rem": "Construeix només quan res més no serveixi."}, {"id": "ch6", "h": "Fase 5: Revisar i renovar", "hook": "Quin ús, impacte i aprenentatges justifiquen continuar, canviar o tancar cada iniciativa?", "secs": [{"id": "ch6-what", "k": "La fase", "h": "Mantenir, canviar o tancar", "blocks": [["cards", 2, [["Ritme", "Una revisió semestral i una d'anual amb el Business Lead, que alimenten el pla de l'any següent.", []], ["Resultat", " /* landing network background: "second brain" graph (Obsidian-style) */
let netRun=()=>{};
(function(){
  const c=document.getElementById("net"); if(!c) return; const x=c.getContext("2d");
  let w,h,N=[],E=[],homes=[],on=false,raf=0,mx=-1e4,my=-1e4,hot=-1,glow=0,visible=false;
  const R=Math.random;
  function rgb(v){const s=getComputedStyle(document.documentElement).getPropertyValue(v).trim().replace("#","");return[0,2,4].map(i=>parseInt(s.substr(i,2),16)).join(",")}
  function link(i,j){if(i===j||N[i].nb.has(j))return; N[i].nb.add(j);N[j].nb.add(i);E.push([i,j])}
  function build(){
    N=[];E=[];homes=[];
    const n=Math.max(50,Math.min(150,Math.round(w*h/9500))), k0=Math.max(4,Math.min(9,Math.round(n/17)));
    const cols=Math.max(1,Math.round(Math.sqrt(k0*w/h))), rows=Math.max(1,Math.ceil(k0/cols)), k=cols*rows;
    for(let i=0;i<k;i++){const cx=(i%cols+.5)/cols, cy=(Math.floor(i/cols)+.5)/rows;
      homes.push({x:w*(.04+.92*cx)+(R()-.5)*w/cols*.5, y:h*(.1+.86*cy)+(R()-.5)*h/rows*.5, p:R()*6.28})}
    homes.forEach((hm,i)=>N.push({x:hm.x,y:hm.y,vx:0,vy:0,c:i,nb:new Set()}));
    const mem=homes.map((_,i)=>[i]);
    for(let i=k;i<n;i++){const cl=Math.floor(R()*k), hm=homes[cl];
      N.push({x:hm.x+(R()-.5)*80,y:hm.y+(R()-.5)*80,vx:0,vy:0,c:cl,nb:new Set()});
      const m=mem[cl]; link(i, R()<.45?cl:m[Math.floor(R()*m.length)]);
      if(R()<.22) link(i,m[Math.floor(R()*m.length)]);
      m.push(i)}
    for(let i=0;i<k;i++){const d=homes.map((o,j)=>[Math.hypot(o.x-homes[i].x,o.y-homes[i].y),j]).sort((a,b)=>a[0]-b[0]); if(d[1])link(i,d[1][1]); if(d[2]&&R()<.5)link(i,d[2][1])}
    for(let q=0;q<Math.round(k*1.6);q++){const a=k+Math.floor(R()*(n-k)),b=k+Math.floor(R()*(n-k)); if(N[a].c!==N[b].c) link(a,b)}
    N.forEach(o=>{o.d=o.nb.size; o.r=1.3+Math.sqrt(o.d)*1.15});
    for(let i=0;i<220;i++) step(0);
  }
  function step(t){
    const n=N.length;
    for(let i=0;i<n;i++){const A=N[i];
      for(let j=i+1;j<n;j++){const B=N[j]; let dx=A.x-B.x,dy=A.y-B.y,d2=dx*dx+dy*dy; if(d2>16000)continue; if(d2<1)d2=1;
        const f=Math.min(1.2,520/d2), d=Math.sqrt(d2); dx/=d;dy/=d; A.vx+=dx*f;A.vy+=dy*f;B.vx-=dx*f;B.vy-=dy*f}}
    for(const [i,j] of E){const A=N[i],B=N[j],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1, X=A.c!==B.c, L=X?d:26+5*Math.sqrt(Math.min(A.d,B.d)), f=X?0:(d-L)*.006;
      A.vx+=dx/d*f;A.vy+=dy/d*f;B.vx-=dx/d*f;B.vy-=dy/d*f}
    for(const o of N){const hm=homes[o.c], hx=hm.x+Math.sin(t*.00011+hm.p)*26, hy=hm.y+Math.cos(t*.00009+hm.p)*20;
      o.vx+=(hx-o.x)*.0022+(R()-.5)*.03; o.vy+=(hy-o.y)*.0022+(R()-.5)*.03;
      if(o.x<20)o.vx+=.05; if(o.x>w-20)o.vx-=.05; if(o.y<20)o.vy+=.05; if(o.y>h-20)o.vy-=.05;
      o.vx*=.86;o.vy*=.86;o.x+=o.vx;o.y+=o.vy}
  }
  function draw(){
    const S=rgb("--signal"),I=rgb("--ink"); x.clearRect(0,0,w,h);
    hot=-1; let best=1600; N.forEach((o,i)=>{const d=(o.x-mx)**2+(o.y-my)**2; if(d<best){best=d;hot=i}});
    glow+=((hot>=0?1:0)-glow)*.12; const H=hot>=0?N[hot]:null;
    x.lineWidth=1;
    for(const [i,j] of E){const A=N[i],B=N[j], lit=H&&(i===hot||j===hot);
      x.strokeStyle="rgba("+S+","+(lit?.75:(.24-.12*glow)).toFixed(3)+")"; x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke()}
    N.forEach((o,i)=>{const lit=H&&(i===hot||H.nb.has(i)), hub=o.d>=6;
      x.fillStyle=lit||hub?"rgba("+S+","+(lit?1:.9)+")":"rgba("+I+","+(.38-.18*glow).toFixed(3)+")";
      x.beginPath();x.arc(o.x,o.y,o.r+(i===hot?2:0),0,7);x.fill()});
  }
  function loop(t){step(t);draw(); if(on) raf=requestAnimationFrame(loop)}
  function size(){const d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);build()}
  size();
  let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{size(); if(visible&&!on) draw()},150)});
  addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return; mx=e.clientX;my=e.clientY},{passive:true});
  document.addEventListener("pointerleave",()=>{mx=my=-1e4});
  netRun=run=>{visible=run; on=run&&!reduce.matches; cancelAnimationFrame(raf); if(run){ if(on) raf=requestAnimationFrame(loop); else draw() }};
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(visible&&!on) draw()});
  new MutationObserver(()=>{if(visible&&!on) draw()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
})();





/* ---------- routing ---------- */
function route(){
  if(/^#people-first/.test(location.hash)){history.replaceState(null,"",location.pathname+location.search+location.hash.replace("#people-first","#human-first"))}
  const h=decodeURIComponent((location.hash||"#home").slice(1)), parts=h.split("/");
  const guide=!!PB[parts[0]];
  PBK=guide?parts[0]:"human-first";
  $("#view-home").hidden=guide; $("#view-guide").hidden=!guide;
  document.body.classList.toggle("is-home",!guide);
  const nm=" · "+t("pfName")+" — Fran Mondaca";
  if(!guide){renderHome(); document.title=t("titleHome")+" — Fran Mondaca"; window.scrollTo(0,0)}
  else if(!parts[1]) {renderIntro(); document.title=t("titleGuide")+" — Fran Mondaca"}
  else if(parts[1]==="cheat") {renderCheat(); document.title=t("cheatBtn")+nm}
  else if(CH().some(c=>c.id===parts[1])) {renderChapter(parts[1],parts[2]); document.title=CH().find(c=>c.id===parts[1]).h+nm}
  else renderIntro();
  netRun(true);
}

  $("#to-profile").href="../?lang="+lang+"#profile"; $("#to-assess").href="../maturity/?lang="+lang;
  tlabel(); route();
}
