<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const reduce=matchMedia("(prefers-reduced-motion: reduce)");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PF={"en": [{"id": "ch0", "h": "Why people skills drive change", "hook": "Change moves at the speed of trust, one conversation at a time.", "secs": [{"id": "ch0-why", "k": "Start here", "h": "Change runs on conversations", "blocks": [["p", "Strategies, systems and org charts change on paper in a day. People change in conversations: when they understand, when they are heard, when they get feedback and when someone they trust asks for their help. Change agility is the ability to keep making those conversations happen, well, while everything moves."], ["cards", 3, [["People support what they help create", "Involvement beats announcement. The earlier people shape a change, the less you need to sell it.", []], ["Change lands person by person", "Every manager conversation either builds momentum or quietly drains it.", []], ["Agility needs stability", "McKinsey's research on agile organisations shows they combine a stable backbone with fast, flexible ways of working. People skills are part of that backbone.", []]]], ["callout", "This playbook gives leaders seven practical skills for the human side of change. Read one chapter in ten minutes, or open the tool you need just before a conversation.", true]]}, {"id": "ch0-map", "k": "The seven skills", "h": "Seven skills for seven change moments", "blocks": [["steps", [["Communicate", "Make the change understood, and listen to how it lands."], ["Give feedback and feedforward", "Adjust course early, looking back and looking ahead."], ["Coach", "Build ownership so people find their own way through the change."], ["Diagnose performance", "Tell a capability gap from a willingness gap before you react."], ["Hold difficult conversations", "Address resistance and missed commitments with respect."], ["Influence without authority", "Win support from people who do not report to you."], ["Manage stakeholders", "Bring the right people along, at the right time, on purpose."]]]]}], "sum": [["Conversations", "Change happens in conversations, not in announcements."], ["Involvement", "People support what they help create."], ["Balance", "Agility needs a stable backbone, and people skills are part of it."]], "rem": "Change moves at the speed of trust."}, {"id": "ch1", "h": "Connection and communication", "hook": "Every conversation builds trust or spends it.", "secs": [{"id": "ch1-model", "k": "A simple model", "h": "Intent, message and relationship, with listening at the centre", "blocks": [["p", "Three questions shape every important conversation. Listening is what connects them: without it, a clear intent and a well-crafted message can still damage the relationship."], ["tiles", [["I", "Intent", "Why am I speaking? What outcome do I want, and is this the right moment?"], ["M", "Message", "What exactly do I need to say, in which words, through which channel and with what tone?"], ["R", "Relationship", "How will this conversation affect trust between us, today and next month?"], ["L", "Listening", "What is the other person hearing, feeling and not saying? Check, then adjust."]]], ["callout", "Fran Mondaca's synthesis of widely used communication principles, including active listening (Carl Rogers) and the idea that richer channels suit more complex or sensitive messages (Daft and Lengel)."]]}, {"id": "ch1-listen", "k": "The toolkit", "h": "Listening and clarifying", "blocks": [["cards", 3, [["Listen to understand", "Give full attention. Notice words, tone and what is missing.", []], ["Ask open questions", "Questions that cannot be answered with yes or no: \"How do you see it?\"", []], ["Explore", "Follow up to check what was meant, not only what was said.", []], ["Paraphrase", "Say it back in your own words: \"So what matters most to you is…\"", []], ["Summarise", "Close with agreements, owners and next steps.", []], ["Mind the tone", "The same words land differently in a hurry, in writing or under stress.", []]]]]}, {"id": "ch1-channel", "k": "Match message and medium", "h": "Choose the right channel", "blocks": [["table", ["Channel", "Best for", "Avoid when"], [["In person or video call", "Sensitive, complex or emotional topics; building trust", "The information only needs to be shared"], ["Audio call", "Quick alignment, follow-ups with people you know", "Visual material or tough news needs to be seen"], ["Email", "Detailed updates, decisions on record", "A conversation would solve it faster"], ["Chat", "Short questions and coordination", "The topic is sensitive or needs a documented decision"], ["Shared document", "Information that must stay up to date and accessible", "People need to react or ask questions now"]]], ["callout", "Ask people how they prefer to be contacted, and never handle poor performance or bad news by chat or email alone."]]}, {"id": "ch1-distance", "k": "Remote, hybrid and multicultural", "h": "Leading across distance and cultures", "blocks": [["cards", 2, [["Confirm understanding", "Without body language, check back more often: \"What will you take from this?\"", []], ["Use examples and data", "When you see less of the work, rely on specific examples and agreed metrics.", []], ["Coach close to the moment", "A short call right after a meeting or presentation beats a long review weeks later.", []], ["Adapt to cultural styles", "Directness, hierarchy and how disagreement is shown vary across cultures. Ask, observe and adjust.", []]]]]}], "sum": [["Intent", "Know why you speak and what outcome you want."], ["Message", "Choose words, channel and tone on purpose."], ["Relationship", "Every conversation builds or spends trust."], ["Listening", "It connects everything: check how it lands."]], "rem": "Listen first. Then speak with intent."}, {"id": "ch2", "h": "Feedback and feedforward", "hook": "Feedback looks back to learn. Feedforward looks ahead to improve.", "secs": [{"id": "ch2-sbi", "k": "A clear structure", "h": "SBI: Situation, Behaviour, Impact", "blocks": [["tiles", [["S", "Situation", "When and where it happened. Be specific: \"In Tuesday's client call…\""], ["B", "Behaviour", "What the person did or said, as a camera would record it, without judging intent."], ["I", "Impact", "The effect on you, the team, the customer or the result."], ["→", "Next step", "Ask how they see it, then agree what to keep or change."]]], ["two", ["Vague", "\"You need to be more proactive.\""], ["SBI", "\"In Tuesday's client call, you flagged the delivery risk before the client asked. It gave us time to adjust, and the client said it built trust. Keep doing that.\""]], ["callout", "SBI is the Situation-Behaviour-Impact model developed by the Center for Creative Leadership."]]}, {"id": "ch2-ata", "k": "Make it a dialogue", "h": "Ask, tell, ask", "blocks": [["steps", [["Ask", "\"How do you think it went?\" Start with their view; you may not need to say much."], ["Tell", "Share your observation using SBI. One or two points, not ten."], ["Ask", "\"How does that land? What will you try next time?\""]]], ["callout", "Ask permission first: \"Would you like some feedback on that?\" People listen more closely to feedback they agreed to receive.", true]]}, {"id": "ch2-ff", "k": "Looking ahead", "h": "Feedforward: ask for ideas about the future", "blocks": [["p", "Marshall Goldsmith's feedforward turns feedback around: you choose one thing you want to get better at and ask others for ideas for the future. No discussion of the past, no defending."], ["steps", [["Choose", "One behaviour you want to improve."], ["Ask", "\"If I wanted to run better meetings, what would you suggest?\""], ["Listen", "Take notes. Do not judge, defend or explain."], ["Thank", "Simply say thank you."], ["Use", "Keep what fits. Let the rest go."]]], ["cards", 3, [["To a colleague", "\"How could I make our handovers smoother?\"", []], ["To your team", "\"What could I do to support you better during this change?\"", []], ["To your manager", "\"What would make my updates more useful for you?\"", []]]]]}], "sum": [["SBI", "Situation, Behaviour, Impact: specific and fair."], ["Dialogue", "Ask, tell, ask, and ask permission first."], ["Feedforward", "Ask for ideas about the future, then say thank you."]], "rem": "Feedback fixes the past. Feedforward builds the future."}, {"id": "ch3", "h": "Coaching conversations", "hook": "Ask more than you tell, and help people find their own answers.", "secs": [{"id": "ch3-trust", "k": "Before any technique", "h": "Coaching starts with trust", "blocks": [["cards", 2, [["How you see them", "Capable, with strengths to build on, and worth your time. Not whether they can grow, but how.", []], ["How they see you", "Credible, helpful, trustworthy and committed to their success.", []]]], ["callout", "Without the relationship, coaching sounds like control. With it, a few good questions go a long way.", true]]}, {"id": "ch3-grow", "k": "A simple structure", "h": "GROW: Goal, Reality, Options, Way forward", "blocks": [["tiles", [["G", "Goal", "What do you want to achieve? What would good look like?"], ["R", "Reality", "What is happening now? What have you tried? What is in the way?"], ["O", "Options", "What could you do? What else? What would someone you admire do?"], ["W", "Way forward", "What will you do, by when? What support do you need?"]]], ["callout", "GROW was popularised by Sir John Whitmore in Coaching for Performance."]]}, {"id": "ch3-habits", "k": "Small habits, big effect", "h": "Three coaching habits", "blocks": [["cards", 3, [["Ask twice", "\"What else?\" The second answer is usually deeper than the first.", []], ["Stop at two", "Agree on one or two changes at most. Focus beats a long list.", []], ["Support and build", "When people assess themselves accurately, which is most of the time, confirm it and add one idea.", []]]]]}, {"id": "ch3-bank", "k": "Question bank", "h": "Questions for every stage", "blocks": [["bank", [["Goal", "Clarify what success looks like.", ["What would you like to get out of this conversation?", "What would a great result look like?", "How will you know you have succeeded?"], "Make the goal theirs, not yours."], ["Reality", "Understand what is really happening.", ["What is happening right now?", "What have you already tried, and what happened?", "What is getting in the way?", "On a scale of 1 to 10, where are you? What makes it that number?"], "If \"why\" sounds like blame, try \"what led you to…?\""], ["Options", "Widen the choices before choosing.", ["What could you do?", "What else could you try?", "What would you suggest to a colleague in the same situation?", "What would you do with more time, budget or authority?"], "Wait. Silence often brings the best option."], ["Way forward", "Turn insight into action.", ["What will you do first, and by when?", "What might get in the way, and how will you handle it?", "What support do you need from me?"], "Let them say the commitment in their own words."], ["When they are off track", "Help without taking over.", ["Explore: \"What made you choose that approach?\"", "Guide: \"What happened when you tried…?\"", "Share an idea: \"Would it help if I shared what worked for me?\"", "Give feedback: \"Would you like some feedback on that?\" (use SBI)", "Park it: \"That matters. Can we come back to it in a minute?\""], "Move from asking to telling only as far as you need to."]]], ["note", "Further reading: GROW model example questions (University of Warwick)."]]}], "sum": [["Trust first", "Coaching works when they see you as credible and helpful."], ["GROW", "Goal, Reality, Options, Way forward."], ["Habits", "Ask twice, stop at two, support and build."]], "rem": "Ask, listen, then ask again."}, {"id": "ch4", "h": "Analysing performance", "hook": "Can't or won't? Diagnose before you react.", "secs": [{"id": "ch4-gap", "k": "Start with the gap", "h": "Is it a can't or a won't?", "blocks": [["p", "Before acting on a performance problem, describe the gap: what is expected, what is happening, and why it matters. Then ask the classic diagnostic question from Mager and Pipe: could they do it if their life depended on it? If not, it is a capability gap. If yes, look at willingness and the conditions around them."], ["cards", 2, [["Can't: capability", "", ["Clear expectations: do they know what, how and by when?", "Tools, time and information: does the job set them up to succeed?", "Skills and knowledge: have they had the training or practice a typical person would need?"]], ["Won't: willingness", "", ["Consequences: is good performance noticed, and is poor performance addressed?", "Priorities: do they know where this sits against everything else?", "Buy-in: do they understand why it needs to be done this way?"]]]], ["callout", "Many \"won't\" problems turn out to be about the environment, not the person: unclear goals, conflicting priorities or no feedback. Thomas Gilbert's Behavior Engineering Model makes the same point: fix the conditions first."]]}, {"id": "ch4-matrix", "k": "Choose your response", "h": "The skill-will matrix", "blocks": [["matrix", {"tl": ["Excite", "Able but not willing: listen to why, link the work to what they value, recognise effort, be clear on consequences."], "tr": ["Delegate", "Able and willing: give responsibility and freedom, recognise results, coach for growth."], "bl": ["Direct", "Neither able nor willing yet: clear tasks, small wins, close support at first, then step back. A difficult conversation may be needed."], "br": ["Guide", "Willing but not yet able: train, pair with a mentor, build confidence through early successes."]}, "Skill", "Will"], ["note", "The skill-will matrix is adapted from Max Landsberg's The Tao of Coaching."]]}, {"id": "ch4-cycle", "k": "Keep it moving", "h": "Align, check in, adjust", "blocks": [["steps", [["Align", "Agree goals that connect to team and company priorities, and write them down."], ["Check in", "Short, regular conversations on progress, obstacles and support."], ["Adjust", "Change goals, actions or support as things change."]]]]}], "sum": [["The gap", "Describe expected versus actual, and why it matters."], ["Can't or won't", "Capability or willingness? Check the conditions first."], ["Skill-will", "Direct, guide, excite or delegate."]], "rem": "Diagnose first. Then choose your response."}, {"id": "ch5", "h": "Difficult conversations", "hook": "When stakes are high, preparation is respect.", "secs": [{"id": "ch5-why", "k": "What makes them hard", "h": "High stakes, different views, strong emotions", "blocks": [["p", "The authors of Crucial Conversations describe these moments as conversations where stakes are high, opinions differ and emotions run strong. Douglas Stone, Bruce Patton and Sheila Heen add that every difficult conversation is really three: what happened, how we feel about it, and what it says about who we are."], ["callout", "Ask yourself: what is the cost of not having this conversation?", true]]}, {"id": "ch5-prep", "k": "Before you talk", "h": "Prepare: the readiness checklist", "blocks": [["checklist", [["Is there a real gap?", "Confirm the problem first", [["I have clearly defined the performance or behaviour I expect.", false], ["The gap is minor and would sort itself out without a conversation.", true]]], ["Can they? (capability)", "Check the conditions", [["They know what to do, how and by when.", false], ["They have the tools, time and information they need.", false], ["They have the skills and knowledge to do it.", false]]], ["Will they? (willingness)", "Check motivation and priorities", [["Good performance is recognised and poor performance has consequences.", false], ["They understand why it needs to be done this way.", false], ["They know this is a priority compared with their other work.", false]]]]]]}, {"id": "ch5-talk", "k": "During", "h": "Talk: five steps", "blocks": [["steps", [["Name the purpose", "Be clear from the start: \"I want to talk about the missed deadlines on the project.\""], ["Describe the gap and its impact", "Use SBI. Explain the impact that matters most to them: team, customers or their own goals."], ["Listen to their view", "Ask what is going on for them. You may learn something that changes the picture."], ["Agree a way forward", "Specific steps, a timeframe, what happens if it does not change, and a follow-up date. Build on their ideas; redirect if they shift blame; be directive if needed."], ["Summarise and support", "Recap the agreement and the support you will give."]]]]}, {"id": "ch5-follow", "k": "After", "h": "Follow up", "blocks": [["cards", 3, [["Write it down", "Note what was agreed, and share it if appropriate.", []], ["Check in on the date", "Keep the follow-up you promised, even if things are going well.", []], ["Recognise progress", "Notice improvement early. It makes it stick.", []]]]]}], "sum": [["Know the signs", "High stakes, different views, strong emotions."], ["Prepare", "Use the checklist: real gap, can't or won't."], ["Talk and follow up", "Purpose, gap, listen, agree, summarise, then follow up."]], "rem": "Prepare, talk, follow up."}, {"id": "ch6", "h": "Influence without authority", "hook": "Influence is an exchange built on trust.", "secs": [{"id": "ch6-model", "k": "Six steps, one cycle", "h": "The Cohen-Bradford model", "blocks": [["cycle", ["Assume everyone is a potential ally", "Clarify your goals and priorities", "Understand the other person's world", "Identify what they value, and what you can offer", "Look after the relationship", "Influence through give and take"]], ["note", "Model: Allan R. Cohen and David L. Bradford, Influence without Authority. After step 6, the cycle starts again."]]}, {"id": "ch6-currencies", "k": "What people value", "h": "The currencies of influence", "blocks": [["p", "Cohen and Bradford call the things people value \"currencies\". You can influence when you can offer something the other person values. Most people value more than one, and most of us underestimate what we can offer."], ["tabs", [["Inspiration", [["Vision", "Being part of something bigger"], ["Excellence", "Doing important work really well"], ["Ethics", "Doing what is right"]]], ["Task", [["Resources", "Budget, people, time"], ["Help", "Support with a project or a problem"], ["Information", "Access to knowledge or insight"], ["Speed", "Getting something faster"]]], ["Position", [["Recognition", "Acknowledgement of effort or results"], ["Visibility", "Being seen by senior people"], ["Network", "New and useful contacts"]]], ["Relationship", [["Understanding", "Being listened to"], ["Inclusion", "Feeling part of the group"], ["Support", "Personal backing"]]], ["Personal", [["Gratitude", "Sincere thanks"], ["Ownership", "Influence over important work"], ["Ease", "Fewer hassles"]]]]], ["callout", "Build relationships before you need them. Trust is the credit you draw on when you ask for help.", true]]}], "sum": [["Allies", "Assume everyone is a potential ally."], ["Their world", "Understand the pressures and measures that shape them."], ["Currencies", "Offer what they value; expect give and take."]], "rem": "Give first. Influence follows trust."}, {"id": "ch7", "h": "Stakeholder management", "hook": "Good changes succeed because of people. Bring them along on purpose.", "secs": [{"id": "ch7-steps", "k": "The big picture", "h": "Five habits", "blocks": [["steps", [["Identify", "Everyone who affects, or is affected by, the change."], ["Analyse", "What each person cares about and how much influence they have."], ["Map", "Place them on the grid to decide where your effort goes."], ["Engage", "Choose how involved each person needs to be."], ["Communicate", "Plan message, channel and timing, then review and adapt."]]]]}, {"id": "ch7-grid", "k": "Where to spend your time", "h": "The influence and interest grid", "blocks": [["matrix", {"tl": ["Keep satisfied", "High influence, lower interest: targeted updates on what they care about, no surprises."], "tr": ["Manage closely", "High influence, high interest: involve early, meet often, show what is in it for them."], "bl": ["Monitor", "Lower influence, lower interest: general updates; watch for changes."], "br": ["Keep informed", "Lower influence, high interest: regular updates and a listening ear; they can become ambassadors."]}, "Influence", "Interest"], ["note", "Adapted from Aubrey Mendelow's power-interest grid."]]}, {"id": "ch7-try", "k": "Hands-on", "h": "Try it: map your stakeholders", "blocks": [["smap"]]}, {"id": "ch7-ladder", "k": "From today to tomorrow", "h": "Where are they, and where do you need them?", "blocks": [["ladder", [["Unaware", "Does not know about the change yet.", "Hear about it from someone they trust."], ["Resistant", "Knows, and is against it.", "A real conversation about their concern."], ["Neutral", "Knows, no strong view.", "A reason to care that is theirs, not yours."], ["Supportive", "Wants it to work.", "Something concrete to do."], ["Leading", "Actively drives it.", "Recognition, and protection of their energy."]]], ["note", "Based on the stakeholder engagement levels used in project management (PMI)."]]}, {"id": "ch7-plan", "k": "Bring it together", "h": "Your communication plan on a page", "blocks": [["table", ["Group", "Box", "Key message", "Channel", "Timing", "Owner"], [["Executive sponsor", "Manage closely", "Progress, risks, decisions needed", "1:1 call", "Before milestones", "Change lead"], ["People leaders", "Keep informed", "What changes for their teams and how to brief them", "Briefing + FAQ", "Before each step", "HR or comms"], ["Partner team", "Keep satisfied", "Timing and effect on their work", "Short email, call if needed", "At milestones", "Change lead"], ["All employees", "Monitor", "What is changing and where to get help", "Chat post or newsletter", "Key moments", "Comms"]]], ["callout", "Communicate with purpose, not just more: every message should lead to a decision, an action, a question or a heads-up."]]}], "sum": [["Map", "Influence and interest show where to focus."], ["Engage", "Compare where people are with where you need them."], ["Plan", "Message, channel, timing and owner for each group."]], "rem": "Bring people along on purpose."}], "es": [{"id": "ch0", "h": "Por qué las habilidades con personas mueven el cambio", "hook": "El cambio avanza a la velocidad de la confianza, conversación a conversación.", "secs": [{"id": "ch0-why", "k": "Empieza aquí", "h": "El cambio se hace en conversaciones", "blocks": [["p", "Las estrategias, los sistemas y los organigramas cambian en el papel en un día. Las personas cambian en conversaciones: cuando entienden, cuando se sienten escuchadas, cuando reciben feedback y cuando alguien en quien confían les pide ayuda. La agilidad ante el cambio es la capacidad de seguir teniendo esas conversaciones, y bien, mientras todo se mueve."], ["cards", 3, [["Las personas apoyan lo que ayudan a crear", "Implicar funciona mejor que anunciar. Cuanto antes participan las personas en un cambio, menos hay que venderlo.", []], ["El cambio llega persona a persona", "Cada conversación de un manager suma impulso o lo va restando sin hacer ruido.", []], ["La agilidad necesita estabilidad", "La investigación de McKinsey sobre organizaciones ágiles muestra que combinan una base estable con formas de trabajar rápidas y flexibles. Las habilidades con personas forman parte de esa base.", []]]], ["callout", "Este playbook ofrece a los líderes siete habilidades prácticas para el lado humano del cambio. Lee un capítulo en diez minutos o abre la herramienta que necesitas justo antes de una conversación.", true]]}, {"id": "ch0-map", "k": "Las siete habilidades", "h": "Siete habilidades para siete momentos del cambio", "blocks": [["steps", [["Comunicar", "Hacer que el cambio se entienda y escuchar cómo se recibe."], ["Dar feedback y feedforward", "Corregir el rumbo pronto, mirando atrás y mirando adelante."], ["Hacer coaching", "Crear sentido de propiedad para que cada persona encuentre su camino en el cambio."], ["Diagnosticar el desempeño", "Distinguir una brecha de capacidad de una de voluntad antes de reaccionar."], ["Tener conversaciones difíciles", "Abordar la resistencia y los compromisos incumplidos con respeto."], ["Influir sin autoridad", "Conseguir apoyo de personas que no dependen de ti."], ["Gestionar stakeholders", "Sumar a las personas adecuadas, en el momento adecuado y a propósito."]]]]}], "sum": [["Conversaciones", "El cambio ocurre en conversaciones, no en anuncios."], ["Implicación", "Las personas apoyan lo que ayudan a crear."], ["Equilibrio", "La agilidad necesita una base estable, y las habilidades con personas forman parte de ella."]], "rem": "El cambio avanza a la velocidad de la confianza."}, {"id": "ch1", "h": "Conexión y comunicación", "hook": "Cada conversación construye confianza o la gasta.", "secs": [{"id": "ch1-model", "k": "Un modelo sencillo", "h": "Intención, mensaje y relación, con la escucha en el centro", "blocks": [["p", "Tres preguntas dan forma a toda conversación importante. La escucha es lo que las conecta: sin ella, una intención clara y un mensaje bien construido pueden dañar igualmente la relación."], ["tiles", [["I", "Intención", "¿Por qué hablo? ¿Qué resultado quiero y es este el momento adecuado?"], ["M", "Mensaje", "¿Qué necesito decir exactamente, con qué palabras, por qué canal y con qué tono?"], ["R", "Relación", "¿Cómo afectará esta conversación a la confianza entre nosotros, hoy y el mes que viene?"], ["E", "Escucha", "¿Qué está oyendo, sintiendo y callando la otra persona? Comprueba y ajusta."]]], ["callout", "Síntesis de Fran Mondaca a partir de principios de comunicación ampliamente usados, como la escucha activa (Carl Rogers) y la idea de que los canales más ricos encajan mejor con mensajes complejos o sensibles (Daft y Lengel)."]]}, {"id": "ch1-listen", "k": "La caja de herramientas", "h": "Escuchar y aclarar", "blocks": [["cards", 3, [["Escuchar para entender", "Presta toda tu atención. Fíjate en las palabras, el tono y lo que falta.", []], ["Preguntas abiertas", "Preguntas que no se responden con sí o no: «¿Cómo lo ves?»", []], ["Explorar", "Profundiza para comprobar qué se quería decir, no solo qué se dijo.", []], ["Parafrasear", "Devuélvelo con tus palabras: «Entonces, lo que más te importa es…»", []], ["Resumir", "Cierra con acuerdos, responsables y siguientes pasos.", []], ["Cuidar el tono", "Las mismas palabras suenan distinto con prisa, por escrito o bajo presión.", []]]]]}, {"id": "ch1-channel", "k": "Mensaje y medio", "h": "Elige el canal adecuado", "blocks": [["table", ["Canal", "Ideal para", "Evítalo cuando"], [["En persona o videollamada", "Temas sensibles, complejos o emocionales; construir confianza", "Solo hay que compartir información"], ["Llamada", "Alinearse rápido, seguimientos con personas que conoces", "Hay que ver material visual o dar una mala noticia"], ["Email", "Actualizaciones detalladas, decisiones que deben quedar registradas", "Una conversación lo resolvería antes"], ["Chat", "Preguntas breves y coordinación", "El tema es sensible o necesita una decisión documentada"], ["Documento compartido", "Información que debe estar actualizada y accesible", "Las personas necesitan reaccionar o preguntar ya"]]], ["callout", "Pregunta a cada persona cómo prefiere que la contacten, y nunca gestiones un bajo desempeño o una mala noticia solo por chat o email."]]}, {"id": "ch1-distance", "k": "En remoto, híbrido y multicultural", "h": "Liderar a distancia y entre culturas", "blocks": [["cards", 2, [["Confirma que se ha entendido", "Sin lenguaje corporal, comprueba más a menudo: «¿Qué te llevas de esto?»", []], ["Usa ejemplos y datos", "Cuando ves menos el trabajo, apóyate en ejemplos concretos y métricas acordadas.", []], ["Haz coaching cerca del momento", "Una llamada breve justo después de una reunión vale más que una revisión larga semanas después.", []], ["Adáptate a los estilos culturales", "La franqueza, la jerarquía y la forma de discrepar varían entre culturas. Pregunta, observa y ajusta.", []]]]]}], "sum": [["Intención", "Sabe por qué hablas y qué resultado buscas."], ["Mensaje", "Elige palabras, canal y tono a propósito."], ["Relación", "Cada conversación construye o gasta confianza."], ["Escucha", "Lo conecta todo: comprueba cómo se recibe."]], "rem": "Primero escucha. Después habla con intención."}, {"id": "ch2", "h": "Feedback y feedforward", "hook": "El feedback mira atrás para aprender. El feedforward mira adelante para mejorar.", "secs": [{"id": "ch2-sbi", "k": "Una estructura clara", "h": "SBI: Situación, Comportamiento, Impacto", "blocks": [["tiles", [["S", "Situación", "Cuándo y dónde ocurrió. Sé concreto: «En la llamada con el cliente del martes…»"], ["B", "Comportamiento", "Qué hizo o dijo la persona, como lo grabaría una cámara, sin juzgar la intención."], ["I", "Impacto", "El efecto en ti, en el equipo, en el cliente o en el resultado."], ["→", "Siguiente paso", "Pregunta cómo lo ve y acordad qué mantener o cambiar."]]], ["two", ["Vago", "«Tienes que ser más proactivo.»"], ["SBI", "«En la llamada con el cliente del martes, avisaste del riesgo de entrega antes de que el cliente preguntara. Nos dio tiempo para ajustar, y el cliente dijo que le generó confianza. Sigue haciéndolo.»"]], ["callout", "SBI es el modelo Situation-Behaviour-Impact desarrollado por el Center for Creative Leadership."]]}, {"id": "ch2-ata", "k": "Que sea un diálogo", "h": "Preguntar, decir, preguntar", "blocks": [["steps", [["Preguntar", "«¿Cómo crees que ha ido?» Empieza por su visión; quizá no necesites decir mucho."], ["Decir", "Comparte tu observación con SBI. Uno o dos puntos, no diez."], ["Preguntar", "«¿Cómo lo ves? ¿Qué vas a probar la próxima vez?»"]]], ["callout", "Pide permiso primero: «¿Te gustaría recibir feedback sobre eso?» Las personas escuchan con más atención el feedback que han aceptado recibir.", true]]}, {"id": "ch2-ff", "k": "Mirando adelante", "h": "Feedforward: pedir ideas sobre el futuro", "blocks": [["p", "El feedforward de Marshall Goldsmith le da la vuelta al feedback: eliges algo en lo que quieres mejorar y pides ideas para el futuro. Sin hablar del pasado y sin defenderte."], ["steps", [["Elige", "Un comportamiento que quieras mejorar."], ["Pide", "«Si quisiera llevar mejores reuniones, ¿qué me sugerirías?»"], ["Escucha", "Toma notas. No juzgues, no te defiendas, no expliques."], ["Agradece", "Simplemente da las gracias."], ["Usa", "Quédate con lo que encaje. Deja el resto."]]], ["cards", 3, [["A un compañero", "«¿Cómo podría hacer más fluidos nuestros traspasos?»", []], ["A tu equipo", "«¿Qué podría hacer para apoyaros mejor durante este cambio?»", []], ["A tu manager", "«¿Qué haría más útiles mis actualizaciones para ti?»", []]]]]}], "sum": [["SBI", "Situación, Comportamiento, Impacto: concreto y justo."], ["Diálogo", "Preguntar, decir, preguntar, y pedir permiso antes."], ["Feedforward", "Pide ideas sobre el futuro y da las gracias."]], "rem": "El feedback arregla el pasado. El feedforward construye el futuro."}, {"id": "ch3", "h": "Conversaciones de coaching", "hook": "Pregunta más de lo que dices y ayuda a las personas a encontrar sus propias respuestas.", "secs": [{"id": "ch3-trust", "k": "Antes de cualquier técnica", "h": "El coaching empieza por la confianza", "blocks": [["cards", 2, [["Cómo les ves", "Capaces, con fortalezas sobre las que construir y que merecen tu tiempo. No si pueden crecer, sino cómo.", []], ["Cómo te ven", "Creíble, útil, de confianza y comprometido con su éxito.", []]]], ["callout", "Sin la relación, el coaching suena a control. Con ella, unas pocas buenas preguntas llegan muy lejos.", true]]}, {"id": "ch3-grow", "k": "Una estructura sencilla", "h": "GROW: Objetivo, Realidad, Opciones, Camino", "blocks": [["tiles", [["G", "Objetivo", "¿Qué quieres conseguir? ¿Cómo sería un buen resultado?"], ["R", "Realidad", "¿Qué está pasando ahora? ¿Qué has probado? ¿Qué te frena?"], ["O", "Opciones", "¿Qué podrías hacer? ¿Qué más? ¿Qué haría alguien a quien admiras?"], ["W", "Camino", "¿Qué vas a hacer y para cuándo? ¿Qué apoyo necesitas?"]]], ["callout", "El modelo GROW lo popularizó Sir John Whitmore en Coaching for Performance."]]}, {"id": "ch3-habits", "k": "Pequeños hábitos, gran efecto", "h": "Tres hábitos de coaching", "blocks": [["cards", 3, [["Pregunta dos veces", "«¿Qué más?» La segunda respuesta suele ser más profunda que la primera.", []], ["Para en dos", "Acordad uno o dos cambios como máximo. El foco gana a una lista larga.", []], ["Apoya y construye", "Cuando las personas se evalúan bien, que es casi siempre, confírmalo y añade una idea.", []]]]]}, {"id": "ch3-bank", "k": "Banco de preguntas", "h": "Preguntas para cada fase", "blocks": [["bank", [["Objetivo", "Aclarar cómo es el éxito.", ["¿Qué te gustaría sacar de esta conversación?", "¿Cómo sería un gran resultado?", "¿Cómo sabrás que lo has conseguido?"], "Que el objetivo sea suyo, no tuyo."], ["Realidad", "Entender qué está pasando de verdad.", ["¿Qué está pasando ahora mismo?", "¿Qué has probado ya y qué pasó?", "¿Qué te está frenando?", "Del 1 al 10, ¿dónde estás? ¿Qué hace que sea ese número?"], "Si «por qué» suena a culpa, prueba con «¿qué te llevó a…?»"], ["Opciones", "Abrir alternativas antes de elegir.", ["¿Qué podrías hacer?", "¿Qué más podrías probar?", "¿Qué le sugerirías a un compañero en tu situación?", "¿Qué harías con más tiempo, presupuesto o autoridad?"], "Espera. El silencio a menudo trae la mejor opción."], ["Camino", "Convertir la idea en acción.", ["¿Qué harás primero y para cuándo?", "¿Qué podría frenarte y cómo lo gestionarás?", "¿Qué apoyo necesitas de mí?"], "Deja que formule el compromiso con sus palabras."], ["Cuando se desvía", "Ayudar sin tomar el control.", ["Explora: «¿Qué te hizo elegir ese enfoque?»", "Guía: «¿Qué pasó cuando probaste…?»", "Comparte una idea: «¿Te ayudaría que te cuente qué me funcionó?»", "Da feedback: «¿Te gustaría recibir feedback sobre eso?» (usa SBI)", "Apárcalo: «Es importante. ¿Lo retomamos en un minuto?»"], "Pasa de preguntar a decir solo lo que haga falta."]]], ["note", "Lectura recomendada: preguntas de ejemplo del modelo GROW (University of Warwick)."]]}], "sum": [["Primero la confianza", "El coaching funciona cuando te ven creíble y útil."], ["GROW", "Objetivo, Realidad, Opciones, Camino."], ["Hábitos", "Pregunta dos veces, para en dos, apoya y construye."]], "rem": "Pregunta, escucha y vuelve a preguntar."}, {"id": "ch4", "h": "Analizar el desempeño", "hook": "¿No puede o no quiere? Diagnostica antes de reaccionar.", "secs": [{"id": "ch4-gap", "k": "Empieza por la brecha", "h": "¿No puede o no quiere?", "blocks": [["p", "Antes de actuar sobre un problema de desempeño, describe la brecha: qué se espera, qué está pasando y por qué importa. Después hazte la pregunta diagnóstica clásica de Mager y Pipe: ¿podría hacerlo si su vida dependiera de ello? Si no, es una brecha de capacidad. Si sí, mira la voluntad y las condiciones que le rodean."], ["cards", 2, [["No puede: capacidad", "", ["Expectativas claras: ¿sabe qué, cómo y para cuándo?", "Herramientas, tiempo e información: ¿el puesto le permite tener éxito?", "Habilidades y conocimientos: ¿ha tenido la formación o la práctica que necesitaría una persona típica?"]], ["No quiere: voluntad", "", ["Consecuencias: ¿se reconoce el buen desempeño y se aborda el malo?", "Prioridades: ¿sabe dónde se sitúa esto frente a todo lo demás?", "Compromiso: ¿entiende por qué hay que hacerlo de esta manera?"]]]], ["callout", "Muchos problemas de «no quiere» resultan ser del entorno, no de la persona: objetivos poco claros, prioridades en conflicto o falta de feedback. El Behavior Engineering Model de Thomas Gilbert dice lo mismo: primero arregla las condiciones."]]}, {"id": "ch4-matrix", "k": "Elige tu respuesta", "h": "La matriz habilidad-voluntad", "blocks": [["matrix", {"tl": ["Motivar", "Puede pero no quiere: escucha por qué, conecta el trabajo con lo que valora, reconoce el esfuerzo y sé claro con las consecuencias."], "tr": ["Delegar", "Puede y quiere: da responsabilidad y libertad, reconoce resultados y haz coaching para crecer."], "bl": ["Dirigir", "Aún no puede ni quiere: tareas claras, pequeñas victorias, apoyo cercano al principio y después da un paso atrás. Puede hacer falta una conversación difícil."], "br": ["Guiar", "Quiere pero aún no puede: forma, asigna un mentor y genera confianza con éxitos tempranos."]}, "Habilidad", "Voluntad"], ["note", "La matriz habilidad-voluntad está adaptada de The Tao of Coaching, de Max Landsberg."]]}, {"id": "ch4-cycle", "k": "Mantenlo en marcha", "h": "Alinear, revisar, ajustar", "blocks": [["steps", [["Alinear", "Acordad objetivos conectados con las prioridades del equipo y de la empresa, y dejadlos por escrito."], ["Revisar", "Conversaciones breves y regulares sobre avances, obstáculos y apoyo."], ["Ajustar", "Cambiad objetivos, acciones o apoyo cuando cambien las cosas."]]]]}], "sum": [["La brecha", "Describe lo esperado frente a lo real y por qué importa."], ["No puede o no quiere", "¿Capacidad o voluntad? Revisa primero las condiciones."], ["Habilidad-voluntad", "Dirigir, guiar, motivar o delegar."]], "rem": "Primero diagnostica. Después elige tu respuesta."}, {"id": "ch5", "h": "Conversaciones difíciles", "hook": "Cuando hay mucho en juego, prepararse es una forma de respeto.", "secs": [{"id": "ch5-why", "k": "Qué las hace difíciles", "h": "Mucho en juego, opiniones distintas, emociones intensas", "blocks": [["p", "Los autores de Crucial Conversations describen estos momentos como conversaciones en las que hay mucho en juego, las opiniones difieren y las emociones son intensas. Douglas Stone, Bruce Patton y Sheila Heen añaden que toda conversación difícil son en realidad tres: qué pasó, qué sentimos y qué dice de quiénes somos."], ["callout", "Pregúntate: ¿cuál es el coste de no tener esta conversación?", true]]}, {"id": "ch5-prep", "k": "Antes de hablar", "h": "Prepara: la lista de comprobación", "blocks": [["checklist", [["¿Hay una brecha real?", "Confirma primero el problema", [["He definido con claridad el desempeño o el comportamiento que espero.", false], ["La brecha es menor y se resolvería sola sin una conversación.", true]]], ["¿Puede? (capacidad)", "Revisa las condiciones", [["Sabe qué hacer, cómo y para cuándo.", false], ["Tiene las herramientas, el tiempo y la información que necesita.", false], ["Tiene las habilidades y los conocimientos para hacerlo.", false]]], ["¿Quiere? (voluntad)", "Revisa la motivación y las prioridades", [["El buen desempeño se reconoce y el malo tiene consecuencias.", false], ["Entiende por qué hay que hacerlo de esta manera.", false], ["Sabe que es una prioridad frente al resto de su trabajo.", false]]]]]]}, {"id": "ch5-talk", "k": "Durante", "h": "Habla: cinco pasos", "blocks": [["steps", [["Di el propósito", "Sé claro desde el principio: «Quiero hablar de los plazos incumplidos del proyecto.»"], ["Describe la brecha y su impacto", "Usa SBI. Explica el impacto que más le importa: equipo, clientes o sus propios objetivos."], ["Escucha su visión", "Pregunta qué le está pasando. Puedes descubrir algo que cambie el panorama."], ["Acordad un camino", "Pasos concretos, un plazo, qué pasa si no cambia y una fecha de seguimiento. Construye sobre sus ideas; reconduce si echa la culpa a otros; sé directivo si hace falta."], ["Resume y apoya", "Recapitula el acuerdo y el apoyo que vas a dar."]]]]}, {"id": "ch5-follow", "k": "Después", "h": "Haz seguimiento", "blocks": [["cards", 3, [["Déjalo por escrito", "Anota lo acordado y compártelo si procede.", []], ["Revisa en la fecha", "Cumple el seguimiento prometido, aunque las cosas vayan bien.", []], ["Reconoce el progreso", "Fíjate pronto en la mejora. Así se consolida.", []]]]]}], "sum": [["Reconoce las señales", "Mucho en juego, opiniones distintas, emociones intensas."], ["Prepara", "Usa la lista: brecha real, no puede o no quiere."], ["Habla y haz seguimiento", "Propósito, brecha, escucha, acuerdo, resumen y seguimiento."]], "rem": "Prepara, habla, haz seguimiento."}, {"id": "ch6", "h": "Influir sin autoridad", "hook": "La influencia es un intercambio basado en la confianza.", "secs": [{"id": "ch6-model", "k": "Seis pasos, un ciclo", "h": "El modelo de Cohen y Bradford", "blocks": [["cycle", ["Considera a todos posibles aliados", "Aclara tus objetivos y prioridades", "Entiende el mundo de la otra persona", "Identifica qué valora y qué puedes ofrecer", "Cuida la relación", "Influye mediante el dar y recibir"]], ["note", "Modelo: Allan R. Cohen y David L. Bradford, Influence without Authority. Después del paso 6, el ciclo vuelve a empezar."]]}, {"id": "ch6-currencies", "k": "Lo que valoran las personas", "h": "Las monedas de la influencia", "blocks": [["p", "Cohen y Bradford llaman «monedas» a lo que valoran las personas. Puedes influir cuando puedes ofrecer algo que la otra persona valora. La mayoría valora más de una cosa, y casi todos subestimamos lo que podemos ofrecer."], ["tabs", [["Inspiración", [["Visión", "Formar parte de algo más grande"], ["Excelencia", "Hacer muy bien un trabajo importante"], ["Ética", "Hacer lo correcto"]]], ["Tarea", [["Recursos", "Presupuesto, personas, tiempo"], ["Ayuda", "Apoyo con un proyecto o un problema"], ["Información", "Acceso a conocimiento o perspectiva"], ["Rapidez", "Conseguir algo antes"]]], ["Posición", [["Reconocimiento", "Reconocer el esfuerzo o los resultados"], ["Visibilidad", "Que te vean personas sénior"], ["Red", "Contactos nuevos y útiles"]]], ["Relación", [["Comprensión", "Sentirse escuchado"], ["Inclusión", "Sentirse parte del grupo"], ["Apoyo", "Respaldo personal"]]], ["Personal", [["Gratitud", "Un agradecimiento sincero"], ["Propiedad", "Influencia sobre un trabajo importante"], ["Comodidad", "Menos complicaciones"]]]]], ["callout", "Construye relaciones antes de necesitarlas. La confianza es el crédito al que recurres cuando pides ayuda.", true]]}], "sum": [["Aliados", "Considera a todos posibles aliados."], ["Su mundo", "Entiende las presiones y métricas que le condicionan."], ["Monedas", "Ofrece lo que valora; espera dar y recibir."]], "rem": "Da primero. La influencia sigue a la confianza."}, {"id": "ch7", "h": "Gestión de stakeholders", "hook": "Los buenos cambios salen adelante gracias a las personas. Súmalas a propósito.", "secs": [{"id": "ch7-steps", "k": "La visión general", "h": "Cinco hábitos", "blocks": [["steps", [["Identificar", "Todas las personas que influyen en el cambio o se ven afectadas por él."], ["Analizar", "Qué le importa a cada una y cuánta influencia tiene."], ["Mapear", "Situarlas en la cuadrícula para decidir dónde pones el esfuerzo."], ["Implicar", "Decidir cuánto debe participar cada una."], ["Comunicar", "Planificar mensaje, canal y momento, y después revisar y adaptar."]]]]}, {"id": "ch7-grid", "k": "Dónde invertir tu tiempo", "h": "La cuadrícula de influencia e interés", "blocks": [["matrix", {"tl": ["Mantener satisfecho", "Mucha influencia, menos interés: actualizaciones dirigidas a lo que le importa, sin sorpresas."], "tr": ["Gestionar de cerca", "Mucha influencia, mucho interés: implícalo pronto, reúnete a menudo y muestra qué gana."], "bl": ["Observar", "Menos influencia, menos interés: comunicación general; atento a cambios."], "br": ["Mantener informado", "Menos influencia, mucho interés: actualizaciones regulares y escucha; puede ser embajador."]}, "Influencia", "Interés"], ["note", "Adaptado de la cuadrícula poder-interés de Aubrey Mendelow."]]}, {"id": "ch7-try", "k": "Práctica", "h": "Pruébalo: mapea tus stakeholders", "blocks": [["smap"]]}, {"id": "ch7-ladder", "k": "De hoy a mañana", "h": "¿Dónde están y dónde los necesitas?", "blocks": [["ladder", [["Desconoce", "Aún no sabe nada del cambio.", "Que se lo cuente alguien de confianza."], ["Resistente", "Lo conoce y está en contra.", "Una conversación real sobre su preocupación."], ["Neutral", "Lo conoce, sin opinión fuerte.", "Un motivo para que le importe que sea suyo, no tuyo."], ["Favorable", "Quiere que funcione.", "Algo concreto que hacer."], ["Lidera", "Lo impulsa activamente.", "Reconocimiento y cuidado de su energía."]]], ["note", "Basado en los niveles de implicación de stakeholders usados en gestión de proyectos (PMI)."]]}, {"id": "ch7-plan", "k": "Júntalo todo", "h": "Tu plan de comunicación en una página", "blocks": [["table", ["Grupo", "Cuadrante", "Mensaje clave", "Canal", "Momento", "Responsable"], [["Sponsor ejecutivo", "Gestionar de cerca", "Avances, riesgos, decisiones necesarias", "Llamada 1:1", "Antes de los hitos", "Líder del cambio"], ["Líderes de personas", "Mantener informado", "Qué cambia para sus equipos y cómo explicarlo", "Sesión + preguntas frecuentes", "Antes de cada paso", "RR. HH. o comunicación"], ["Equipo colaborador", "Mantener satisfecho", "Plazos y efecto en su trabajo", "Email breve, llamada si hace falta", "En los hitos", "Líder del cambio"], ["Toda la plantilla", "Observar", "Qué cambia y dónde pedir ayuda", "Publicación en chat o newsletter", "Momentos clave", "Comunicación"]]], ["callout", "Comunica con propósito, no solo más: cada mensaje debe llevar a una decisión, una acción, una pregunta o un aviso."]]}], "sum": [["Mapear", "La influencia y el interés muestran dónde centrarte."], ["Implicar", "Compara dónde está cada persona con dónde la necesitas."], ["Planificar", "Mensaje, canal, momento y responsable para cada grupo."]], "rem": "Suma a las personas a propósito."}], "ca": [{"id": "ch0", "h": "Per què les habilitats amb persones mouen el canvi", "hook": "El canvi avança a la velocitat de la confiança, conversa a conversa.", "secs": [{"id": "ch0-why", "k": "Comença aquí", "h": "El canvi es fa en converses", "blocks": [["p", "Les estratègies, els sistemes i els organigrames canvien sobre el paper en un dia. Les persones canvien en converses: quan entenen, quan se senten escoltades, quan reben feedback i quan algú en qui confien els demana ajuda. L'agilitat davant el canvi és la capacitat de continuar tenint aquestes converses, i bé, mentre tot es mou."], ["cards", 3, [["Les persones donen suport al que ajuden a crear", "Implicar funciona millor que anunciar. Com més aviat participen les persones en un canvi, menys cal vendre'l.", []], ["El canvi arriba persona a persona", "Cada conversa d'un manager suma impuls o el va restant sense fer soroll.", []], ["L'agilitat necessita estabilitat", "La recerca de McKinsey sobre organitzacions àgils mostra que combinen una base estable amb maneres de treballar ràpides i flexibles. Les habilitats amb persones formen part d'aquesta base.", []]]], ["callout", "Aquest playbook ofereix als líders set habilitats pràctiques per al costat humà del canvi. Llegeix un capítol en deu minuts o obre l'eina que necessites just abans d'una conversa.", true]]}, {"id": "ch0-map", "k": "Les set habilitats", "h": "Set habilitats per a set moments del canvi", "blocks": [["steps", [["Comunicar", "Fer que el canvi s'entengui i escoltar com es rep."], ["Donar feedback i feedforward", "Corregir el rumb aviat, mirant enrere i mirant endavant."], ["Fer coaching", "Crear sentit de propietat perquè cada persona trobi el seu camí en el canvi."], ["Diagnosticar el rendiment", "Distingir una bretxa de capacitat d'una de voluntat abans de reaccionar."], ["Tenir converses difícils", "Abordar la resistència i els compromisos incomplerts amb respecte."], ["Influir sense autoritat", "Aconseguir el suport de persones que no depenen de tu."], ["Gestionar stakeholders", "Sumar les persones adequades, en el moment adequat i a propòsit."]]]]}], "sum": [["Converses", "El canvi passa en converses, no en anuncis."], ["Implicació", "Les persones donen suport al que ajuden a crear."], ["Equilibri", "L'agilitat necessita una base estable, i les habilitats amb persones en formen part."]], "rem": "El canvi avança a la velocitat de la confiança."}, {"id": "ch1", "h": "Connexió i comunicació", "hook": "Cada conversa construeix confiança o la gasta.", "secs": [{"id": "ch1-model", "k": "Un model senzill", "h": "Intenció, missatge i relació, amb l'escolta al centre", "blocks": [["p", "Tres preguntes donen forma a tota conversa important. L'escolta és el que les connecta: sense ella, una intenció clara i un missatge ben construït poden fer malbé igualment la relació."], ["tiles", [["I", "Intenció", "Per què parlo? Quin resultat vull i és el moment adequat?"], ["M", "Missatge", "Què he de dir exactament, amb quines paraules, per quin canal i amb quin to?"], ["R", "Relació", "Com afectarà aquesta conversa la confiança entre nosaltres, avui i el mes que ve?"], ["E", "Escolta", "Què està sentint, notant i callant l'altra persona? Comprova i ajusta."]]], ["callout", "Síntesi de Fran Mondaca a partir de principis de comunicació àmpliament utilitzats, com l'escolta activa (Carl Rogers) i la idea que els canals més rics encaixen millor amb missatges complexos o sensibles (Daft i Lengel)."]]}, {"id": "ch1-listen", "k": "La caixa d'eines", "h": "Escoltar i aclarir", "blocks": [["cards", 3, [["Escoltar per entendre", "Para tota l'atenció. Fixa't en les paraules, el to i el que falta.", []], ["Preguntes obertes", "Preguntes que no es responen amb sí o no: «Com ho veus?»", []], ["Explorar", "Aprofundeix per comprovar què es volia dir, no només què es va dir.", []], ["Parafrasejar", "Retorna-ho amb les teves paraules: «Llavors, el que més t'importa és…»", []], ["Resumir", "Tanca amb acords, responsables i passos següents.", []], ["Cuidar el to", "Les mateixes paraules sonen diferent amb pressa, per escrit o sota pressió.", []]]]]}, {"id": "ch1-channel", "k": "Missatge i mitjà", "h": "Tria el canal adequat", "blocks": [["table", ["Canal", "Ideal per a", "Evita'l quan"], [["En persona o videotrucada", "Temes sensibles, complexos o emocionals; construir confiança", "Només cal compartir informació"], ["Trucada", "Alinear-se ràpid, seguiments amb persones que coneixes", "Cal veure material visual o donar una mala notícia"], ["Correu", "Actualitzacions detallades, decisions que han de quedar registrades", "Una conversa ho resoldria abans"], ["Xat", "Preguntes breus i coordinació", "El tema és sensible o necessita una decisió documentada"], ["Document compartit", "Informació que ha d'estar actualitzada i accessible", "Les persones necessiten reaccionar o preguntar ja"]]], ["callout", "Pregunta a cada persona com prefereix que la contactin, i no gestionis mai un rendiment baix o una mala notícia només per xat o correu."]]}, {"id": "ch1-distance", "k": "En remot, híbrid i multicultural", "h": "Liderar a distància i entre cultures", "blocks": [["cards", 2, [["Confirma que s'ha entès", "Sense llenguatge corporal, comprova més sovint: «Què t'emportes d'això?»", []], ["Fes servir exemples i dades", "Quan veus menys la feina, recolza't en exemples concrets i mètriques acordades.", []], ["Fes coaching a prop del moment", "Una trucada breu just després d'una reunió val més que una revisió llarga setmanes després.", []], ["Adapta't als estils culturals", "La franquesa, la jerarquia i la manera de discrepar varien entre cultures. Pregunta, observa i ajusta.", []]]]]}], "sum": [["Intenció", "Sàpigues per què parles i quin resultat busques."], ["Missatge", "Tria paraules, canal i to a propòsit."], ["Relació", "Cada conversa construeix o gasta confiança."], ["Escolta", "Ho connecta tot: comprova com es rep."]], "rem": "Primer escolta. Després parla amb intenció."}, {"id": "ch2", "h": "Feedback i feedforward", "hook": "El feedback mira enrere per aprendre. El feedforward mira endavant per millorar.", "secs": [{"id": "ch2-sbi", "k": "Una estructura clara", "h": "SBI: Situació, Comportament, Impacte", "blocks": [["tiles", [["S", "Situació", "Quan i on va passar. Sigues concret: «A la trucada amb el client de dimarts…»"], ["B", "Comportament", "Què va fer o dir la persona, com ho gravaria una càmera, sense jutjar la intenció."], ["I", "Impacte", "L'efecte en tu, en l'equip, en el client o en el resultat."], ["→", "Pas següent", "Pregunta com ho veu i acordeu què mantenir o canviar."]]], ["two", ["Vague", "«Has de ser més proactiu.»"], ["SBI", "«A la trucada amb el client de dimarts, vas avisar del risc d'entrega abans que el client ho preguntés. Ens va donar temps per ajustar, i el client va dir que li va generar confiança. Continua fent-ho.»"]], ["callout", "SBI és el model Situation-Behaviour-Impact desenvolupat pel Center for Creative Leadership."]]}, {"id": "ch2-ata", "k": "Que sigui un diàleg", "h": "Preguntar, dir, preguntar", "blocks": [["steps", [["Preguntar", "«Com creus que ha anat?» Comença per la seva visió; potser no cal que diguis gaire."], ["Dir", "Comparteix la teva observació amb SBI. Un o dos punts, no deu."], ["Preguntar", "«Com ho veus? Què provaràs la propera vegada?»"]]], ["callout", "Demana permís primer: «T'agradaria rebre feedback sobre això?» Les persones escolten amb més atenció el feedback que han acceptat rebre.", true]]}, {"id": "ch2-ff", "k": "Mirant endavant", "h": "Feedforward: demanar idees sobre el futur", "blocks": [["p", "El feedforward de Marshall Goldsmith gira el feedback: tries alguna cosa en què vols millorar i demanes idees per al futur. Sense parlar del passat i sense defensar-te."], ["steps", [["Tria", "Un comportament que vulguis millorar."], ["Demana", "«Si volgués portar millors reunions, què em suggeriries?»"], ["Escolta", "Pren notes. No jutgis, no et defensis, no expliquis."], ["Agraeix", "Simplement dona les gràcies."], ["Fes-ho servir", "Queda't amb el que encaixi. Deixa la resta."]]], ["cards", 3, [["A un company", "«Com podria fer més fluids els nostres traspassos?»", []], ["Al teu equip", "«Què podria fer per donar-vos més suport durant aquest canvi?»", []], ["Al teu manager", "«Què faria més útils les meves actualitzacions per a tu?»", []]]]]}], "sum": [["SBI", "Situació, Comportament, Impacte: concret i just."], ["Diàleg", "Preguntar, dir, preguntar, i demanar permís abans."], ["Feedforward", "Demana idees sobre el futur i dona les gràcies."]], "rem": "El feedback arregla el passat. El feedforward construeix el futur."}, {"id": "ch3", "h": "Converses de coaching", "hook": "Pregunta més del que dius i ajuda les persones a trobar les seves pròpies respostes.", "secs": [{"id": "ch3-trust", "k": "Abans de qualsevol tècnica", "h": "El coaching comença per la confiança", "blocks": [["cards", 2, [["Com els veus", "Capaços, amb fortaleses sobre les quals construir i que mereixen el teu temps. No si poden créixer, sinó com.", []], ["Com et veuen", "Creïble, útil, de confiança i compromès amb el seu èxit.", []]]], ["callout", "Sense la relació, el coaching sona a control. Amb ella, unes poques bones preguntes arriben molt lluny.", true]]}, {"id": "ch3-grow", "k": "Una estructura senzilla", "h": "GROW: Objectiu, Realitat, Opcions, Camí", "blocks": [["tiles", [["G", "Objectiu", "Què vols aconseguir? Com seria un bon resultat?"], ["R", "Realitat", "Què està passant ara? Què has provat? Què t'atura?"], ["O", "Opcions", "Què podries fer? Què més? Què faria algú a qui admires?"], ["W", "Camí", "Què faràs i per a quan? Quin suport necessites?"]]], ["callout", "El model GROW el va popularitzar Sir John Whitmore a Coaching for Performance."]]}, {"id": "ch3-habits", "k": "Petits hàbits, gran efecte", "h": "Tres hàbits de coaching", "blocks": [["cards", 3, [["Pregunta dues vegades", "«Què més?» La segona resposta sol ser més profunda que la primera.", []], ["Atura't a dos", "Acordeu un o dos canvis com a màxim. El focus guanya a una llista llarga.", []], ["Dona suport i construeix", "Quan les persones s'avaluen bé, que és gairebé sempre, confirma-ho i afegeix-hi una idea.", []]]]]}, {"id": "ch3-bank", "k": "Banc de preguntes", "h": "Preguntes per a cada fase", "blocks": [["bank", [["Objectiu", "Aclarir com és l'èxit.", ["Què t'agradaria treure d'aquesta conversa?", "Com seria un gran resultat?", "Com sabràs que ho has aconseguit?"], "Que l'objectiu sigui seu, no teu."], ["Realitat", "Entendre què està passant de debò.", ["Què està passant ara mateix?", "Què has provat ja i què va passar?", "Què t'està frenant?", "De l'1 al 10, on ets? Què fa que sigui aquest número?"], "Si «per què» sona a culpa, prova amb «què et va portar a…?»"], ["Opcions", "Obrir alternatives abans de triar.", ["Què podries fer?", "Què més podries provar?", "Què li suggeriries a un company en la teva situació?", "Què faries amb més temps, pressupost o autoritat?"], "Espera. El silenci sovint porta la millor opció."], ["Camí", "Convertir la idea en acció.", ["Què faràs primer i per a quan?", "Què et podria frenar i com ho gestionaràs?", "Quin suport necessites de mi?"], "Deixa que formuli el compromís amb les seves paraules."], ["Quan es desvia", "Ajudar sense prendre el control.", ["Explora: «Què et va fer triar aquest enfocament?»", "Guia: «Què va passar quan vas provar…?»", "Comparteix una idea: «T'ajudaria que t'expliqui què em va funcionar?»", "Dona feedback: «T'agradaria rebre feedback sobre això?» (fes servir SBI)", "Aparca-ho: «És important. Ho reprenem d'aquí a un minut?»"], "Passa de preguntar a dir només el que calgui."]]], ["note", "Lectura recomanada: preguntes d'exemple del model GROW (University of Warwick)."]]}], "sum": [["Primer la confiança", "El coaching funciona quan et veuen creïble i útil."], ["GROW", "Objectiu, Realitat, Opcions, Camí."], ["Hàbits", "Pregunta dues vegades, atura't a dos, dona suport i construeix."]], "rem": "Pregunta, escolta i torna a preguntar."}, {"id": "ch4", "h": "Analitzar el rendiment", "hook": "No pot o no vol? Diagnostica abans de reaccionar.", "secs": [{"id": "ch4-gap", "k": "Comença per la bretxa", "h": "No pot o no vol?", "blocks": [["p", "Abans d'actuar sobre un problema de rendiment, descriu la bretxa: què s'espera, què està passant i per què importa. Després fes-te la pregunta diagnòstica clàssica de Mager i Pipe: ho podria fer si la seva vida en depengués? Si no, és una bretxa de capacitat. Si sí, mira la voluntat i les condicions que l'envolten."], ["cards", 2, [["No pot: capacitat", "", ["Expectatives clares: sap què, com i per a quan?", "Eines, temps i informació: la feina li permet tenir èxit?", "Habilitats i coneixements: ha tingut la formació o la pràctica que necessitaria una persona típica?"]], ["No vol: voluntat", "", ["Conseqüències: es reconeix el bon rendiment i s'aborda el dolent?", "Prioritats: sap on se situa això davant de tota la resta?", "Compromís: entén per què cal fer-ho d'aquesta manera?"]]]], ["callout", "Molts problemes de «no vol» resulten ser de l'entorn, no de la persona: objectius poc clars, prioritats en conflicte o manca de feedback. El Behavior Engineering Model de Thomas Gilbert diu el mateix: primer arregla les condicions."]]}, {"id": "ch4-matrix", "k": "Tria la teva resposta", "h": "La matriu habilitat-voluntat", "blocks": [["matrix", {"tl": ["Motivar", "Pot però no vol: escolta per què, connecta la feina amb el que valora, reconeix l'esforç i sigues clar amb les conseqüències."], "tr": ["Delegar", "Pot i vol: dona responsabilitat i llibertat, reconeix resultats i fes coaching per créixer."], "bl": ["Dirigir", "Encara no pot ni vol: tasques clares, petites victòries, suport proper al principi i després fes un pas enrere. Pot caldre una conversa difícil."], "br": ["Guiar", "Vol però encara no pot: forma, assigna un mentor i genera confiança amb èxits primerencs."]}, "Habilitat", "Voluntat"], ["note", "La matriu habilitat-voluntat està adaptada de The Tao of Coaching, de Max Landsberg."]]}, {"id": "ch4-cycle", "k": "Mantén-ho en marxa", "h": "Alinear, revisar, ajustar", "blocks": [["steps", [["Alinear", "Acordeu objectius connectats amb les prioritats de l'equip i de l'empresa, i deixeu-los per escrit."], ["Revisar", "Converses breus i regulars sobre avenços, obstacles i suport."], ["Ajustar", "Canvieu objectius, accions o suport quan canviïn les coses."]]]]}], "sum": [["La bretxa", "Descriu l'esperat davant del real i per què importa."], ["No pot o no vol", "Capacitat o voluntat? Revisa primer les condicions."], ["Habilitat-voluntat", "Dirigir, guiar, motivar o delegar."]], "rem": "Primer diagnostica. Després tria la teva resposta."}, {"id": "ch5", "h": "Converses difícils", "hook": "Quan hi ha molt en joc, preparar-se és una forma de respecte.", "secs": [{"id": "ch5-why", "k": "Què les fa difícils", "h": "Molt en joc, opinions diferents, emocions intenses", "blocks": [["p", "Els autors de Crucial Conversations descriuen aquests moments com a converses en què hi ha molt en joc, les opinions difereixen i les emocions són intenses. Douglas Stone, Bruce Patton i Sheila Heen hi afegeixen que tota conversa difícil en realitat en són tres: què va passar, què sentim i què diu de qui som."], ["callout", "Pregunta't: quin és el cost de no tenir aquesta conversa?", true]]}, {"id": "ch5-prep", "k": "Abans de parlar", "h": "Prepara: la llista de comprovació", "blocks": [["checklist", [["Hi ha una bretxa real?", "Confirma primer el problema", [["He definit amb claredat el rendiment o el comportament que espero.", false], ["La bretxa és menor i es resoldria sola sense una conversa.", true]]], ["Pot? (capacitat)", "Revisa les condicions", [["Sap què fer, com i per a quan.", false], ["Té les eines, el temps i la informació que necessita.", false], ["Té les habilitats i els coneixements per fer-ho.", false]]], ["Vol? (voluntat)", "Revisa la motivació i les prioritats", [["El bon rendiment es reconeix i el dolent té conseqüències.", false], ["Entén per què cal fer-ho d'aquesta manera.", false], ["Sap que és una prioritat davant de la resta de la seva feina.", false]]]]]]}, {"id": "ch5-talk", "k": "Durant", "h": "Parla: cinc passos", "blocks": [["steps", [["Digues el propòsit", "Sigues clar des del principi: «Vull parlar dels terminis incomplerts del projecte.»"], ["Descriu la bretxa i el seu impacte", "Fes servir SBI. Explica l'impacte que més li importa: equip, clients o els seus propis objectius."], ["Escolta la seva visió", "Pregunta què li està passant. Pots descobrir alguna cosa que canviï el panorama."], ["Acordeu un camí", "Passos concrets, un termini, què passa si no canvia i una data de seguiment. Construeix sobre les seves idees; reconduu-lo si culpa altres; sigues directiu si cal."], ["Resumeix i dona suport", "Recapitula l'acord i el suport que donaràs."]]]]}, {"id": "ch5-follow", "k": "Després", "h": "Fes el seguiment", "blocks": [["cards", 3, [["Deixa-ho per escrit", "Anota el que s'ha acordat i comparteix-ho si escau.", []], ["Revisa en la data", "Compleix el seguiment promès, encara que les coses vagin bé.", []], ["Reconeix el progrés", "Fixa't aviat en la millora. Així es consolida.", []]]]]}], "sum": [["Reconeix els senyals", "Molt en joc, opinions diferents, emocions intenses."], ["Prepara", "Fes servir la llista: bretxa real, no pot o no vol."], ["Parla i fes el seguiment", "Propòsit, bretxa, escolta, acord, resum i seguiment."]], "rem": "Prepara, parla, fes el seguiment."}, {"id": "ch6", "h": "Influir sense autoritat", "hook": "La influència és un intercanvi basat en la confiança.", "secs": [{"id": "ch6-model", "k": "Sis passos, un cicle", "h": "El model de Cohen i Bradford", "blocks": [["cycle", ["Considera tothom un possible aliat", "Aclareix els teus objectius i prioritats", "Entén el món de l'altra persona", "Identifica què valora i què pots oferir", "Cuida la relació", "Influeix amb el donar i rebre"]], ["note", "Model: Allan R. Cohen i David L. Bradford, Influence without Authority. Després del pas 6, el cicle torna a començar."]]}, {"id": "ch6-currencies", "k": "El que valoren les persones", "h": "Les monedes de la influència", "blocks": [["p", "Cohen i Bradford anomenen «monedes» el que valoren les persones. Pots influir quan pots oferir alguna cosa que l'altra persona valora. La majoria en valora més d'una, i gairebé tots subestimem el que podem oferir."], ["tabs", [["Inspiració", [["Visió", "Formar part d'alguna cosa més gran"], ["Excel·lència", "Fer molt bé una feina important"], ["Ètica", "Fer el que és correcte"]]], ["Tasca", [["Recursos", "Pressupost, persones, temps"], ["Ajuda", "Suport amb un projecte o un problema"], ["Informació", "Accés a coneixement o perspectiva"], ["Rapidesa", "Aconseguir alguna cosa abans"]]], ["Posició", [["Reconeixement", "Reconèixer l'esforç o els resultats"], ["Visibilitat", "Que et vegin persones sèniors"], ["Xarxa", "Contactes nous i útils"]]], ["Relació", [["Comprensió", "Sentir-se escoltat"], ["Inclusió", "Sentir-se part del grup"], ["Suport", "Suport personal"]]], ["Personal", [["Gratitud", "Un agraïment sincer"], ["Propietat", "Influència sobre una feina important"], ["Comoditat", "Menys complicacions"]]]]], ["callout", "Construeix relacions abans de necessitar-les. La confiança és el crèdit al qual recorres quan demanes ajuda.", true]]}], "sum": [["Aliats", "Considera tothom un possible aliat."], ["El seu món", "Entén les pressions i mètriques que el condicionen."], ["Monedes", "Ofereix el que valora; espera donar i rebre."]], "rem": "Dona primer. La influència segueix la confiança."}, {"id": "ch7", "h": "Gestió de stakeholders", "hook": "Els bons canvis tiren endavant gràcies a les persones. Suma-les a propòsit.", "secs": [{"id": "ch7-steps", "k": "La visió general", "h": "Cinc hàbits", "blocks": [["steps", [["Identificar", "Totes les persones que influeixen en el canvi o se'n veuen afectades."], ["Analitzar", "Què li importa a cadascuna i quanta influència té."], ["Mapejar", "Situar-les a la quadrícula per decidir on poses l'esforç."], ["Implicar", "Decidir quant ha de participar cadascuna."], ["Comunicar", "Planificar missatge, canal i moment, i després revisar i adaptar."]]]]}, {"id": "ch7-grid", "k": "On invertir el teu temps", "h": "La quadrícula d'influència i interès", "blocks": [["matrix", {"tl": ["Mantenir satisfet", "Molta influència, menys interès: actualitzacions dirigides al que li importa, sense sorpreses."], "tr": ["Gestionar de prop", "Molta influència, molt interès: implica'l aviat, reuneix-te sovint i mostra què hi guanya."], "bl": ["Observar", "Menys influència, menys interès: co ", "Compara on és cada persona amb on la necessites."], ["Planificar", "Missatge, canal, moment i responsable per a cada grup."]], "rem": "Suma les persones a propòsit."}]};
