<style>

:root{
  --paper:#F5F2EC;--surface:#FFFFFF;--ink:#1C2430;--muted:#5E6673;--rule:#DDD7CC;
  --signal:#0E7C6B;--signal-soft:#DDEFEA;--warm:#A8572A;--warm-soft:#F6E6DA;
  --blob1:#BFE3DA;--blob2:#F1D9C4;
  --display:"Fraunces",Georgia,serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161D;--surface:#19202A;--ink:#ECE8E1;--muted:#A3AAB5;--rule:#2C3542;
    --signal:#4CC7B0;--signal-soft:#16332E;--warm:#E39A6B;--warm-soft:#3A2A1E;
    --blob1:#123C35;--blob2:#3A2A1E;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161D;--surface:#19202A;--ink:#ECE8E1;--muted:#A3AAB5;--rule:#2C3542;
  --signal:#4CC7B0;--signal-soft:#16332E;--warm:#E39A6B;--warm-soft:#3A2A1E;
  --blob1:#123C35;--blob2:#3A2A1E;color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));position:relative;z-index:1}
a{color:inherit;text-decoration-color:var(--signal);text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);font-weight:500!important;margin:0;line-height:1.12;letter-spacing:0!important;text-wrap:balance}
p{margin:0}
button,select{font:inherit}
.label{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--signal);display:inline-block;box-shadow:0 0 0 4px var(--signal-soft);margin-right:8px;vertical-align:1px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:color-mix(in srgb,var(--paper) 78%,transparent);border-bottom:1px solid color-mix(in srgb,var(--rule) 60%,transparent)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;display:inline-flex;align-items:center;gap:10px}
.brand i{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:inline-grid;place-items:center;font-style:normal;font-size:14px;letter-spacing:.02em}
.tools{display:flex;align-items:center;gap:6px}
.navlink{font-weight:600;font-size:14.5px;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:999px;transition:color .2s,background .2s}
.navlink:hover{color:var(--signal);background:var(--signal-soft)}
.navlink[aria-current="page"]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--signal);text-decoration-thickness:2px;text-underline-offset:6px}
.theme{width:34px;height:34px;display:inline-grid;place-items:center;font:500 15px var(--mono);background:transparent;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:0;cursor:pointer;margin-left:4px}
@media (max-width:560px){.brand span{display:none}.navlink{padding:8px 9px;font-size:14px}}

/* ---------- background (same as profile, no portrait) ---------- */
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.35;transition:opacity .6s ease}
body.is-home #net{opacity:1}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.ambient i:nth-child(1){width:46vmax;height:46vmax;background:var(--blob1);top:-12vmax;left:-10vmax}
.ambient i:nth-child(2){width:38vmax;height:38vmax;background:var(--blob2);bottom:-14vmax;right:-8vmax}
@media (prefers-reduced-motion:no-preference){
  .ambient i:nth-child(1){animation:drift1 26s ease-in-out infinite alternate}
  .ambient i:nth-child(2){animation:drift2 32s ease-in-out infinite alternate}
}
@keyframes drift1{to{transform:translate(14vmax,10vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-12vmax,-8vmax) scale(1.15)}}
body:not(.is-home) .ambient{opacity:.35}

/* ---------- languages, share links, toast ---------- */
.switch{display:inline-flex;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:3px;margin-left:4px}
.switch button{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12.5px;font-family:var(--mono)}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
@media (max-width:560px){.switch button{padding:5px 7px;font-size:11.5px}.navlink[data-nav]{display:none}}
.share-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin-left:10px;vertical-align:middle;border-radius:50%;border:1px solid var(--rule);background:var(--surface);color:var(--muted);cursor:pointer;opacity:.7;transition:opacity .2s,color .2s,border-color .2s}
.share-btn:hover,.share-btn:focus-visible{opacity:1;color:var(--signal);border-color:var(--signal)}
.choice-wrap,.path-wrap{position:relative;display:flex}
.choice-wrap > .choice,.path-wrap > .path{flex:1}
.card-share,.path-wrap > .share-btn{position:absolute;top:16px;right:16px;margin:0}
.aname .share-btn{width:34px;height:34px;vertical-align:.35em}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:var(--ink);color:var(--paper);font:600 13.5px var(--body);padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- playbooks ---------- */
.navlink[aria-current="page"]{color:var(--ink)}
.page{padding-block:44px 64px}
.guide>*{min-width:0}
@media (max-width:560px){.topbar .brand span{display:none}.tools{gap:2px}.switch{padding:2px}.navlink{font-size:13px;padding:6px 5px}.theme{width:34px;height:34px}.switch button{padding:4px 6px}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:22px 24px}
.btn{border:0;cursor:pointer;font-weight:600;border-radius:999px;display:inline-flex;align-items:center;gap:8px;background:var(--signal);color:#fff;font-size:15.5px;padding:10px 20px;text-decoration:none}
:root[data-theme="dark"] .btn:not(.ghost){color:#0B1A17}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#0B1A17}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--signal);color:var(--signal)}
.btn.small{font-size:14px;padding:7px 14px}
.tagline{font-family:var(--display);font-weight:500;color:var(--signal);font-size:19px;line-height:1.3;margin:10px 0 0}
.copy{margin:32px 0 0;font-family:var(--mono);font-size:11.5px;color:var(--muted);opacity:.85}
.note{color:var(--muted);font-size:14.5px;margin-top:10px}
/* landing */
#view-home{padding-block:48px 56px}
#view-home .hero{text-align:center;max-width:820px;margin:0 auto}
#view-home .hero .label{justify-content:center;display:flex;color:var(--signal)}
#view-home h1{font-size:clamp(36px,5.6vw,56px);margin-top:14px}
#view-home .lead{margin:16px auto 0;max-width:640px;color:var(--muted);font-size:clamp(17px,2vw,19px)}
.umb{margin-top:44px}
.umb-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:18px}
.umb-head h2{font-size:clamp(28px,4vw,40px)}
.umb-head p{color:var(--muted);max-width:560px;font-size:16px}
.pbcards{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px}
@media (max-width:900px){.pbcards{grid-template-columns:1fr}}
.pbc{position:relative;display:flex;flex-direction:column;text-decoration:none;background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:22px 24px;transition:border-color .2s,transform .2s}
a.pbc:hover{border-color:var(--signal);transform:translateY(-3px)}
.pbc.soon{background:color-mix(in srgb,var(--surface) 90%,transparent);border-style:dashed}
.pbc .tag{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--signal-soft);color:var(--signal);margin-bottom:14px}
.pbc.soon .tag{background:transparent;border:1px solid var(--rule);color:var(--muted)}
.pbc b{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.1;color:var(--ink)}
.pbc .sub2{font-family:var(--display);font-size:19px;color:var(--signal);margin-top:6px}
.pbc.soon .sub2{color:var(--muted)}
.pbc p.d{color:var(--muted);font-size:15.5px;margin:10px 0 16px}
.pbc ul{margin:0 0 18px;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.pbc li{font-size:13px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:2px 9px}
.pbc .go{margin-top:auto;font-family:var(--mono);font-size:12.5px;color:var(--signal)}
.pbc .card-share{position:absolute;top:16px;right:16px;margin:0}
/* guide layout */
.guide{display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;padding-block:32px 64px}
.gnav{position:sticky;top:80px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;padding-right:4px}
.gnav .gt{font-family:var(--display);font-size:22px;line-height:1.15}
.gnav .gs{font-family:var(--display);color:var(--signal);font-size:15px;margin-top:4px}
.gnav ol{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:2px}
.gnav a{display:flex;align-items:center;gap:10px;text-decoration:none;padding:8px 10px;border-radius:10px;font-size:14.5px;color:var(--ink)}
.gnav a:hover{background:var(--signal-soft)}
.gnav a[aria-current="page"]{background:var(--surface);border:1px solid var(--rule);font-weight:600}
.gnav .num{font-family:var(--mono);font-size:12px;color:var(--muted);width:18px;flex:none}
.gnav .ok{margin-left:auto;color:var(--signal);font-size:13px}
.gprog{margin-top:16px;font-size:13px;color:var(--muted)}
.gprog .bar{height:6px;border-radius:99px;background:var(--rule);overflow:hidden;margin-bottom:6px}
.gprog .bar i{display:block;height:100%;background:var(--signal);transition:width .3s}
.gtools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
@media (max-width:900px){.guide{grid-template-columns:1fr;gap:18px}.gnav{position:static;max-height:none}.gnav ol{display:flex;overflow-x:auto;gap:6px;padding-bottom:6px}.gnav a{white-space:nowrap;border:1px solid var(--rule);background:var(--surface)}.gnav .ok{margin-left:4px}}
.chead .label{color:var(--signal)}
.chead h1{font-size:clamp(34px,5vw,52px);margin-top:10px}
.chead .hook{font-family:var(--display);color:var(--signal);font-size:clamp(19px,2.4vw,24px);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px}
.chips a{font-size:13.5px;text-decoration:none;border:1px solid var(--rule);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 12px}
.chips a:hover{border-color:var(--signal);color:var(--signal)}
.sec{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:24px 26px;margin-top:16px;scroll-margin-top:84px}
.sec .k{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--signal)}
.sec h2{font-size:clamp(24px,3vw,30px);margin:6px 0 14px}
.sec h2 .share-btn{width:28px;height:28px;margin:0 0 0 6px;opacity:.55;vertical-align:middle;display:inline-grid}
.sec p.lead2{color:var(--ink);font-size:16.5px;margin:0 0 14px;max-width:72ch}
.cards{display:grid;gap:12px;margin:8px 0}
.cards.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.cards.c2,.cards.c3{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:16px 18px}
.card h3{font-size:19px;margin-bottom:6px}
.card p{color:var(--muted);font-size:15.5px}
.card ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:15px}
.card li{margin:4px 0}.card li::marker{color:var(--signal)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:6px 0}
@media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:16px}
.tile .L{width:48px;height:48px;border-radius:12px;background:var(--signal);color:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:26px;margin-bottom:10px}
.tile h3{font-size:18px;margin-bottom:4px}.tile p{color:var(--muted);font-size:15px}
.steps{list-style:none;margin:6px 0;padding:0;display:grid;gap:8px;counter-reset:st}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:12px 16px;counter-increment:st}
.steps li:before{content:counter(st);width:30px;height:30px;border-radius:50%;background:var(--signal-soft);color:var(--signal);display:grid;place-items:center;font:500 13px var(--mono)}
.steps b{font-family:var(--display);font-weight:500;font-size:18px;display:block}
.steps span{color:var(--muted);font-size:15.5px}
.callout{margin:14px 0 0;padding:14px 18px;border-radius:14px;background:var(--signal-soft);color:var(--ink);font-size:15.5px}
.callout.dark{background:var(--ink);color:var(--paper)}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin:12px 0 0}
.two div{border-radius:14px;padding:14px 16px;border:1px solid var(--rule);background:var(--paper)}
.two div:first-child{border-color:var(--warm)}.two div:last-child{border-color:var(--signal)}
.two small{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.two div:first-child small{color:var(--warm)}.two div:last-child small{color:var(--signal)}
.two p{font-style:italic;font-size:15.5px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.tblw{overflow-x:auto;border:1px solid var(--rule);border-radius:14px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
th{text-align:left;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--rule);background:var(--paper)}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
td:first-child{font-weight:600}
tr:last-child td{border-bottom:0}
.mx{position:relative;display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:auto auto 28px;gap:10px;margin:6px 0}
.mx .q{border-radius:14px;padding:14px 16px;border:1px solid var(--rule);background:var(--paper)}
.mx .q h3{font-size:19px;margin-bottom:4px}.mx .q p{color:var(--muted);font-size:15px}
.mx .q.tr{background:var(--signal-soft);border-color:var(--signal)}.mx .q.tr h3{color:var(--signal)}
.mx .ay{grid-row:1/3;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mx .ax{grid-column:2/4;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:2px solid var(--rule);padding-top:4px}
@media (max-width:640px){.mx{grid-template-columns:1fr}.mx .ay,.mx .ax{display:none}}
.cyc{list-style:none;margin:6px 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;counter-reset:cy}
.cyc li{counter-increment:cy;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;font-size:15.5px;position:relative}
.cyc li:before{content:counter(cy);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--signal);color:var(--paper);font:500 13px var(--mono);margin-right:8px}
.cyc-note{font-family:var(--mono);font-size:12.5px;color:var(--signal);margin-top:8px}
@media (max-width:760px){.cyc{grid-template-columns:1fr}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.tabs button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
details.bq{border:1px solid var(--rule);border-radius:14px;background:var(--paper);margin-top:8px;overflow:hidden}
details.bq summary{cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
details.bq summary b{font-family:var(--display);font-weight:500;font-size:18px}
details.bq summary span{color:var(--muted);font-size:14.5px}
details.bq ul{margin:0;padding:4px 20px 6px 36px}
details.bq li{font-style:italic;margin:6px 0;font-size:15.5px}
details.bq li::marker{color:var(--signal)}
details.bq .tipq{padding:4px 16px 14px;color:var(--muted);font-size:14.5px}
.bqbar{display:flex;gap:8px;margin-bottom:4px}
.chkg{margin-top:12px}
.chkg h3{font-size:18px}.chkg .nn{color:var(--muted);font-size:14px;margin-bottom:8px}
.chk{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin-top:6px}
.chk .qq{font-size:15.5px}.chk .qq small{display:block;color:var(--warm);font-size:13px;margin-top:4px}
.seg{display:flex;gap:4px}
.seg button{font:inherit;font-size:13.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
