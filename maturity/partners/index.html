<style>
:root{--paper:#F5F2EC;--surface:#FFFFFF;--ink:#1C2430;--muted:#5E6673;--rule:#DDD7CC;--signal:#0E7C6B;--signal-soft:#DDEFEA;--warm:#A8572A;--warm-soft:#F6E6DA;--amber:#9A6A00;--amber-soft:#F7ECD2;
  --display:"Fraunces",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
:root[data-theme="dark"]{--paper:#11161D;--surface:#19202A;--ink:#ECE8E1;--muted:#A3AAB5;--rule:#2C3542;--signal:#4CC7B0;--signal-soft:#16332E;--warm:#E39A6B;--warm-soft:#3A2A1E;--amber:#E2B65A;--amber-soft:#3A2F14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11161D;--surface:#19202A;--ink:#ECE8E1;--muted:#A3AAB5;--rule:#2C3542;--signal:#4CC7B0;--signal-soft:#16332E;--warm:#E39A6B;--warm-soft:#3A2A1E;--amber:#E2B65A;--amber-soft:#3A2F14}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--signal)}
button{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient i{position:absolute;width:60vw;height:60vw;border-radius:50%;filter:blur(90px);opacity:.5}
.ambient i:first-child{background:#BFE3DA;left:-20vw;top:-25vw}
.ambient i:last-child{background:#F1D9C4;right:-22vw;bottom:-28vw}
:root[data-theme="dark"] .ambient i{opacity:.12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ambient i{opacity:.12}}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 85%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:500;font-size:19px}
.brand i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:700}
.tools{display:flex;align-items:center;gap:14px}
.navlink{color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.navlink:hover{color:var(--signal)}
.switch{display:flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--surface)}
.switch button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font:500 12.5px var(--mono);cursor:pointer;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.theme{border:1px solid var(--rule);background:var(--surface);border-radius:50%;width:34px;height:34px;cursor:pointer}
main{position:relative;z-index:1;padding:40px 0 70px}
.label{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.label .dot{width:8px;height:8px;border-radius:50%;background:var(--signal);display:inline-block}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5vw,52px);line-height:1.05;margin:0 0 14px;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:500;color:var(--signal)}
h2{font-family:var(--display);font-weight:500;font-size:26px;margin:0 0 6px}
h3{font-family:var(--display);font-weight:500;font-size:21px;margin:34px 0 12px}
.lead{font-size:19px;color:var(--muted);max-width:62ch;margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;padding:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 20px;font-weight:600;font-size:15.5px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--signal)}
.btn.p{background:var(--signal);border-color:var(--signal);color:var(--paper)}
.btn.p:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.excard{display:flex;align-items:center;gap:26px;width:100%;margin:28px 0 6px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;background:var(--surface);border:2px solid var(--signal);border-radius:20px;padding:24px 28px;box-shadow:0 18px 40px -24px color-mix(in srgb,var(--signal) 80%,transparent);transition:transform .2s,box-shadow .2s}
.excard:hover,.excard:focus-visible{transform:translateY(-3px);box-shadow:0 22px 46px -22px color-mix(in srgb,var(--signal) 90%,transparent);outline:none}
.extxt{display:flex;flex-direction:column;gap:8px;flex:1}
.extag{align-self:flex-start;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--signal);color:var(--paper)}
.excard b{font-family:var(--display);font-weight:500;font-size:clamp(24px,3vw,30px);line-height:1.15}
.exp{color:var(--muted);font-size:16px;line-height:1.5;max-width:60ch}
.exgo{font-family:var(--mono);font-size:13px;color:var(--signal);margin-top:4px}
.exq{width:120px;height:120px;flex:none;color:var(--ink)}
@media (max-width:620px){.excard{flex-direction:column-reverse;align-items:flex-start;padding:20px}.exq{width:88px;height:88px}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:26px 0}
.steps .card b{display:block;font-family:var(--display);font-weight:500;font-size:19px;margin-bottom:4px}
.steps .card span{font-family:var(--mono);font-size:12px;color:var(--signal)}
.steps .card p{margin:4px 0 0;color:var(--muted);font-size:15px}
.fams{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.fams li{font-size:13.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--muted)}
/* progress */
.prog{display:flex;gap:6px;margin:0 0 22px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--rule)}
.prog i.on{background:var(--signal)}
.prog i.now{background:color-mix(in srgb,var(--signal) 45%,var(--rule))}
/* batch screen */
.cats{display:grid;gap:10px;margin-top:18px}
.cat{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;transition:border-color .2s}
.cat.on{border-color:var(--signal);box-shadow:0 0 0 1px var(--signal) inset}
.cat label.top{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.cat input[type=checkbox]{width:20px;height:20px;accent-color:var(--signal);margin-top:3px;flex-shrink:0}
.cat b{display:block;font-weight:600}
.cat small{display:block;color:var(--muted);font-size:14px}
.cat .names{margin:10px 0 0 32px;display:none}
.cat.on .names{display:block}
.cat .names input{width:100%;border:1px solid var(--rule);border-radius:10px;padding:9px 12px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px}
.cat .names small{margin-top:4px;font-size:12.5px}
.more{margin-top:12px;background:none;border:0;color:var(--signal);font-weight:600;cursor:pointer;padding:6px 0}
.other{margin-top:16px}
.other input{border:1px solid var(--rule);border-radius:10px;padding:9px 12px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px}
.other .pair{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:6px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;flex-wrap:wrap}
.hint{font-size:14px;color:var(--muted)}
/* rating */
.q{margin:18px 0 0}
.q p{margin:0 0 8px;font-weight:600}
.q p small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 4px;cursor:pointer;font-weight:600}
.scale button:hover{border-color:var(--signal)}
.scale button[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--paper)}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px}
.axis{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--signal);margin:26px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--signal-soft);border-color:var(--signal);color:var(--signal);font-weight:600}
.pcats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.pcats span{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--signal-soft);color:var(--signal)}
.renew{margin-top:8px;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink);font:inherit}
/* results */
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0 6px}
.kp div{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px}
.kp b{display:block;font-family:var(--display);font-size:32px;font-weight:500;color:var(--signal);line-height:1.1}
.kp span{font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:16px}
.quad svg{width:100%;height:auto;display:block}
.quad circle{cursor:pointer}
.acts .grp{margin:0 0 14px}
.acts .grp b{display:block;font-size:15.5px}
.acts .grp p{margin:2px 0 4px;font-size:14.5px;color:var(--muted)}
.acts .grp .who{font-size:14px}
.acts .tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--amber-soft);color:var(--amber);margin-left:4px}
.fam{display:grid;grid-template-columns:200px 1fr 56px;gap:12px;align-items:center;margin:8px 0;cursor:pointer;background:none;border:0;width:100%;text-align:left;padding:4px 0}
.fam:hover span:first-child{color:var(--signal)}
.track{height:10px;border-radius:99px;background:var(--rule);overflow:hidden}
.track i{display:block;height:100%;background:var(--signal);border-radius:99px}
.fam em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right}
.famd{margin:0 0 10px 0;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--rule);font-size:14.5px}
.famd ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.famd li span{color:var(--muted)}
.famd li.gap{color:var(--warm)}
.al{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.45;margin:0 0 8px}
.al.g{background:var(--amber-soft)} .al.d{background:var(--warm-soft)} .al.ok{background:var(--signal-soft)}
.al b{font-weight:600}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchips span{font-size:14px;padding:5px 12px;border-radius:999px;border:1px solid var(--rule);color:var(--muted)}
.dchips span.on{background:var(--signal-soft);color:var(--signal);border-color:transparent;font-weight:600}
.copy{margin-top:40px;font-family:var(--mono);font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:var(--ink);color:var(--paper);font:600 14px var(--body);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){.steps,.kp{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.fam{grid-template-columns:130px 1fr 48px}.famd ul{grid-template-columns:1fr}.navlink.hide-m{display:none}}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .35s ease-out}@keyframes fade{from{opacity:0;transform:translateY(6px)}}}
</style>

function quadSVG(list,t){
  const W=420,H=400,L=52,TP=16,S=330,X=v=>L+(v-1)/4*S,Y=s=>TP+(4-(s-1))/4*S;
  const qn=k=>QUAD[k][lang][0];
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.quad)}">`;
  const cell=(x,y,k,fill,col)=>`<rect x="${x}" y="${y}" width="${S/2}" height="${S/2}" fill="${fill}" stroke="var(--rule)"/><text x="${x+S/4}" y="${k[0]==="t"?y+20:y+S/2-12}" text-anchor="middle" font-family="var(--body)" font-size="13" font-weight="600" fill="${col}">${esc(qn(k))}</text>`;
  g+=cell(L,TP,"tl","transparent","var(--muted)")+cell(L+S/2,TP,"tr","var(--signal-soft)","var(--signal)")+cell(L,TP+S/2,"bl","var(--warm-soft)","var(--warm)")+cell(L+S/2,TP+S/2,"br","transparent","var(--muted)");
  for(let n=1;n<=5;n++){g+=`<text x="${X(n)}" y="${TP+S+16}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">${n}</text><text x="${L-10}" y="${Y(n)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${n}</text>`}
  g+=`<text x="${L+S/2}" y="${H-4}" text-anchor="middle" font-size="13" fill="var(--ink)" font-family="var(--body)">${esc(t.xVal)}</text><text transform="translate(14 ${TP+S/2}) rotate(-90)" text-anchor="middle" font-size="13" fill="var(--ink)" font-family="var(--body)">${esc(t.yFit)}</text>`;
  const seen={}, pts=[], boxes=[];
  list.forEach(p=>{let x=X(p.v),y=Y(p.s); const k=Math.round(x)+","+Math.round(y); const n=seen[k]=(seen[k]||0)+1; if(n>1){x+=(n-1)*10; y-=(n-1)*8} pts.push({p,x,y})});
  const hit=(b)=>boxes.some(o=>b.x<o.x+o.w&&b.x+b.w>o.x&&b.y<o.y+o.h&&b.y+b.h>o.y)||pts.some(q=>q.x>b.x-6&&q.x<b.x+b.w+6&&q.y>b.y-6&&q.y<b.y+b.h+6&&!(b.own===q));
  pts.forEach(q=>{const name=q.p.name.length>22?q.p.name.slice(0,21)+"…":q.p.name, w=name.length*6.6, h=14;
    const opts=[[q.x+11,q.y-7,"start"],[q.x-11-w,q.y-7,"end"],[q.x-w/2,q.y-22,"middle"],[q.x-w/2,q.y+9,"middle"]];
    let pick=null;
    for(let dy=0;dy<=56&&!pick;dy+=14){for(const [bx,by,a] of opts){const b={x:bx,y:by+(dy?(dy%28?dy:-dy):0),w,h,own:q,a}; if(b.x>=2&&b.x+b.w<=W-2&&b.y>=2&&b.y+b.h<=H-20&&!hit(b)){pick=b;break}}}
    if(!pick) pick={x:q.x+11,y:q.y-7,w,h,a:"start"};
    boxes.push(pick);
    const tx=pick.a==="start"?pick.x:pick.a==="end"?pick.x+w:pick.x+w/2, lead=Math.abs((pick.y+7)-q.y)>9;
    g+=`<g><title>${esc(q.p.name)} · ${esc(t.value)} ${f1(q.p.v)} · ${esc(t.fit)} ${f1(q.p.s)}</title>${lead?`<line x1="${q.x}" y1="${q.y}" x2="${pick.a==="start"?pick.x-2:pick.a==="end"?pick.x+w+2:tx}" y2="${pick.y+7}" stroke="var(--muted)" stroke-width=".6"/>`:""}<circle cx="${q.x}" cy="${q.y}" r="7" fill="var(--signal)" stroke="var(--surface)" stroke-width="2"/><text x="${tx}" y="${pick.y+11}" text-anchor="${pick.a}" font-size="12" font-family="var(--body)" fill="var(--ink)">${esc(name)}</text></g>`});
  return g+"</svg>";
}
function analyse(S){
  const P=partners(S).map(p=>Object.assign(p,scores(p,S))).filter(p=>p.done).map(p=>Object.assign(p,{q:quadOf(p.v,p.s)}));
  const byCat={}; P.forEach(p=>p.cats.forEach(c=>{(byCat[c]=byCat[c]||[]).push(p)}));
  const allCats=Object.keys(CAT), covered=allCats.filter(c=>byCat[c]), gaps=allCats.filter(c=>CAT[c].key&&!byCat[c]), dups=Object.keys(byCat).filter(c=>byCat[c].length>1);
  const risks=Object.keys(byCat).filter(c=>byCat[c].every(p=>p.q==="bl"));
  const doms={}; P.forEach(p=>((S.dom||{})[p.key]||[]).forEach(d=>doms[d]=1));
  return {P,byCat,covered,gaps,dups,risks,doms};
}
